<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>Transaction - Digital Notebook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            "Poppins",
                            "sans-serif"
                        ]
                    }
                }
            }
        };
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen font-sans">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/95 backdrop-blur">

        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">

            <a
                href="./index.html"
                class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-xl shrink-0"
                aria-label="Back"
            >
                ←
            </a>

            <div class="flex-1 min-w-0">
                <h1 class="font-bold text-base truncate">
                    Transaction
                </h1>

                <p class="text-[11px] text-slate-400">
                    Person-wise transaction records
                </p>
            </div>

            <div
                id="headerAvatar"
                class="w-10 h-10 rounded-full bg-slate-800 overflow-hidden flex items-center justify-center shrink-0"
            >
                <span class="text-slate-400">👤</span>
            </div>

        </div>

    </header>


    <main class="max-w-4xl mx-auto px-4 py-5 pb-28">

        <!-- FORM CARD -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4">

            <div class="flex items-center justify-between gap-3 mb-4">

                <div>
                    <h2
                        id="formTitle"
                        class="font-semibold"
                    >
                        Add Transaction
                    </h2>

                    <p class="text-xs text-slate-400 mt-1">
                        Enter amount and transaction type
                    </p>
                </div>

                <button
                    id="cancelEditBtn"
                    type="button"
                    class="hidden px-3 py-2 rounded-xl bg-slate-800 text-xs"
                >
                    Cancel
                </button>

            </div>


            <!-- PERSON -->
            <div class="mb-4">

                <label
                    for="personName"
                    class="block text-xs text-slate-400 mb-2"
                >
                    Person Name
                </label>

                <input
                    id="personName"
                    type="text"
                    autocomplete="off"
                    placeholder="Enter person name"
                    class="w-full h-12 rounded-xl bg-slate-800 border border-slate-700 px-4 text-sm text-white placeholder:text-slate-500"
                >

            </div>


            <!-- TYPE -->
            <div class="mb-4">

                <label class="block text-xs text-slate-400 mb-2">
                    Transaction Type
                </label>

                <div
                    id="typeGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 gap-2"
                >

                    <button
                        type="button"
                        data-type="Expense"
                        class="type-card"
                    >
                        <span class="type-icon">−</span>
                        <span>Expense</span>
                    </button>

                    <button
                        type="button"
                        data-type="Receivable"
                        class="type-card"
                    >
                        <span class="type-icon">↙</span>
                        <span>Receivable</span>
                    </button>

                    <button
                        type="button"
                        data-type="Payable"
                        class="type-card"
                    >
                        <span class="type-icon">↗</span>
                        <span>Payable</span>
                    </button>

                    <button
                        type="button"
                        data-type="Given"
                        class="type-card"
                    >
                        <span class="type-icon">↑</span>
                        <span>Given</span>
                    </button>

                    <button
                        type="button"
                        data-type="Taken"
                        class="type-card"
                    >
                        <span class="type-icon">↓</span>
                        <span>Taken</span>
                    </button>

                    <button
                        type="button"
                        data-type="Repayment"
                        class="type-card"
                    >
                        <span class="type-icon">↔</span>
                        <span>Repayment</span>
                    </button>

                </div>

                <input
                    id="transactionType"
                    type="hidden"
                    value="Expense"
                >

            </div>


            <!-- NPR / INR -->
            <div class="grid grid-cols-2 gap-3 mb-4">

                <div>

                    <label
                        for="nprAmount"
                        class="block text-xs text-slate-400 mb-2"
                    >
                        NPR
                    </label>

                    <input
                        id="nprAmount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.01"
                        placeholder="0"
                        class="money-input"
                    >

                </div>


                <div>

                    <label
                        for="inrAmount"
                        class="block text-xs text-slate-400 mb-2"
                    >
                        INR
                    </label>

                    <input
                        id="inrAmount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.01"
                        placeholder="0"
                        class="money-input"
                    >

                </div>

            </div>


            <!-- TOTAL -->
            <div class="rounded-2xl bg-slate-800 border border-slate-700 p-4 mb-4">

                <div class="flex items-center justify-between gap-3">

                    <span class="text-sm text-slate-400">
                        Total
                    </span>

                    <strong
                        id="liveTotal"
                        class="text-xl font-bold"
                    >
                        NPR 0.00
                    </strong>

                </div>

                <p
                    id="conversionText"
                    class="text-[11px] text-slate-500 mt-1"
                >
                    1 INR = 1.60 NPR
                </p>

            </div>


            <!-- DATE -->
            <div class="mb-4">

                <label
                    for="transactionDate"
                    class="block text-xs text-slate-400 mb-2"
                >
                    Date
                </label>

                <input
                    id="transactionDate"
                    type="date"
                    class="money-input"
                >

            </div>


            <!-- NOTE -->
            <div class="mb-4">

                <label
                    for="transactionNote"
                    class="block text-xs text-slate-400 mb-2"
                >
                    Note
                </label>

                <textarea
                    id="transactionNote"
                    rows="3"
                    placeholder="Optional note"
                    class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-sm text-white placeholder:text-slate-500 resize-none"
                ></textarea>

            </div>


            <!-- SAVE -->
            <button
                id="saveBtn"
                type="button"
                class="w-full h-12 rounded-xl bg-white text-slate-950 font-semibold active:scale-[0.98] transition"
            >
                Save Transaction
            </button>

        </section>


        <!-- SEARCH -->
        <section class="mt-5">

            <div class="relative">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search person..."
                    class="w-full h-12 rounded-xl bg-slate-900 border border-slate-800 px-4 text-sm text-white placeholder:text-slate-500"
                >

            </div>

        </section>


        <!-- SUMMARY -->
        <section
            id="summaryBox"
            class="grid grid-cols-2 gap-3 mt-4"
        ></section>


        <!-- PEOPLE -->
        <section class="mt-5">

            <div class="flex items-center justify-between mb-3">

                <h2 class="font-semibold">
                    People
                </h2>

                <span
                    id="recordCount"
                    class="text-xs text-slate-500"
                >
                    0 records
                </span>

            </div>

            <div
                id="peopleList"
                class="space-y-3"
            ></div>

        </section>

    </main>


    <!-- PERSON MODAL -->
    <div
        id="personModal"
        class="hidden fixed inset-0 z-50 bg-black/70 p-4 overflow-y-auto"
    >

        <div class="min-h-full flex items-center justify-center">

            <div
                class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden"
            >

                <div class="p-4 border-b border-slate-800 flex items-center gap-3">

                    <div class="flex-1 min-w-0">

                        <h3
                            id="modalPersonName"
                            class="font-bold truncate"
                        >
                            Person
                        </h3>

                        <p
                            id="modalPersonSummary"
                            class="text-xs text-slate-400 mt-1"
                        ></p>

                    </div>

                    <button
                        id="closeModalBtn"
                        type="button"
                        class="w-10 h-10 rounded-xl bg-slate-800"
                    >
                        ×
                    </button>

                </div>


                <div
                    id="modalRecords"
                    class="p-4 space-y-3"
                ></div>


                <div class="p-4 border-t border-slate-800">

                    <button
                        id="personPdfBtn"
                        type="button"
                        class="w-full h-11 rounded-xl bg-white text-slate-950 font-semibold"
                    >
                        Generate PDF
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- PDF AREA -->
    <div
        id="pdfArea"
        class="hidden"
    ></div>


    <style>

        .type-card {
            min-height: 72px;
            border-radius: 14px;
            border: 1px solid rgb(51 65 85);
            background: rgb(30 41 59);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-direction: column;
            font-size: 12px;
            transition: 0.15s ease;
        }

        .type-card:active {
            transform: scale(0.97);
        }

        .type-card.active {
            border-color: white;
            background: rgb(51 65 85);
            box-shadow:
                0 0 0 1px white inset;
        }

        .type-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(15 23 42);
            font-size: 16px;
            font-weight: 700;
        }

        .money-input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: rgb(30 41 59);
            border: 1px solid rgb(51 65 85);
            padding: 0 14px;
            color: white;
            font-size: 14px;
        }

        .money-input::placeholder {
            color: rgb(100 116 139);
        }

        .money-input:focus,
        textarea:focus,
        input:focus {
            border-color: rgb(148 163 184);
        }

        .person-card {
            background: rgb(15 23 42);
            border: 1px solid rgb(30 41 59);
            border-radius: 16px;
            padding: 14px;
        }

        .record-card {
            background: rgb(30 41 59);
            border: 1px solid rgb(51 65 85);
            border-radius: 14px;
            padding: 12px;
        }

    </style>


    <script type="module">

        import {
            getData,
            saveData,
            getProfileValue
        } from "./js/storage.js";


        const STORAGE_KEY =
            "digital_notebook_v2_transactions";

        const INR_RATE = 1.6;


        const personName =
            document.getElementById(
                "personName"
            );

        const transactionType =
            document.getElementById(
                "transactionType"
            );

        const nprAmount =
            document.getElementById(
                "nprAmount"
            );

        const inrAmount =
            document.getElementById(
                "inrAmount"
            );

        const liveTotal =
            document.getElementById(
                "liveTotal"
            );

        const transactionDate =
            document.getElementById(
                "transactionDate"
            );

        const transactionNote =
            document.getElementById(
                "transactionNote"
            );

        const saveBtn =
            document.getElementById(
                "saveBtn"
            );

        const formTitle =
            document.getElementById(
                "formTitle"
            );

        const cancelEditBtn =
            document.getElementById(
                "cancelEditBtn"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const peopleList =
            document.getElementById(
                "peopleList"
            );

        const recordCount =
            document.getElementById(
                "recordCount"
            );

        const summaryBox =
            document.getElementById(
                "summaryBox"
            );

        const personModal =
            document.getElementById(
                "personModal"
            );

        const modalPersonName =
            document.getElementById(
                "modalPersonName"
            );

        const modalPersonSummary =
            document.getElementById(
                "modalPersonSummary"
            );

        const modalRecords =
            document.getElementById(
                "modalRecords"
            );

        const closeModalBtn =
            document.getElementById(
                "closeModalBtn"
            );

        const personPdfBtn =
            document.getElementById(
                "personPdfBtn"
            );

        const headerAvatar =
            document.getElementById(
                "headerAvatar"
            );


        let transactions = [];
        let editingId = null;
        let openedPerson = null;


        function today() {

            return new Date()
                .toISOString()
                .split("T")[0];

        }


        function money(value) {

            return Number(value || 0)
                .toLocaleString(
                    "en-IN",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        function getTransactions() {

            const data =
                getData(
                    "transactions",
                    null
                );

            if (Array.isArray(data)) {
                return data;
            }

            const oldData =
                getData(
                    "transactionData",
                    []
                );

            return Array.isArray(oldData)
                ? oldData
                : [];

        }


        function saveTransactions() {

            saveData(
                "transactions",
                transactions
            );

        }


        function calculateTotal() {

            const npr =
                Number(
                    nprAmount.value
                ) || 0;

            const inr =
                Number(
                    inrAmount.value
                ) || 0;

            const total =
                npr + (inr * INR_RATE);

            liveTotal.textContent =
                `NPR ${money(total)}`;

            return total;

        }


        function selectType(type) {

            transactionType.value =
                type;

            document
                .querySelectorAll(
                    ".type-card"
                )
                .forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.type === type
                    );

                });

        }


        function resetForm() {

            editingId = null;

            personName.value = "";
            nprAmount.value = "";
            inrAmount.value = "";
            transactionNote.value = "";

            transactionDate.value =
                today();

            selectType(
                "Expense"
            );

            calculateTotal();

            formTitle.textContent =
                "Add Transaction";

            saveBtn.textContent =
                "Save Transaction";

            cancelEditBtn.classList.add(
                "hidden"
            );

        }


        function loadForEdit(item) {

            editingId =
                item.id;

            personName.value =
                item.personName || "";

            transactionDate.value =
                item.date || today();

            transactionNote.value =
                item.note || "";

            nprAmount.value =
                item.npr || "";

            inrAmount.value =
                item.inr || "";

            selectType(
                item.type || "Expense"
            );

            calculateTotal();

            formTitle.textContent =
                "Edit Transaction";

            saveBtn.textContent =
                "Update Transaction";

            cancelEditBtn.classList.remove(
                "hidden"
            );

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        function createTransaction() {

            const name =
                personName.value.trim();

            if (!name) {
                personName.focus();
                return;
            }

            const npr =
                Number(
                    nprAmount.value
                ) || 0;

            const inr =
                Number(
                    inrAmount.value
                ) || 0;

            const total =
                npr + (inr * INR_RATE);

            if (total <= 0) {
                nprAmount.focus();
                return;
            }


            if (editingId) {

                const index =
                    transactions.findIndex(
                        item =>
                            item.id === editingId
                    );

                if (index !== -1) {

                    transactions[index] = {
                        ...transactions[index],

                        personName:
                            name,

                        type:
                            transactionType.value,

                        npr,
                        inr,
                        total,
                        amount: total,

                        date:
                            transactionDate.value
                            || today(),

                        note:
                            transactionNote.value
                                .trim(),

                        updatedAt:
                            Date.now()
                    };

                }

            } else {

                const newTransaction = {

                    id:
                        `transaction_${Date.now()}_${Math.random()
                            .toString(36)
                            .slice(2, 8)}`,

                    personName:
                        name,

                    type:
                        transactionType.value,

                    npr,
                    inr,

                    total,
                    amount: total,

                    date:
                        transactionDate.value
                        || today(),

                    note:
                        transactionNote.value
                            .trim(),

                    createdAt:
                        Date.now(),

                    updatedAt:
                        Date.now()

                };

                transactions.unshift(
                    newTransaction
                );

            }


            saveTransactions();

            resetForm();

            render();

        }


        function deleteTransaction(id) {

            transactions =
                transactions.filter(
                    item =>
                        item.id !== id
                );

            saveTransactions();

            render();

        }


        function getPeople() {

            const map =
                new Map();

            transactions.forEach(
                item => {

                    const name =
                        String(
                            item.personName
                            || item.person
                            || ""
                        ).trim();

                    if (!name) {
                        return;
                    }

                    const key =
                        name.toLowerCase();

                    if (!map.has(key)) {

                        map.set(
                            key,
                            {
                                name,
                                records: []
                            }
                        );

                    }

                    map.get(key)
                        .records
                        .push(item);

                }
            );

            return Array.from(
                map.values()
            );

        }


        function getFilteredPeople() {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();

            const people =
                getPeople();

            if (!query) {
                return people;
            }

            return people.filter(
                person =>
                    person.name
                        .toLowerCase()
                        .includes(query)
            );

        }


        function renderSummary() {

            let expense = 0;
            let receivable = 0;
            let payable = 0;
            let given = 0;
            let taken = 0;
            let repayment = 0;

            transactions.forEach(
                item => {

                    const amount =
                        Number(
                            item.total
                            ?? item.amount
                        ) || 0;

                    switch (
                        String(
                            item.type
                        ).toLowerCase()
                    ) {

                        case "expense":
                            expense += amount;
                            break;

                        case "receivable":
                            receivable += amount;
                            break;

                        case "payable":
                            payable += amount;
                            break;

                        case "given":
                            given += amount;
                            break;

                        case "taken":
                            taken += amount;
                            break;

                        case "repayment":
                            repayment += amount;
                            break;

                    }

                }
            );


            summaryBox.innerHTML = `

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                    <p class="text-[11px] text-slate-500">Expense</p>
                    <p class="font-semibold mt-1">
                        NPR ${money(expense)}
                    </p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                    <p class="text-[11px] text-slate-500">Receivable</p>
                    <p class="font-semibold mt-1">
                        NPR ${money(receivable)}
                    </p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                    <p class="text-[11px] text-slate-500">Payable</p>
                    <p class="font-semibold mt-1">
                        NPR ${money(payable)}
                    </p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                    <p class="text-[11px] text-slate-500">Given / Taken</p>
                    <p class="font-semibold mt-1">
                        NPR ${money(given + taken)}
                    </p>
                </div>

            `;

        }


        function render() {

            renderSummary();

            const people =
                getFilteredPeople();

            recordCount.textContent =
                `${transactions.length} records`;

            if (!people.length) {

                peopleList.innerHTML = `

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">

                        <div class="text-3xl mb-3">
                            🧾
                        </div>

                        <p class="text-sm text-slate-400">
                            No transaction records
                        </p>

                    </div>

                `;

                return;

            }


            peopleList.innerHTML =
                people.map(
                    person => {

                        const total =
                            person.records.reduce(
                                (
                                    sum,
                                    item
                                ) =>
                                    sum
                                    +
                                    (
                                        Number(
                                            item.total
                                            ?? item.amount
                                        )
                                        || 0
                                    ),
                                0
                            );


                        const latest =
                            person.records[0];


                        return `

                            <button
                                type="button"
                                class="person-card w-full text-left"
                                data-person="${escapeHtml(person.name)}"
                            >

                                <div class="flex items-center gap-3">

                                    <div class="w-11 h-11 rounded-full bg-slate-800 flex items-center justify-center font-semibold">
                                        ${escapeHtml(
                                            person.name
                                                .charAt(0)
                                                .toUpperCase()
                                        )}
                                    </div>

                                    <div class="flex-1 min-w-0">

                                        <p class="font-semibold truncate">
                                            ${escapeHtml(
                                                person.name
                                            )}
                                        </p>

                                        <p class="text-[11px] text-slate-500 mt-1">
                                            ${person.records.length} record${person.records.length === 1 ? "" : "s"}
                                            •
                                            ${escapeHtml(
                                                latest.type || ""
                                            )}
                                        </p>

                                    </div>

                                    <div class="text-right">

                                        <p class="font-semibold text-sm">
                                            NPR ${money(total)}
                                        </p>

                                        <p class="text-[11px] text-slate-500 mt-1">
                                            View →
                                        </p>

                                    </div>

                                </div>

                            </button>

                        `;

                    }
                ).join("");

        }


        function openPerson(name) {

            openedPerson =
                getPeople()
                    .find(
                        person =>
                            person.name
                                .toLowerCase()
                            ===
                            name
                                .toLowerCase()
                    );

            if (!openedPerson) {
                return;
            }

            modalPersonName.textContent =
                openedPerson.name;

            const total =
                openedPerson.records.reduce(
                    (
                        sum,
                        item
                    ) =>
                        sum
                        +
                        (
                            Number(
                                item.total
                                ?? item.amount
                            )
                            || 0
                        ),
                    0
                );

            modalPersonSummary.textContent =
                `${openedPerson.records.length} records • NPR ${money(total)}`;


            modalRecords.innerHTML =
                openedPerson.records
                    .map(
                        item =>
                            `

                            <div class="record-card">

                                <div class="flex items-start gap-3">

                                    <div class="flex-1">

                                        <div class="flex items-center gap-2 flex-wrap">

                                            <span class="text-sm font-semibold">
                                                ${escapeHtml(
                                                    item.type
                                                )}
                                            </span>

                                            <span class="text-[10px] text-slate-500">
                                                ${escapeHtml(
                                                    item.date || ""
                                                )}
                                            </span>

                                        </div>

                                        <p class="text-lg font-bold mt-2">
                                            NPR ${money(
                                                item.total
                                                ?? item.amount
                                            )}
                                        </p>

                                        <p class="text-[11px] text-slate-500 mt-1">
                                            NPR ${money(item.npr)}
                                            +
                                            INR ${money(item.inr)}
                                        </p>

                                        ${
                                            item.note
                                                ? `
                                                <p class="text-xs text-slate-400 mt-2">
                                                    ${escapeHtml(
                                                        item.note
                                                    )}
                                                </p>
                                                `
                                                : ""
                                        }

                                    </div>

                                    <div class="flex gap-1">

                                        <button
                                            type="button"
                                            class="edit-record w-9 h-9 rounded-lg bg-slate-800 text-xs"
                                            data-id="${escapeHtml(item.id)}"
                                        >
                                            Edit
                                        </button>

                                        <button
                                            type="button"
                                            class="delete-record w-9 h-9 rounded-lg bg-slate-800 text-xs"
                                            data-id="${escapeHtml(item.id)}"
                                        >
                                            ×
                                        </button>

                                    </div>

                                </div>

                            </div>

                            `
                    )
                    .join("");


            personModal.classList.remove(
                "hidden"
            );

        }


        function closePerson() {

            personModal.classList.add(
                "hidden"
            );

            openedPerson = null;

        }


        function getProfile() {

            return {

                name:
                    getProfileValue(
                        "profile_name",
                        ""
                    ),

                address:
                    getProfileValue(
                        "profile_address",
                        ""
                    ),

                mobile:
                    getProfileValue(
                        "profile_mobile",
                        ""
                    ),

                email:
                    getProfileValue(
                        "profile_email",
                        ""
                    ),

                avatar:
                    getProfileValue(
                        "profile_avatar",
                        ""
                    )

            };

        }


        function loadAvatar() {

            const profile =
                getProfile();

            if (profile.avatar) {

                headerAvatar.innerHTML =
                    `
                    <img
                        src="${profile.avatar}"
                        class="w-full h-full object-cover"
                        alt="Profile"
                    >
                    `;

            } else if (profile.name) {

                headerAvatar.innerHTML =
                    `
                    <span class="font-semibold">
                        ${escapeHtml(
                            profile.name
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </span>
                    `;

            }

        }


        function buildPdf(person) {

            const profile =
                getProfile();

            const records =
                person.records;


            const total =
                records.reduce(
                    (
                        sum,
                        item
                    ) =>
                        sum
                        +
                        (
                            Number(
                                item.total
                                ?? item.amount
                            )
                            || 0
                        ),
                    0
                );


            const rows =
                records.map(
                    item =>
                        `

                        <tr>

                            <td style="padding:8px;border:1px solid #ddd;">
                                ${escapeHtml(
                                    item.date || ""
                                )}
                            </td>

                            <td style="padding:8px;border:1px solid #ddd;">
                                ${escapeHtml(
                                    item.type || ""
                                )}
                            </td>

                            <td style="padding:8px;border:1px solid #ddd;text-align:right;">
                                ${money(item.npr)}
                            </td>

                            <td style="padding:8px;border:1px solid #ddd;text-align:right;">
                                ${money(item.inr)}
                            </td>

                            <td style="padding:8px;border:1px solid #ddd;text-align:right;font-weight:bold;">
                                ${money(
                                    item.total
                                    ?? item.amount
                                )}
                            </td>

                            <td style="padding:8px;border:1px solid #ddd;">
                                ${escapeHtml(
                                    item.note || ""
                                )}
                            </td>

                        </tr>

                        `
                ).join("");


            return `

                <div
                    style="
                        width:794px;
                        background:white;
                        color:#111;
                        padding:32px;
                        font-family:Arial,sans-serif;
                    "
                >

                    <div
                        style="
                            border-bottom:2px solid #111;
                            padding-bottom:16px;
                            margin-bottom:20px;
                        "
                    >

                        <h1
                            style="
                                margin:0;
                                font-size:26px;
                            "
                        >
                            Digital Notebook
                        </h1>

                        <p
                            style="
                                margin:5px 0 0;
                                color:#555;
                            "
                        >
                            Transaction Report
                        </p>

                    </div>


                    <div
                        style="
                            display:flex;
                            gap:20px;
                            margin-bottom:24px;
                        "
                    >

                        ${
                            profile.avatar
                                ? `
                                <img
                                    src="${profile.avatar}"
                                    style="
                                        width:80px;
                                        height:80px;
                                        object-fit:cover;
                                        border-radius:50%;
                                    "
                                >
                                `
                                : ""
                        }

                        <div>

                            <h2
                                style="
                                    margin:0 0 8px;
                                    font-size:21px;
                                "
                            >
                                ${escapeHtml(
                                    person.name
                                )}
                            </h2>

                            ${
                                profile.name
                                    ? `
                                    <p style="margin:3px 0;">
                                        Name: ${escapeHtml(
                                            profile.name
                                        )}
                                    </p>
                                    `
                                    : ""
                            }

                            ${
                                profile.mobile
                                    ? `
                                    <p style="margin:3px 0;">
                                        Mobile: ${escapeHtml(
                                            profile.mobile
                                        )}
                                    </p>
                                    `
                                    : ""
                            }

                            ${
                                profile.email
                                    ? `
                                    <p style="margin:3px 0;">
                                        Email: ${escapeHtml(
                                            profile.email
                                        )}
                                    </p>
                                    `
                                    : ""
                            }

                            ${
                                profile.address
                                    ? `
                                    <p style="margin:3px 0;">
                                        Address: ${escapeHtml(
                                            profile.address
                                        )}
                                    </p>
                                    `
                                    : ""
                            }

                        </div>

                    </div>


                    <div
                        style="
                            background:#f1f5f9;
                            padding:14px;
                            margin-bottom:20px;
                        "
                    >

                        <strong>
                            Total Transaction Amount:
                        </strong>

                        <span style="float:right;">
                            NPR ${money(total)}
                        </span>

                    </div>


                    <table
                        style="
                            width:100%;
                            border-collapse:collapse;
                            font-size:11px;
                        "
                    >

                        <thead>

                            <tr style="background:#f1f5f9;">

                                <th style="padding:8px;border:1px solid #ddd;text-align:left;">
                                    Date
                                </th>

                                <th style="padding:8px;border:1px solid #ddd;text-align:left;">
                                    Type
                                </th>

                                <th style="padding:8px;border:1px solid #ddd;text-align:right;">
                                    NPR
                                </th>

                                <th style="padding:8px;border:1px solid #ddd;text-align:right;">
                                    INR
                                </th>

                                <th style="padding:8px;border:1px solid #ddd;text-align:right;">
                                    Total
                                </th>

                                <th style="padding:8px;border:1px solid #ddd;text-align:left;">
                                    Note
                                </th>

                            </tr>

                        </thead>

                        <tbody>
                            ${rows}
                        </tbody>

                    </table>


                    <p
                        style="
                            margin-top:24px;
                            font-size:10px;
                            color:#777;
                        "
                    >
                        Generated by Digital Notebook
                    </p>

                </div>

            `;

        }


        async function generatePersonPdf() {

            if (
                !openedPerson
                ||
                !openedPerson.records.length
            ) {
                return;
            }


            const pdfArea =
                document.getElementById(
                    "pdfArea"
                );

            pdfArea.innerHTML =
                buildPdf(
                    openedPerson
                );

            pdfArea.classList.remove(
                "hidden"
            );


            const filename =
                `transaction-${openedPerson.name
                    .trim()
                    .replace(
                        /[^a-z0-9\u0900-\u097F]+/gi,
                        "-"
                    )
                    .replace(
                        /^-+|-+$/g,
                        ""
                    )
                    || "person"
                }.pdf`;


            await html2pdf()
                .set({

                    margin: 0,

                    filename,

                    image: {
                        type: "jpeg",
                        quality: 0.95
                    },

                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#ffffff"
                    },

                    jsPDF: {
                        unit: "mm",
                        format: "a4",
                        orientation: "portrait"
                    },

                    pagebreak: {
                        mode: [
                            "css",
                            "legacy"
                        ]
                    }

                })
                .from(pdfArea)
                .save();


            pdfArea.classList.add(
                "hidden"
            );

            pdfArea.innerHTML = "";

        }


        /* TYPE BUTTONS */

        document
            .querySelectorAll(
                ".type-card"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        selectType(
                            button.dataset.type
                        );

                    }
                );

            });


        /* LIVE TOTAL */

        nprAmount.addEventListener(
            "input",
            calculateTotal
        );

        inrAmount.addEventListener(
            "input",
            calculateTotal
        );


        /* SAVE */

        saveBtn.addEventListener(
            "click",
            createTransaction
        );


        /* CANCEL EDIT */

        cancelEditBtn.addEventListener(
            "click",
            resetForm
        );


        /* SEARCH */

        searchInput.addEventListener(
            "input",
            render
        );


        /* PERSON CLICK */

        peopleList.addEventListener(
            "click",
            event => {

                const card =
                    event.target.closest(
                        "[data-person]"
                    );

                if (!card) {
                    return;
                }

                openPerson(
                    card.dataset.person
                );

            }
        );


        /* MODAL CLOSE */

        closeModalBtn.addEventListener(
            "click",
            closePerson
        );


        personModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    personModal
                ) {
                    closePerson();
                }

            }
        );


        /* EDIT / DELETE */

        modalRecords.addEventListener(
            "click",
            event => {

                const editButton =
                    event.target.closest(
                        ".edit-record"
                    );

                if (editButton) {

                    const item =
                        transactions.find(
                            transaction =>
                                transaction.id
                                ===
                                editButton.dataset.id
                        );

                    if (item) {

                        closePerson();

                        loadForEdit(
                            item
                        );

                    }

                    return;

                }


                const deleteButton =
                    event.target.closest(
                        ".delete-record"
                    );

                if (deleteButton) {

                    deleteTransaction(
                        deleteButton.dataset.id
                    );

                    if (openedPerson) {

                        const updated =
                            getPeople().find(
                                person =>
                                    person.name
                                        .toLowerCase()
                                    ===
                                    openedPerson.name
                                        .toLowerCase()
                            );

                        if (updated) {

                            openedPerson =
                                updated;

                            openPerson(
                                updated.name
                            );

                        } else {

                            closePerson();

                        }

                    }

                }

            }
        );


        /* PDF */

        personPdfBtn.addEventListener(
            "click",
            generatePersonPdf
        );


        /* INIT */

        transactions =
            getTransactions();

        transactionDate.value =
            today();

        selectType(
            "Expense"
        );

        calculateTotal();

        loadAvatar();

        render();

    </script>

</body>
</html>
