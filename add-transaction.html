<!DOCTYPE html>
<html lang="ne">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Transaction - Digital Notebook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: Poppins, sans-serif;
        }

        .type-card {
            transition: 0.15s ease;
        }

        .type-card:active {
            transform: scale(0.97);
        }

        .selected-type {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.12) !important;
        }

        .person-card {
            transition: 0.15s ease;
        }

        .person-card:active {
            transform: scale(0.99);
        }

        .pdf-page {
            width: 794px;
            min-height: 1123px;
            padding: 40px;
            background: #ffffff;
            color: #111827;
            font-family: Arial, sans-serif;
        }

        .amount-box {
            transition: 0.2s ease;
        }

    </style>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<!-- HEADER -->

<header
    class="sticky top-0 z-30 bg-gray-900/95 backdrop-blur border-b border-gray-800"
>

    <div
        class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3"
    >

        <a
            href="./index.html"
            class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xl"
        >
            ←
        </a>

        <div>

            <h1 class="font-bold text-lg">
                लेनदेन
            </h1>

            <p class="text-xs text-gray-400">
                व्यक्तिअनुसार पूरा हिसाब
            </p>

        </div>

    </div>

</header>



<main
    class="max-w-3xl mx-auto px-4 py-5 pb-24"
>


<!-- SUMMARY -->

<section
    class="grid grid-cols-2 gap-3 mb-5"
>

    <div
        class="bg-gray-900 border border-gray-800 rounded-2xl p-4"
    >

        <p class="text-xs text-gray-400">
            कुल लेनदेन
        </p>

        <p
            id="totalRecords"
            class="text-2xl font-bold mt-1"
        >
            0
        </p>

    </div>


    <div
        class="bg-gray-900 border border-gray-800 rounded-2xl p-4"
    >

        <p class="text-xs text-gray-400">
            व्यक्तिहरू
        </p>

        <p
            id="totalPeople"
            class="text-2xl font-bold mt-1"
        >
            0
        </p>

    </div>

</section>



<!-- FORM -->

<section
    class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-6"
>

    <h2 class="font-semibold text-lg mb-4">
        नयाँ लेनदेन
    </h2>


    <input
        type="hidden"
        id="editId"
    >


    <!-- PERSON -->

    <label class="text-sm text-gray-300">
        व्यक्तिको नाम
    </label>

    <input
        id="personName"
        type="text"
        autocomplete="off"
        placeholder="जस्तै: Kamal"
        class="w-full mt-2 mb-4 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
    >



    <!-- TYPE -->

    <label class="text-sm text-gray-300">
        लेनदेनको प्रकार
    </label>


    <div
        class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2 mb-5"
    >

        <button
            type="button"
            class="type-card selected-type bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="expense"
        >

            <div class="font-semibold">
                खर्च
            </div>

            <div class="text-xs text-gray-400">
                Expense
            </div>

        </button>


        <button
            type="button"
            class="type-card bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="receivable"
        >

            <div class="font-semibold">
                लिनुपर्ने
            </div>

            <div class="text-xs text-gray-400">
                Receivable
            </div>

        </button>


        <button
            type="button"
            class="type-card bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="payable"
        >

            <div class="font-semibold">
                दिनुपर्ने
            </div>

            <div class="text-xs text-gray-400">
                Payable
            </div>

        </button>


        <button
            type="button"
            class="type-card bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="given"
        >

            <div class="font-semibold">
                दिएको पैसा
            </div>

            <div class="text-xs text-gray-400">
                केही समयका लागि
            </div>

        </button>


        <button
            type="button"
            class="type-card bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="taken"
        >

            <div class="font-semibold">
                लिएको पैसा
            </div>

            <div class="text-xs text-gray-400">
                केही समयका लागि
            </div>

        </button>


        <button
            type="button"
            class="type-card bg-gray-800 border border-gray-700 rounded-xl p-3 text-left"
            data-type="repayment"
        >

            <div class="font-semibold">
                फिर्ता
            </div>

            <div class="text-xs text-gray-400">
                पैसा फिर्ता
            </div>

        </button>

    </div>



    <!-- NPR -->

    <label class="text-sm text-gray-300">
        नेपाली रुपैयाँ (NPR)
    </label>

    <input
        id="npr"
        type="number"
        inputmode="decimal"
        min="0"
        step="0.01"
        placeholder="0"
        class="w-full mt-2 mb-4 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
    >



    <!-- INR -->

    <label class="text-sm text-gray-300">
        भारतीय रुपैयाँ (INR)
    </label>

    <input
        id="inr"
        type="number"
        inputmode="decimal"
        min="0"
        step="0.01"
        placeholder="0"
        class="w-full mt-2 mb-4 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
    >



    <!-- LIVE TOTAL -->

    <div
        class="amount-box rounded-2xl bg-green-500/10 border border-green-500/30 p-4 mb-5"
    >

        <div class="flex items-center justify-between">

            <div>

                <p class="text-xs text-gray-400">
                    जम्मा रकम
                </p>

                <p
                    id="liveTotal"
                    class="text-3xl font-bold text-green-400 mt-1"
                >
                    NPR 0.00
                </p>

            </div>

            <div class="text-right">

                <p class="text-xs text-gray-500">
                    Rate
                </p>

                <p class="text-sm font-semibold">
                    1 INR = 1.6 NPR
                </p>

            </div>

        </div>


        <p
            id="conversionText"
            class="text-xs text-gray-400 mt-3"
        >
            NPR 0 + INR 0 × 1.6 = NPR 0
        </p>

    </div>



    <!-- DATE -->

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

        <div>

            <label class="text-sm text-gray-300">
                लेनदेन मिति
            </label>

            <input
                id="date"
                type="date"
                class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
            >

        </div>


        <div>

            <label class="text-sm text-gray-300">
                फिर्ता / Due Date
            </label>

            <input
                id="dueDate"
                type="date"
                class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
            >

        </div>

    </div>



    <!-- NOTE -->

    <label class="text-sm text-gray-300 block mt-4">
        नोट
    </label>

    <textarea
        id="note"
        rows="3"
        placeholder="आवश्यक भएमा विवरण लेख्नुहोस्..."
        class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-800 border border-gray-700"
    ></textarea>



    <!-- SAVE -->

    <button
        id="saveBtn"
        type="button"
        class="w-full mt-4 py-3 rounded-xl bg-green-600 hover:bg-green-500 font-semibold"
    >
        लेनदेन सुरक्षित गर्नुहोस्
    </button>


    <button
        id="cancelEditBtn"
        type="button"
        class="hidden w-full mt-2 py-3 rounded-xl bg-gray-700 font-semibold"
    >
        Edit बन्द गर्नुहोस्
    </button>

</section>



<!-- SEARCH -->

<section class="mb-4">

    <input
        id="searchInput"
        type="search"
        autocomplete="off"
        placeholder="व्यक्तिको नाम खोज्नुहोस्..."
        class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-800"
    >

</section>



<!-- PEOPLE -->

<section>

    <div class="flex items-center justify-between mb-3">

        <h2 class="font-semibold">
            व्यक्तिअनुसार हिसाब
        </h2>

        <span
            id="resultCount"
            class="text-xs text-gray-400"
        >
        </span>

    </div>


    <div
        id="peopleList"
        class="space-y-3"
    ></div>


    <div
        id="emptyState"
        class="hidden text-center py-12 text-gray-500"
    >

        <p class="text-lg">
            अहिलेसम्म कुनै लेनदेन छैन।
        </p>

        <p class="text-sm mt-1">
            माथिबाट पहिलो लेनदेन थप्नुहोस्।
        </p>

    </div>

</section>

</main>



<!-- PDF -->

<div
    id="pdfArea"
    class="hidden"
></div>



<script type="module">

import "./js/app.js";

import {
    getTransactions,
    addTransaction,
    updateTransaction,
    deleteTransaction
} from "./js/transactions.js";

import {
    getProfileValue
} from "./js/storage.js";


const INR_RATE = 1.6;

let selectedType = "expense";

let transactions = getTransactions();



const $ = (id) =>
    document.getElementById(id);



const personName = $("personName");
const npr = $("npr");
const inr = $("inr");
const date = $("date");
const dueDate = $("dueDate");
const note = $("note");
const editId = $("editId");
const saveBtn = $("saveBtn");
const cancelEditBtn = $("cancelEditBtn");
const liveTotal = $("liveTotal");
const conversionText = $("conversionText");
const searchInput = $("searchInput");
const peopleList = $("peopleList");



/* TODAY */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


date.value = today();



/* TYPE */

document
    .querySelectorAll(".type-card")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".type-card")
                    .forEach(item => {

                        item.classList.remove(
                            "selected-type"
                        );

                    });


                button.classList.add(
                    "selected-type"
                );


                selectedType =
                    button.dataset.type;

            }
        );

    });



/* LIVE CONVERSION */

function calculateTotal() {

    const nprValue =
        Number(npr.value) || 0;

    const inrValue =
        Number(inr.value) || 0;


    const convertedINR =
        inrValue * INR_RATE;


    const total =
        nprValue + convertedINR;


    liveTotal.textContent =
        `NPR ${formatMoney(total)}`;


    conversionText.textContent =
        `NPR ${formatMoney(nprValue)} + INR ${formatMoney(inrValue)} × 1.6 = NPR ${formatMoney(total)}`;


    return total;

}


npr.addEventListener(
    "input",
    calculateTotal
);


inr.addEventListener(
    "input",
    calculateTotal
);



/* SAVE */

saveBtn.addEventListener(
    "click",
    saveForm
);


function saveForm() {

    const name =
        cleanName(
            personName.value
        );


    const nprValue =
        Number(npr.value) || 0;


    const inrValue =
        Number(inr.value) || 0;


    const total =
        nprValue +
        (
            inrValue * INR_RATE
        );


    if (!name) {

        alert(
            "व्यक्तिको नाम लेख्नुहोस्।"
        );

        personName.focus();

        return;

    }


    if (total <= 0) {

        alert(
            "NPR वा INR मा रकम लेख्नुहोस्।"
        );

        return;

    }


    const data = {

        type:
            selectedType,

        partyName:
            name,

        npr:
            nprValue,

        inr:
            inrValue,

        amount:
            total,

        date:
            date.value || today(),

        dueDate:
            dueDate.value || "",

        note:
            note.value.trim(),

        status:
            "pending"

    };


    let result;


    if (editId.value) {

        result =
            updateTransaction(
                editId.value,
                data
            );

    } else {

        result =
            addTransaction(
                data
            );

    }


    if (!result) {

        alert(
            "लेनदेन Save हुन सकेन।"
        );

        return;

    }


    transactions =
        getTransactions();


    resetForm();

    render();


    alert(
        "लेनदेन सुरक्षित भयो।"
    );

}



/* RESET */

function resetForm() {

    personName.value = "";

    npr.value = "";

    inr.value = "";

    dueDate.value = "";

    note.value = "";

    date.value = today();

    editId.value = "";

    selectedType = "expense";


    document
        .querySelectorAll(".type-card")
        .forEach(button => {

            button.classList.toggle(
                "selected-type",
                button.dataset.type === "expense"
            );

        });


    saveBtn.textContent =
        "लेनदेन सुरक्षित गर्नुहोस्";


    cancelEditBtn.classList.add(
        "hidden"
    );


    calculateTotal();

}


cancelEditBtn.addEventListener(
    "click",
    resetForm
);



/* SEARCH */

searchInput.addEventListener(
    "input",
    render
);



/* GROUP PEOPLE */

function getPeopleGroups() {

    const groups = {};


    for (
        const item
        of transactions
    ) {

        const name =
            cleanName(
                item.partyName
            );


        if (!name) {
            continue;
        }


        const key =
            name.toLowerCase();


        if (!groups[key]) {

            groups[key] = {

                name: name,

                records: []

            };

        }


        groups[key].records.push(
            item
        );

    }


    return Object.values(groups);

}



/* RENDER */

function render() {

    transactions =
        getTransactions();


    const groups =
        getPeopleGroups();


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        groups.filter(group =>
            group.name
                .toLowerCase()
                .includes(search)
        );


    $("totalRecords").textContent =
        transactions.length;


    $("totalPeople").textContent =
        groups.length;


    $("resultCount").textContent =
        `${filtered.length} व्यक्ति`;


    peopleList.innerHTML = "";


    $("emptyState").classList.toggle(
        "hidden",
        filtered.length > 0
    );


    filtered.forEach(group => {

        peopleList.appendChild(
            createPersonCard(group)
        );

    });

}



/* PERSON CARD */

function createPersonCard(group) {

    const card =
        document.createElement("div");


    card.className =
        "person-card bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden";


    let expense = 0;
    let receivable = 0;
    let payable = 0;
    let given = 0;
    let taken = 0;
    let repayment = 0;


    group.records.forEach(item => {

        const amount =
            Number(item.amount) || 0;


        switch (item.type) {

            case "expense":
                expense += amount;
                break;

            case "receivable":
                receivable += amount;
                break;

            case "payable":
                payable += amount;
                break;

            case "given":
                given += amount;
                break;

            case "taken":
                taken += amount;
                break;

            case "repayment":
                repayment += amount;
                break;

        }

    });


    const balance =
        receivable
        +
        given
        -
        payable
        -
        taken
        -
        repayment;


    const id =
        getPersonId(group.name);


    const header =
        document.createElement("div");


    header.className = "p-4";


    header.innerHTML = `

        <div class="flex items-center justify-between gap-3">

            <div>

                <h3 class="font-bold text-lg">
                    ${escapeHtml(group.name)}
                </h3>

                <p class="text-xs text-gray-400">
                    ${group.records.length} वटा लेनदेन
                </p>

            </div>


            <div class="text-right">

                <p class="text-xs text-gray-400">
                    बाँकी हिसाब
                </p>

                <p class="font-bold ${
                    balance >= 0
                        ? "text-green-400"
                        : "text-red-400"
                }">

                    NPR ${formatMoney(
                        Math.abs(balance)
                    )}

                </p>

            </div>

        </div>


        <div class="grid grid-cols-2 gap-2 mt-4">

            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    दिएको
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(given)}
                </p>

            </div>


            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    लिएको
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(taken)}
                </p>

            </div>

        </div>


        <div class="grid grid-cols-2 gap-2 mt-2">

            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    लिनुपर्ने
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(receivable)}
                </p>

            </div>


            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    दिनुपर्ने
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(payable)}
                </p>

            </div>

        </div>


        <div class="flex gap-2 mt-3">

            <button
                type="button"
                class="flex-1 bg-green-600 rounded-xl py-2 text-sm font-semibold"
                onclick="generatePersonPDF(${JSON.stringify(group.name)})"
            >
                PDF
            </button>


            <button
                type="button"
                class="flex-1 bg-gray-800 rounded-xl py-2 text-sm"
                onclick="togglePerson(${JSON.stringify(id)})"
            >
                विवरण
            </button>

        </div>

    `;


    const details =
        document.createElement("div");


    details.id =
        `details_${id}`;


    details.className =
        "hidden border-t border-gray-800 p-3 space-y-2";


    group.records.forEach(item => {

        details.appendChild(
            createRecordRow(item)
        );

    });


    card.appendChild(header);

    card.appendChild(details);


    return card;

}



/* RECORD */

function createRecordRow(item) {

    const row =
        document.createElement("div");


    row.className =
        "bg-gray-800 rounded-xl p-3";


    const amount =
        Number(item.amount) || 0;


    row.innerHTML = `

        <div class="flex justify-between gap-3">

            <div>

                <p class="font-semibold">
                    ${escapeHtml(
                        getTypeName(item.type)
                    )}
                </p>

                <p class="text-xs text-gray-400 mt-1">
                    ${escapeHtml(
                        item.date || ""
                    )}
                </p>

                ${
                    item.dueDate
                    ?
                    `
                    <p class="text-xs text-yellow-400 mt-1">
                        Due: ${escapeHtml(item.dueDate)}
                    </p>
                    `
                    :
                    ""
                }

                ${
                    item.note
                    ?
                    `
                    <p class="text-xs text-gray-400 mt-1">
                        ${escapeHtml(item.note)}
                    </p>
                    `
                    :
                    ""
                }

            </div>


            <div class="text-right">

                <p class="font-bold">
                    NPR ${formatMoney(amount)}
                </p>

                <p class="text-[10px] text-gray-500 mt-1">
                    NPR ${formatMoney(item.npr || 0)}
                    +
                    INR ${formatMoney(item.inr || 0)}
                </p>


                <div class="flex gap-3 justify-end mt-2">

                    <button
                        type="button"
                        class="text-xs text-blue-400"
                        onclick="editTransaction(${JSON.stringify(item.id)})"
                    >
                        Edit
                    </button>


                    <button
                        type="button"
                        class="text-xs text-red-400"
                        onclick="removeTransaction(${JSON.stringify(item.id)})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>

    `;


    return row;

}



/* TOGGLE */

window.togglePerson =
    function(id) {

        const element =
            document.getElementById(
                `details_${id}`
            );


        if (!element) {
            return;
        }


        element.classList.toggle(
            "hidden"
        );

    };



/* EDIT */

window.editTransaction =
    function(id) {

        const item =
            getTransactions().find(
                record =>
                    record.id === id
            );


        if (!item) {
            return;
        }


        personName.value =
            item.partyName || "";


        npr.value =
            item.npr || "";


        inr.value =
            item.inr || "";


        date.value =
            item.date || today();


        dueDate.value =
            item.dueDate || "";


        note.value =
            item.note || "";


        editId.value =
            item.id;


        selectedType =
            item.type || "expense";


        document
            .querySelectorAll(".type-card")
            .forEach(button => {

                button.classList.toggle(
                    "selected-type",
                    button.dataset.type === selectedType
                );

            });


        saveBtn.textContent =
            "लेनदेन Update गर्नुहोस्";


        cancelEditBtn.classList.remove(
            "hidden"
        );


        calculateTotal();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

/* HELPERS */

function cleanName(name) {

    return String(name || "")
        .trim()
        .replace(/\s+/g, " ");

}


function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


function getTypeName(type) {

    const names = {

        expense:
            "खर्च",

        receivable:
            "लिनुपर्ने",

        payable:
            "दिनुपर्ने",

        given:
            "दिएको पैसा",

        taken:
            "लिएको पैसा",

        repayment:
            "फिर्ता"

    };


    return names[type] || type;

}


function getPersonId(name) {

    let hash = 0;

    const text =
        String(name || "")
            .toLowerCase();


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        hash =
            (
                (
                    hash << 5
                )
                -
                hash
                +
                text.charCodeAt(i)
            )
            |
            0;

    }


    return Math.abs(hash);

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
