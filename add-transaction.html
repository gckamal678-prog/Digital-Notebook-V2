0

<!-- FORM -->

>
</span>

<div
    id="pdfArea"

></div>



<script type="module">

import "../js/app.js";

import {
    getTransactions,
    addTransaction,
    updateTransaction,
    deleteTransaction
} from "./js/transactions.js";

import {
    getProfileValue
} from "./js/storage.js";


const INR_RATE = 1.6;


let selectedType = "expense";


let transactions =
    getTransactions();



const personName =
    document.getElementById(
        "personName"
    );


const npr =
    document.getElementById(
        "npr"
    );


const inr =
    document.getElementById(
        "inr"
    );


const date =
    document.getElementById(
        "date"
    );


const dueDate =
    document.getElementById(
        "dueDate"
    );


const note =
    document.getElementById(
        "note"
    );


const liveTotal =
    document.getElementById(
        "liveTotal"
    );


const saveBtn =
    document.getElementById(
        "saveBtn"
    );


const editId =
    document.getElementById(
        "editId"
    );


const cancelEditBtn =
    document.getElementById(
        "cancelEditBtn"
    );


const peopleList =
    document.getElementById(
        "peopleList"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );



date.value =
    new Date()
        .toISOString()
        .split("T")[0];



/* TYPE */

document
    .querySelectorAll(
        ".type-card"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".type-card"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "selected-type"
                                )
                        );


                    button.classList.add(
                        "selected-type"
                    );


                    selectedType =
                        button.dataset.type;

                }
            );

        }
    );



/* LIVE TOTAL */

function updateTotal() {

    const nprValue =
        Number(
            npr.value
        ) || 0;


    const inrValue =
        Number(
            inr.value
        ) || 0;


    const converted =
        inrValue
        *
        INR_RATE;


    const total =
        nprValue
        +
        converted;


    liveTotal.textContent =
        `NPR ${formatMoney(total)}`;


    document.getElementById(
        "conversionText"
    ).textContent =
        `INR ${formatMoney(inrValue)} × 1.6 = NPR ${formatMoney(converted)}`;

}


npr.addEventListener(
    "input",
    updateTotal
);


inr.addEventListener(
    "input",
    updateTotal
);



/* SAVE */

saveBtn.addEventListener(
    "click",
    () => {

        const name =
            cleanName(
                personName.value
            );


        const nprValue =
            Number(
                npr.value
            ) || 0;


        const inrValue =
            Number(
                inr.value
            ) || 0;


        const total =
            nprValue
            +
            (
                inrValue
                *
                INR_RATE
            );


        if (!name) {

            alert(
                "व्यक्तिको नाम लेख्नुहोस्।"
            );

            personName.focus();

            return;

        }


        if (
            total <= 0
        ) {

            alert(
                "रकम लेख्नुहोस्।"
            );

            return;

        }


        const data = {

            type:
                selectedType,

            partyName:
                name,

            npr:
                nprValue,

            inr:
                inrValue,

            amount:
                total,

            date:
                date.value,

            dueDate:
                dueDate.value,

            note:
                note.value.trim(),

            status:
                "pending"

        };


        if (
            editId.value
        ) {

            updateTransaction(
                editId.value,
                data
            );

        } else {

            addTransaction(
                data
            );

        }


        transactions =
            getTransactions();


        resetForm();

        render();

    }
);



/* EDIT */

window.editTransaction =
    function(id) {

        const item =
            transactions.find(
                x =>
                    x.id === id
            );


        if (!item) {
            return;
        }


        personName.value =
            item.partyName || "";


        npr.value =
            item.npr || "";


        inr.value =
            item.inr || "";


        date.value =
            item.date || "";


        dueDate.value =
            item.dueDate || "";


        note.value =
            item.note || "";


        editId.value =
            item.id;


        selectedType =
            item.type;


        document
            .querySelectorAll(
                ".type-card"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "selected-type",
                        button.dataset.type ===
                        item.type
                    );

                }
            );


        saveBtn.textContent =
            "लेनदेन Update गर्नुहोस्";


        cancelEditBtn.classList.remove(
            "hidden"
        );


        updateTotal();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };



/* DELETE */

window.deleteTransaction =
    function(id) {

        if (
            !confirm(
                "यो लेनदेन हटाउने?"
            )
        ) {

            return;

        }


        deleteTransaction(
            id
        );


        transactions =
            getTransactions();


        render();

    };



/* CANCEL EDIT */

cancelEditBtn.addEventListener(
    "click",
    resetForm
);



function resetForm() {

    personName.value = "";

    npr.value = "";

    inr.value = "";

    note.value = "";

    dueDate.value = "";

    date.value =
        new Date()
            .toISOString()
            .split("T")[0];

    editId.value = "";

    selectedType =
        "expense";


    document
        .querySelectorAll(
            ".type-card"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "selected-type",
                    button.dataset.type ===
                    "expense"
                );

            }
        );


    saveBtn.textContent =
        "लेनदेन सुरक्षित गर्नुहोस्";


    cancelEditBtn.classList.add(
        "hidden"
    );


    updateTotal();

}



/* SEARCH */

searchInput.addEventListener(
    "input",
    render
);



/* GROUP */

function groupPeople() {

    const groups = {};


    for (
        const item
        of transactions
    ) {

        const name =
            cleanName(
                item.partyName
            );


        if (!name) {
            continue;
        }


        const key =
            name.toLowerCase();


        if (!groups[key]) {

            groups[key] = {

                name,

                records: []

            };

        }


        groups[key].records.push(
            item
        );

    }


    return Object.values(
        groups
    );

}



/* RENDER */

function render() {

    transactions =
        getTransactions();


    const groups =
        groupPeople();


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        groups.filter(
            group =>
                group.name
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    document.getElementById(
        "totalRecords"
    ).textContent =
        transactions.length;


    document.getElementById(
        "totalPeople"
    ).textContent =
        groups.length;


    document.getElementById(
        "resultCount"
    ).textContent =
        `${filtered.length} व्यक्ति`;


    peopleList.innerHTML = "";


    document.getElementById(
        "emptyState"
    ).classList.toggle(
        "hidden",
        filtered.length !== 0
    );


    filtered.forEach(
        group => {

            peopleList.appendChild(
                createPersonCard(
                    group
                )
            );

        }
    );

}



function createPersonCard(
    group
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "transaction-card bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden";


    const records =
        group.records;


    let given = 0;
    let taken = 0;
    let expense = 0;
    let receivable = 0;
    let payable = 0;
    let repayment = 0;


    records.forEach(
        item => {

            const amount =
                Number(
                    item.amount
                ) || 0;


            if (
                item.type === "given"
            ) given += amount;


            if (
                item.type === "taken"
            ) taken += amount;


            if (
                item.type === "expense"
            ) expense += amount;


            if (
                item.type === "receivable"
            ) receivable += amount;


            if (
                item.type === "payable"
            ) payable += amount;


            if (
                item.type === "repayment"
            ) repayment += amount;

        }
    );


    const balance =
        receivable
        +
        given
        -
        payable
        -
        taken
        -
        repayment;


    const header =
        document.createElement(
            "div"
        );


    header.className =
        "p-4";


    header.innerHTML = `

        <div class="flex items-center justify-between gap-3">

            <div>

                <h3 class="font-bold text-lg">
                    ${escapeHtml(group.name)}
                </h3>

                <p class="text-xs text-gray-400">
                    ${records.length} वटा लेनदेन
                </p>

            </div>


            <div class="text-right">

                <p class="text-xs text-gray-400">
                    हिसाब
                </p>

                <p class="font-bold ${
                    balance >= 0
                        ? "text-green-400"
                        : "text-red-400"
                }">

                    NPR ${formatMoney(
                        Math.abs(balance)
                    )}

                </p>

            </div>

        </div>


        <div class="grid grid-cols-2 gap-2 mt-4">

            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    दिएको
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(given)}
                </p>

            </div>


            <div class="bg-gray-800 rounded-xl p-3">

                <p class="text-xs text-gray-400">
                    लिएको
                </p>

                <p class="font-semibold">
                    NPR ${formatMoney(taken)}
                </p>

            </div>

        </div>


        <div class="flex gap-2 mt-3">

            <button
                class="flex-1 bg-green-600 rounded-xl py-2 text-sm font-semibold"
                onclick="generatePersonPDF('${escapeAttr(group.name)}')"
            >
                PDF
            </button>


            <button
                class="flex-1 bg-gray-800 rounded-xl py-2 text-sm"
                onclick="togglePerson('${escapeAttr(group.name)}')"
            >
                विवरण
            </button>

        </div>

    `;


    const details =
        document.createElement(
            "div"
        );


    details.id =
        `person_${safeId(group.name)}`;


    details.className =
        "hidden border-t border-gray-800 p-3 space-y-2";


    records.forEach(
        item => {

            details.appendChild(
                createRecordRow(
                    item
                )
            );

        }
    );


    card.appendChild(
        header
    );


    card.appendChild(
        details
    );


    return card;

}



/* RECORD ROW */

function createRecordRow(
    item
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "bg-gray-800 rounded-xl p-3";


    const type =
        getTypeName(
            item.type
        );


    const amount =
        Number(
            item.amount
        ) || 0;


    row.innerHTML = `

        <div class="flex justify-between gap-3">

            <div>

                <p class="font-semibold">
                    ${type}
                </p>

                <p class="text-xs text-gray-400">
                    ${escapeHtml(
                        item.date || ""
                    )}
                </p>

                ${
                    item.dueDate
                    ?
                    `<p class="text-xs text-yellow-400 mt-1">
                        Due: ${escapeHtml(item.dueDate)}
                    </p>`
                    :
                    ""
                }

                ${
                    item.note
                    ?
                    `<p class="text-xs text-gray-400 mt-1">
                        ${escapeHtml(item.note)}
                    </p>`
                    :
                    ""
                }

            </div>


            <div class="text-right">

                <p class="font-bold">
                    NPR ${formatMoney(amount)}
                </p>

                <div class="flex gap-2 mt-2">

                    <button
                        class="text-xs text-blue-400"
                        onclick="editTransaction('${item.id}')"
                    >
                        Edit
                    </button>

                    <button
                        class="text-xs text-red-400"
                        onclick="deleteTransaction('${item.id}')"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>

    `;


    return row;

}



/* TOGGLE */

window.togglePerson =
    function(name) {

        const element =
            document.getElementById(
                `person_${safeId(name)}`
            );


        if (!element) {
            return;
        }


        element.classList.toggle(
            "hidden"
        );

    };



/* PDF */

window.generatePersonPDF =
    async function(name) {

        const records =
            getTransactions()
                .filter(
                    item =>
                        cleanName(
                            item.partyName
                        ).toLowerCase()
                        ===
                        cleanName(
                            name
                        ).toLowerCase()
                );


        if (!records.length) {

            alert(
                "यस व्यक्तिको कुनै लेनदेन भेटिएन।"
            );

            return;

        }


        const profileName =
            getProfileValue(
                "profile_name",
                ""
            );


        const profileAddress =
            getProfileValue(
                "profile_address",
                ""
            );


        const profileMobile =
            getProfileValue(
                "profile_mobile",
                ""
            );


        const profileEmail =
            getProfileValue(
                "profile_email",
                ""
            );


        let totalExpense = 0;
        let totalGiven = 0;
        let totalTaken = 0;
        let totalReceivable = 0;
        let totalPayable = 0;
        let totalRepayment = 0;


        records.forEach(
            item => {

                const amount =
                    Number(
                        item.amount
                    ) || 0;


                if (
                    item.type === "expense"
                )
                    totalExpense += amount;


                if (
                    item.type === "given"
                )
                    totalGiven += amount;


                if (
                    item.type === "taken"
                )
                    totalTaken += amount;


                if (
                    item.type === "receivable"
                )
                    totalReceivable += amount;


                if (
                    item.type === "payable"
                )
                    totalPayable += amount;


                if (
                    item.type === "repayment"
                )
                    totalRepayment += amount;

            }
        );


        const balance =
            totalReceivable
            +
            totalGiven
            -
            totalPayable
            -
            totalTaken
            -
            totalRepayment;


        const pdfArea =
            document.getElementById(
                "pdfArea"
            );


        pdfArea.innerHTML = `

            <div class="pdf-page">

                <h1
                    style="
                        font-size:28px;
                        font-weight:bold;
                        margin-bottom:8px;
                    "
                >
                    Digital Notebook
                </h1>


                <p
                    style="
                        font-size:18px;
                        font-weight:bold;
                        margin-bottom:20px;
                    "
                >
                    ${escapeHtml(name)} — पूरा हिसाब
                </p>


                <div
                    style="
                        border:1px solid #ddd;
                        padding:15px;
                        margin-bottom:20px;
                    "
                >

                    ${
                        profileName
                        ?
                        `<p><b>नाम:</b> ${escapeHtml(profileName)}</p>`
                        :
                        ""
                    }

                    ${
                        profileMobile
                        ?
                        `<p><b>Mobile:</b> ${escapeHtml(profileMobile)}</p>`
                        :
                        ""
                    }

                    ${
                        profileAddress
                        ?
                        `<p><b>Address:</b> ${escapeHtml(profileAddress)}</p>`
                        :
                        ""
                    }

                    ${
                        profileEmail
                        ?
                        `<p><b>Email:</b> ${escapeHtml(profileEmail)}</p>`
                        :
                        ""
                    }

                </div>


                <h2
                    style="
                        font-size:20px;
                        font-weight:bold;
                        margin-bottom:12px;
                    "
                >
                    ${escapeHtml(name)}
                </h2>


                <table
                    style="
                        width:100%;
                        border-collapse:collapse;
                        margin-bottom:25px;
                    "
                >

                    <thead>

                        <tr>

                            <th style="border:1px solid #ccc;padding:8px;text-align:left;">
                                मिति
                            </th>

                            <th style="border:1px solid #ccc;padding:8px;text-align:left;">
                                प्रकार
                            </th>

                            <th style="border:1px solid #ccc;padding:8px;text-align:right;">
                                रकम
                            </th>

                            <th style="border:1px solid #ccc;padding:8px;text-align:left;">
                                Due
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${records.map(
                            item => `

                            <tr>

                                <td style="border:1px solid #ccc;padding:8px;">
                                    ${escapeHtml(item.date || "")}
                                </td>

                                <td style="border:1px solid #ccc;padding:8px;">
                                    ${getTypeName(item.type)}
                                </td>

                                <td style="border:1px solid #ccc;padding:8px;text-align:right;">
                                    NPR ${formatMoney(item.amount)}
                                </td>

                                <td style="border:1px solid #ccc;padding:8px;">
                                    ${escapeHtml(item.dueDate || "-")}
                                </td>

                            </tr>

                            `
                        ).join("")}

                    </tbody>

                </table>


                <div
                    style="
                        border:1px solid #ccc;
                        padding:15px;
                    "
                >

                    <p>
                        <b>कुल खर्च:</b>
                        NPR ${formatMoney(totalExpense)}
                    </p>

                    <p>
                        <b>दिएको पैसा:</b>
                        NPR ${formatMoney(totalGiven)}
                    </p>

                    <p>
                        <b>लिएको पैसा:</b>
                        NPR ${formatMoney(totalTaken)}
                    </p>

                    <p>
                        <b>लिनुपर्ने:</b>
                        NPR ${formatMoney(totalReceivable)}
                    </p>

                    <p>
                        <b>दिनुपर्ने:</b>
                        NPR ${formatMoney(totalPayable)}
                    </p>

                    <p>
                        <b>फिर्ता:</b>
                        NPR ${formatMoney(totalRepayment)}
                    </p>

                    <hr
                        style="
                            margin:12px 0;
                            border:0;
                            border-top:1px solid #ccc;
                        "
                    >

                    <p
                        style="
                            font-size:18px;
                            font-weight:bold;
                        "
                    >
                        बाँकी हिसाब:
                        NPR ${formatMoney(
                            Math.abs(balance)
                        )}
                    </p>

                </div>


                <p
                    style="
                        margin-top:30px;
                        font-size:11px;
                        color:#666;
                    "
                >
                    Generated by Digital Notebook
                </p>

            </div>

        `;


        pdfArea.classList.remove(
            "hidden"
        );


        const filename =
            `${cleanName(name).replace(/\s+/g, "_")}_Transaction_Report.pdf`;


        await html2pdf()
            .set({

                margin: 0,

                filename,

                image: {
                    type: "jpeg",
                    quality: .95
                },

                html2canvas: {
                    scale: 2,
                    useCORS: true
                },

                jsPDF: {
                    unit: "pt",
                    format: "a4",
                    orientation: "portrait"
                }

            })
            .from(pdfArea)
            .save();


        pdfArea.classList.add(
            "hidden"
        );

    };



/* HELPERS */

function cleanName(
    name
) {

    return String(
        name || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        );

}


function formatMoney(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


function getTypeName(
    type
) {

    const map = {

        expense:
            "खर्च",

        receivable:
            "लिनुपर्ने",

        payable:
            "दिनुपर्ने",

        given:
            "दिएको पैसा",

        taken:
            "लिएको पैसा",

        repayment:
            "फिर्ता"

    };


    return (
        map[type]
        ||
        type
    );

}


function safeId(
    value
) {

    return btoa(
        unescape(
            encodeURIComponent(
                value
            )
        )
    )
        .replace(
            /[^a-zA-Z0-9]/g,
            ""
        );

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


render();

updateTotal();

</script>


</body>

</html>
