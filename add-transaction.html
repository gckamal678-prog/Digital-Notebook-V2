<!DOCTYPE html>
<html lang="ne">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Transactions - Digital NoteBook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
    ></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: Poppins, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .type-card {
            border: 2px solid transparent;
            transition:
                border-color .15s ease,
                background .15s ease,
                transform .15s ease;
        }

        .type-card:active {
            transform: scale(.98);
        }

        .type-card.selected {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, .14) !important;
        }

        .type-card.selected .type-icon {
            background: #16a34a;
            color: white;
        }

        .type-card.selected .type-check {
            display: flex;
        }

        .type-check {
            display: none;
        }

        .total-box {
            transition: .2s ease;
        }

        .record-row {
            border-bottom: 1px solid rgba(148,163,184,.12);
        }

        .record-row:last-child {
            border-bottom: 0;
        }

        .person-details {
            display: none;
        }

        .person-details.open {
            display: block;
        }

        .pdf-page {
            width: 794px;
            min-height: 1123px;
            background: #ffffff;
            color: #111827;
            padding: 35px;
            font-family: Arial, sans-serif;
        }

        input,
        textarea,
        select {
            font-family: Poppins, sans-serif;
        }

        @media (max-width: 640px) {

            .pdf-page {
                width: 794px;
            }

        }

    </style>

</head>

<script type="module">

import "./js/app.js";


/*
    Digital Notebook
    Transaction Page

    Storage:
    digital_notebook_transactions

    NPR + INR conversion:
    1 INR = 1.6 NPR
*/


const STORAGE_KEY =
    "digital_notebook_transactions";


const INR_RATE =
    1.6;


let selectedType =
    "Expense";


let editingId =
    "";


/* ELEMENTS */

const form =
    document.getElementById(
        "transactionForm"
    );


const partyName =
    document.getElementById(
        "partyName"
    );


const amountNpr =
    document.getElementById(
        "amountNpr"
    );


const amountInr =
    document.getElementById(
        "amountInr"
    );


const totalAmount =
    document.getElementById(
        "totalAmount"
    );


const conversionText =
    document.getElementById(
        "conversionText"
    );


const transactionDate =
    document.getElementById(
        "transactionDate"
    );


const dueDate =
    document.getElementById(
        "dueDate"
    );


const transactionNote =
    document.getElementById(
        "transactionNote"
    );


const personList =
    document.getElementById(
        "personList"
    );


const searchPerson =
    document.getElementById(
        "searchPerson"
    );


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const editId =
    document.getElementById(
        "editId"
    );


/* DATE */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


transactionDate.value =
    today();



/* TYPE SELECTION */

const typeCards =
    document.querySelectorAll(
        ".type-card"
    );


typeCards.forEach(card => {

    card.addEventListener(
        "click",
        () => {

            selectedType =
                card.dataset.type;


            typeCards.forEach(item => {

                item.classList.remove(
                    "selected"
                );

            });


            card.classList.add(
                "selected"
            );

        }
    );

});



/* NUMBER */

function number(value) {

    const n =
        Number(value);

    if (
        !Number.isFinite(n)
    ) {
        return 0;
    }

    return n;

}



/* LIVE TOTAL */

function calculateLiveTotal() {

    const npr =
        number(
            amountNpr.value
        );


    const inr =
        number(
            amountInr.value
        );


    const converted =
        inr * INR_RATE;


    const total =
        npr + converted;


    totalAmount.textContent =
        "NPR " +
        formatMoney(total);


    conversionText.textContent =
        "NPR " +
        formatMoney(npr) +
        " + INR " +
        formatMoney(inr) +
        " × 1.6 = NPR " +
        formatMoney(total);


    return total;

}


amountNpr.addEventListener(
    "input",
    calculateLiveTotal
);


amountInr.addEventListener(
    "input",
    calculateLiveTotal
);


/*
    Also update on keyup/change.
    This makes it reliable on mobile keyboards.
*/

amountNpr.addEventListener(
    "keyup",
    calculateLiveTotal
);


amountInr.addEventListener(
    "keyup",
    calculateLiveTotal
);


amountNpr.addEventListener(
    "change",
    calculateLiveTotal
);


amountInr.addEventListener(
    "change",
    calculateLiveTotal
);



/* STORAGE */

function getTransactions() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {
            return [];
        }


        const data =
            JSON.parse(raw);


        if (
            !Array.isArray(data)
        ) {
            return [];
        }


        return data;

    } catch (error) {

        console.error(
            "Transaction read error:",
            error
        );

        return [];

    }

}



function saveTransactions(
    transactions
) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                transactions
            )
        );


        /*
            Keep V2 storage copy too.
            This helps the newer dashboard
            read the same transaction data.
        */

        localStorage.setItem(
            "digital_notebook_v2_transactions",
            JSON.stringify(
                transactions
            )
        );


        return true;

    } catch (error) {

        console.error(
            "Transaction save error:",
            error
        );

        alert(
            "Data Save हुन सकेन। Browser storage जाँच गर्नुहोस्।"
        );

        return false;

    }

}



/* CLEAN NAME */

function cleanName(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        );

}



/* ID */

function createId() {

    return (
        "transaction_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}



/* SAVE */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            cleanName(
                partyName.value
            );


        const npr =
            number(
                amountNpr.value
            );


        const inr =
            number(
                amountInr.value
            );


        const total =
            npr +
            (
                inr *
                INR_RATE
            );


        if (!name) {

            alert(
                "व्यक्तिको नाम लेख्नुहोस्।"
            );

            partyName.focus();

            return;

        }


        if (total <= 0) {

            alert(
                "NPR वा INR रकम लेख्नुहोस्।"
            );

            if (
                !npr &&
                !inr
            ) {

                amountNpr.focus();

            }

            return;

        }


        const item = {

            id:
                editingId ||
                createId(),

            party:
                name,

            partyName:
                name,

            type:
                selectedType,

            npr:
                npr,

            inr:
                inr,

            total:
                total,

            amount:
                total,

            date:
                transactionDate.value ||
                today(),

            dueDate:
                dueDate.value ||
                "",

            note:
                transactionNote.value
                    .trim(),

            createdAt:
                editingId
                    ?
                    getExistingCreatedAt(
                        editingId
                    )
                    :
                    Date.now(),

            updatedAt:
                Date.now()

        };


        let transactions =
            getTransactions();


        if (editingId) {

            const index =
                transactions.findIndex(
                    tx =>
                        tx.id ===
                        editingId
                );


            if (
                index === -1
            ) {

                alert(
                    "Update record भेटिएन।"
                );

                return;

            }


            transactions[index] =
                item;

        } else {

            transactions.unshift(
                item
            );

        }


        if (
            saveTransactions(
                transactions
            )
        ) {

            resetForm();

            renderPeople();

            alert(
                editingId
                    ?
                    "कारोबार Update भयो।"
                    :
                    "कारोबार सुरक्षित भयो।"
            );

        }

    }
);



/* CREATED AT */

function getExistingCreatedAt(
    id
) {

    const item =
        getTransactions()
            .find(
                tx =>
                    tx.id === id
            );


    return (
        item?.createdAt ||
        Date.now()
    );

}



/* RESET */

function resetForm() {

    editingId =
        "";


    editId.value =
        "";


    form.reset();


    transactionDate.value =
        today();


    selectedType =
        "Expense";


    typeCards.forEach(card => {

        card.classList.toggle(
            "selected",
            card.dataset.type ===
                "Expense"
        );

    });


    saveButton.textContent =
        "कारोबार सेभ गर्नुहोस्";

/* TYPE NAME */

function typeNepali(
    type
) {

    const map = {

        Expense:
            "खर्च",

        Receivable:
            "लिनुपर्ने",

        Payable:
            "दिनुपर्ने",

        Given:
            "दिएको पैसा",

        Taken:
            "लिएको पैसा",

        Repayment:
            "फिर्ता"

    };


    return (
        map[type] ||
        type ||
        ""
    );

}



/* TYPE COLOR */

function typeColor(
    type
) {

    const map = {

        Expense:
            "text-red-400",

        Receivable:
            "text-green-400",

        Payable:
            "text-orange-400",

        Given:
            "text-blue-400",

        Taken:
            "text-purple-400",

        Repayment:
            "text-cyan-400"

    };


    return (
        map[type] ||
        "text-slate-300"
    );

}



/* FORMAT */

function formatMoney(
    value
) {

    return number(value)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}



/* GROUP */

function groupPeople(
    transactions
) {

    const groups = {};


    transactions.forEach(item => {

        const name =
            cleanName(
                item.party ||
                item.partyName
            );


        if (!name) {
            return;
        }


        const key =
            name.toLocaleLowerCase();


        if (!groups[key]) {

            groups[key] = {

                name:
                    name,

                items:
                    []

            };

        }


        groups[key].items.push(
            item
        );

    });


    return Object.values(
        groups
    );

}



/* PERSON BALANCE */

function calculatePerson(
    items
) {

    let receivable = 0;
    let payable = 0;
    let given = 0;
    let taken = 0;


    items.forEach(item => {

        const amount =
            number(
                item.total ??
                item.amount
            );


        if (
            item.type ===
            "Receivable"
        ) {

            receivable +=
                amount;

        }


        if (
            item.type ===
            "Payable"
        ) {

            payable +=
                amount;

        }


        if (
            item.type ===
            "Given"
        ) {

            given +=
                amount;

        }


        if (
            item.type ===
            "Taken"
        ) {

            taken +=
                amount;

        }

    });


    return {

        receivable,

        payable,

        given,

        taken,

        balance:
            receivable +
            given -
            payable -
            taken

    };

}

/* FILE NAME */

function sanitizeFileName(
    value
) {

    return cleanName(value)
        .replace(
            /[^\w\u0900-\u097F-]+/g,
            "_"
        );

}



/* HTML ESCAPE */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}

    );

});

</script>
