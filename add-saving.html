<script
    type="module"
>


/* =========================================================
   CONSTANTS
========================================================= */

const INR_RATE = 1.6;

let currentLang =
    localStorage.getItem(
        "userLang"
    ) === "np"
        ? "NEP"
        : "EN";

let isSavingsHidden =
    localStorage.getItem(
        "savings_hidden"
    ) === "true";


/* =========================================================
   STORAGE
========================================================= */

function getSavingsData() {

    try {

        const raw =
            localStorage.getItem(
                "digital_notebook_savings"
            );

        if (!raw) {
            return [];
        }

        const data =
            JSON.parse(raw);

        if (!Array.isArray(data)) {
            return [];
        }

        return data;

    } catch (error) {

        console.error(
            "Saving read error:",
            error
        );

        return [];

    }

}


function saveSavingsData(
    savings
) {

    localStorage.setItem(
        "digital_notebook_savings",
        JSON.stringify(
            savings
        )
    );

}


/* =========================================================
   SAFE SPELLING CORRECTION
========================================================= */

function correctSavingTitle(
    value
) {

    let text =
        String(
            value || ""
        )
            .trim()
            .replace(
                /\s+/g,
                " "
            );

    if (!text) {
        return "";
    }


    /*
     * Only safe corrections.
     * Unknown words are NOT changed.
     */

    const lower =
        text.toLowerCase();


    const corrections = {

        "bank saving":
            "Bank Saving",

        "bank savings":
            "Bank Saving",

        "bank savng":
            "Bank Saving",

        "saving":
            "Saving",

        "savings":
            "Saving",

        "cash saving":
            "Cash Saving",

        "fixed deposit":
            "Fixed Deposit",

        "fixed deposits":
            "Fixed Deposit",

        "fix deposit":
            "Fixed Deposit"

    };


    if (
        corrections[lower]
    ) {

        return corrections[
            lower
        ];

    }


    /*
     * Same spelling with different
     * upper/lower case.
     *
     * First letter capitalization only.
     */

    if (
        text === lower
    ) {

        return text
            .split(" ")
            .map(
                word =>
                    word.charAt(0)
                        .toUpperCase()
                    +
                    word.slice(1)
            )
            .join(" ");

    }


    return text;

}


/* =========================================================
   MONEY FORMAT
========================================================= */

function formatAmount(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* =========================================================
   TOTAL CALCULATION
========================================================= */

function calculateSavingsTotal() {

    const npr =
        parseFloat(
            document.getElementById(
                "savings-amount-npr"
            ).value
        ) || 0;


    const inr =
        parseFloat(
            document.getElementById(
                "savings-amount-inr"
            ).value
        ) || 0;


    const totalNpr =
        npr
        +
        (
            inr
            *
            INR_RATE
        );


    const totalElement =
        document.getElementById(
            "savings-total-calc"
        );


    /*
     * THIS IS THE IMPORTANT PART.
     *
     * It immediately shows total
     * while typing NPR / INR.
     */

    totalElement.value =
        formatAmount(
            totalNpr
        );

}

/* =========================================================
   SAVE
========================================================= */

function saveSavings(
    event
) {

    event.preventDefault();


    const index =
        document.getElementById(
            "edit-savings-index"
        ).value;


    let title =
        document.getElementById(
            "savings-title"
        ).value
            .trim();


    const category =
        document.getElementById(
            "savings-category"
        ).value;


    const npr =
        parseFloat(
            document.getElementById(
                "savings-amount-npr"
            ).value
        ) || 0;


    const inr =
        parseFloat(
            document.getElementById(
                "savings-amount-inr"
            ).value
        ) || 0;


    const date =
        document.getElementById(
            "savings-date"
        ).value;


    /*
     * Apply safe correction
     */

    title =
        correctSavingTitle(
            title
        );


    if (!title) {

        showToast(
            "Saving title लेख्नुहोस्।",
            "error"
        );

        return;

    }


    if (
        npr <= 0
        &&
        inr <= 0
    ) {

        showToast(
            "NPR वा INR amount राख्नुहोस्।",
            "error"
        );

        return;

    }


    /*
     * ALWAYS calculate from
     * NPR + INR.
     */

    const total =
        npr
        +
        (
            inr
            *
            INR_RATE
        );


    const item = {

        title,

        category,

        npr,

        inr,

        total,

        date

    };


    const savings =
        getSavingsData();


    if (
        index === ""
    ) {

        savings.unshift(
            item
        );

        showToast(
            "बचत सफलतापूर्वक सेभ भयो।"
        );

    } else {

        savings[
            Number(index)
        ] = item;

        showToast(
            "बचत रेकर्ड अपडेट भयो।"
        );

    }


    saveSavingsData(
        savings
    );


    resetSavingsForm();

    renderSavings();

}

/* =========================================================
   GROUP SAVINGS
========================================================= */

function groupSavings(
    savings
) {

    const groups = {};


    savings.forEach(
        (
            item,
            originalIdx
        ) => {


            const corrected =
                correctSavingTitle(
                    item.title
                    ||
                    "Other"
                );


            const key =
                corrected.toLowerCase();


            if (
                !groups[key]
            ) {

                groups[key] = {

                    name:
                        corrected,

                    total: 0,

                    npr: 0,

                    inr: 0,

                    items: []

                };

            }


            const itemTotal =
                Number(
                    item.total
                    ??
                    (
                        Number(
                            item.npr
                        )
                        +
                        (
                            Number(
                                item.inr
                            )
                            *
                            INR_RATE
                        )
                    )
                )
                || 0;


            groups[key].total +=
                itemTotal;


            groups[key].npr +=
                Number(
                    item.npr
                ) || 0;


            groups[key].inr +=
                Number(
                    item.inr
                ) || 0;


            groups[key].items.push({

                ...item,

                total:
                    itemTotal,

                originalIdx

            });

        }
    );


    return Object.values(
        groups
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderSavings() {

    const container =
        document.getElementById(
            "savings-list-container"
        );


    if (!container) {
        return;
    }


    const savings =
        getSavingsData();


    const search =
        (
            document.getElementById(
                "search-savings"
            )?.value
            ||
            ""
        )
            .trim()
            .toLowerCase();


    const sort =
        document.getElementById(
            "sort-savings"
        )?.value
        ||
        "name";


    const eye =
        document.getElementById(
            "eye-icon"
        );


    if (eye) {

        eye.className =
            isSavingsHidden
                ? "fa-solid fa-eye-slash text-rose-400"
                : "fa-solid fa-eye text-slate-400";

    }


    if (
        savings.length === 0
    ) {

        container.innerHTML = `

            <p
                class="text-slate-400 text-center py-6"
            >
                कुनै saving record फेला परेन।
            </p>

        `;


        updateTotals(
            0
        );

        return;

    }


    let groups =
        groupSavings(
            savings
        );


    if (search) {

        groups =
            groups.filter(
                group =>
                    group.name
                        .toLowerCase()
                        .includes(
                            search
                        )
            );

    }


    if (
        sort === "name"
    ) {

        groups.sort(
            (
                a,
                b
            ) =>
                a.name.localeCompare(
                    b.name
                )
        );

    }


    if (
        sort === "total_desc"
    ) {

        groups.sort(
            (
                a,
                b
            ) =>
                b.total - a.total
        );

    }


    if (
        sort === "date_desc"
    ) {

        groups.sort(
            (
                a,
                b
            ) => {

                const dateA =
                    Math.max(
                        ...a.items.map(
                            item =>
                                new Date(
                                    item.date
                                ).getTime()
                        )
                    );


                const dateB =
                    Math.max(
                        ...b.items.map(
                            item =>
                                new Date(
                                    item.date
                                ).getTime()
                        )
                    );


                return dateB - dateA;

            }
        );

    }


    container.innerHTML = "";


    groups.forEach(
        (
            group,
            groupIndex
        ) => {


            const groupDiv =
                document.createElement(
                    "div"
                );


            groupDiv.className =
                "bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/60 rounded-xl overflow-hidden";


            const displayedGroupTotal =
                isSavingsHidden
                    ? "Rs ••••••"
                    :
                    `Rs ${formatAmount(
                        group.total
                    )}`;


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "flex justify-between items-center p-3 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800";


            header.innerHTML = `

                <div
                    class="flex items-center gap-2"
                >

                    <i
                        id="icon-${groupIndex}"
                        class="fa-solid fa-chevron-right text-[10px] text-slate-400 transition-transform"
                    ></i>


                    <div>

                        <h4
                            class="font-bold text-slate-900 dark:text-white text-xs"
                        >
                            ${escapeHTML(
                                group.name
                            )}
                        </h4>


                        <p
                            class="text-[10px] text-slate-500 dark:text-slate-400"
                        >
                            ${group.items.length}
                            record${group.items.length === 1 ? "" : "s"}
                        </p>

                    </div>

                </div>


                <div
                    class="text-right"
                >

                    <div
                        class="font-bold text-emerald-500 text-xs"
                    >
                        ${displayedGroupTotal}
                    </div>

                    <div
                        class="text-[9px] text-slate-400"
                    >
                        NPR + INR
                    </div>

                </div>

            `;


            const ledger =
                document.createElement(
                    "div"
                );


            ledger.id =
                `ledger-${groupIndex}`;


            ledger.className =
                "hidden border-t border-slate-200 dark:border-slate-700/60 bg-white dark:bg-slate-900/50";


            group.items.sort(
                (
                    a,
                    b
                ) =>
                    new Date(
                        b.date
                    )
                    -
                    new Date(
                        a.date
                    )
            );


            group.items.forEach(
                item => {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "flex justify-between items-center gap-2 p-3 border-b border-slate-200 dark:border-slate-700/50 last:border-b-0";


                    const total =
                        isSavingsHidden
                            ? "Rs ••••••"
                            :
                            `Rs ${formatAmount(
                                item.total
                            )}`;


                    const breakdown =
                        isSavingsHidden
                            ? "NPR ••• | INR •••"
                            :
                            `NPR ${formatAmount(
                                item.npr
                            )} | INR ${formatAmount(
                                item.inr
                            )}`;


                    row.innerHTML = `

                        <div
                            class="min-w-0"
                        >

                            <div
                                class="font-semibold text-slate-700 dark:text-slate-300"
                            >
                                ${escapeHTML(
                                    item.date
                                )}
                            </div>


                            <div
                                class="text-[9px] text-slate-400 mt-1"
                            >

                                ${escapeHTML(
                                    item.category
                                    ||
                                    ""
                                )}

                                &nbsp; • &nbsp;

                                ${breakdown}

                            </div>

                        </div>


                        <div
                            class="flex items-center gap-3"
                        >

                            <span
                                class="font-bold text-emerald-500 whitespace-nowrap"
                            >
                                ${total}
                            </span>


                            <button
                                class="text-blue-500"
                                title="Edit"
                            >
                                <i
                                    class="fa-solid fa-pen-to-square"
                                ></i>
                            </button>


                            <button
                                class="text-rose-500"
                                title="Delete"
                            >
                                <i
                                    class="fa-solid fa-trash"
                                ></i>
                            </button>

                        </div>

                    `;


                    const buttons =
                        row.querySelectorAll(
                            "button"
                        );


                    buttons[0].onclick =
                        event => {

                            event.stopPropagation();

                            editSavings(
                                item.originalIdx
                            );

                        };


                    buttons[1].onclick =
                        event => {

                            event.stopPropagation();

                            deleteSavings(
                                item.originalIdx
                            );

                        };


                    ledger.appendChild(
                        row
                    );

                }
            );


            header.onclick =
                () => {

                    ledger.classList.toggle(
                        "hidden"
                    );


                    document
                        .getElementById(
                            `icon-${groupIndex}`
                        )
                        .classList.toggle(
                            "rotate-90"
                        );

                };


            groupDiv.appendChild(
                header
            );


            groupDiv.appendChild(
                ledger
            );


            container.appendChild(
                groupDiv
            );

        }
    );


    /*
     * IMPORTANT:
     * Grand total is calculated from
     * ALL records, not filtered groups.
     */

    const allSavings =
        getSavingsData();


    const grandTotal =
        allSavings.reduce(
            (
                sum,
                item
            ) => {

                return (
                    sum
                    +
                    (
                        Number(
                            item.total
                        )
                        ||
                        (
                            (
                                Number(
                                    item.npr
                                )
                                || 0
                            )
                            +
                            (
                                (
                                    Number(
                                        item.inr
                                    )
                                    || 0
                                )
                                *
                                INR_RATE
                            )
                        )
                    )
                );

            },
            0
        );


    updateTotals(
        grandTotal
    );

}

/* =========================================================
   TARGET UI
========================================================= */

function updateTargetUI(
    currentTotal
) {

    const target =
        parseFloat(
            localStorage.getItem(
                "savings_target_amount"
            )
        ) || 0;


    const progress =
        document.getElementById(
            "target-progress-text"
        );


    const percentage =
        document.getElementById(
            "target-percentage"
        );


    const bar =
        document.getElementById(
            "target-progress-bar"
        );


    if (
        !progress
        ||
        !percentage
        ||
        !bar
    ) {

        return;

    }


    if (
        target <= 0
    ) {

        progress.innerText =
            isSavingsHidden
                ? "Rs •••••• / Goal Not Set"
                :
                `Rs ${formatAmount(
                    currentTotal
                )} / Goal Not Set`;


        percentage.innerText =
            "0%";


        bar.style.width =
            "0%";


        return;

    }


    const percent =
        Math.min(
            100,
            Math.round(
                (
                    currentTotal
                    /
                    target
                )
                *
                100
            )
        );


    if (
        isSavingsHidden
    ) {

        progress.innerText =
            "Rs •••••• / Rs ••••••";

    } else {

        progress.innerText =
            `Rs ${formatAmount(
                currentTotal
            )} / Rs ${formatAmount(
                target
            )}`;

    }


    percentage.innerText =
        `${percent}%`;


    bar.style.width =
        `${percent}%`;

}

/* =========================================================
   SEARCH HTML SAFE
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = "success"
) {

    const container =
        document.getElementById(
            "toast-container"
        );


    if (!container) {
        return;
    }


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        type === "error"
            ?
            "bg-rose-600 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold"
            :
            "bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold";


    toast.innerText =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        3000
    );

}

/* =========================================================
   PRINT
========================================================= */

function printFromModal() {

    const element =
        document.getElementById(
            "pdf-printable-content"
        );


    if (!element) {
        return;
    }


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    printWindow.document.write(
        `
        <html>
        <head>
            <title>Savings Report</title>

            <style>

                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                }

                table {
                    width:100%;
                    border-collapse:collapse;
                }

                th,
                td {
                    border:1px solid #ccc;
                    padding:8px;
                }

            </style>

        </head>

        <body>
        `
    );


    printWindow.document.write(
        element.outerHTML
    );


    printWindow.document.write(
        `
        </body>
        </html>
        `
    );


    printWindow.document.close();


    setTimeout(
        () => {

            printWindow.print();

        },
        500
    );

}


/* =========================================================
   DOWNLOAD PDF
========================================================= */

async function downloadSavingsPDF() {

    const element =
        document.getElementById(
            "pdf-printable-content"
        );


    if (!element) {

        showToast(
            "PDF content भेटिएन।",
            "error"
        );

        return;

    }


    const options = {

        margin: 8,

        filename:
            "Digital-Notebook-Saving-Report.pdf",

        image: {

            type: "jpeg",

            quality: 0.95

        },

        html2canvas: {

            scale: 2,

            useCORS: true,

            backgroundColor:
                "#ffffff"

        },

        jsPDF: {

            unit: "mm",

            format: "a4",

            orientation: "portrait"

        }

    };


    try {

        await html2pdf()
            .set(options)
            .from(element)
            .save();


    } catch (error) {

        console.error(
            "PDF error:",
            error
        );


        showToast(
            "PDF बनाउन समस्या भयो।",
            "error"
        );

    }

}

/* =========================================================
   DYNAMIC DATE
========================================================= */

function updateDynamicHeader() {

    const element =
        document.getElementById(
            "dynamic-date"
        );


    if (!element) {
        return;
    }


    const now =
        new Date();


    element.innerText =
        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        )
        .toUpperCase();

}
