<!DOCTYPE html>
<html lang="ne">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Saving - Digital Notebook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- PDF Libraries -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>


    <style>

        * {
            font-family: "Poppins", sans-serif;
        }

        body {

            background:
                radial-gradient(
                    circle at top,
                    rgba(16,185,129,0.14),
                    transparent 35%
                ),
                #020617;

            color: #e5e7eb;

        }


        .app-card {

            background:
                rgba(15,23,42,0.94);

            border:
                1px solid
                rgba(148,163,184,0.18);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);

        }


        .input-box {

            width: 100%;

            background: #020617;

            border:
                1px solid
                #334155;

            color: #f8fafc;

            border-radius: 14px;

            padding:
                14px 16px;

            font-size: 16px;

        }


        .input-box:focus {

            border-color:
                #10b981;

            box-shadow:
                0 0 0 3px
                rgba(16,185,129,0.14);

            outline: none;

        }


        .saving-card {

            background:
                rgba(15,23,42,0.92);

            border:
                1px solid
                #1e293b;

            border-radius:
                16px;

        }


        .saving-card:hover {

            border-color:
                rgba(16,185,129,0.35);

        }


        .toast {

            animation:
                toastIn
                0.25s
                ease-out;

        }


        @keyframes toastIn {

            from {

                opacity: 0;

                transform:
                    translateY(12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================
           PDF AREA
        ========================== */

        #pdf-content {

            position:
                fixed;

            left:
                -100000px;

            top:
                0;

            width:
                794px;

            min-height:
                1123px;

            background:
                #ffffff;

            color:
                #172033;

            padding:
                40px;

            z-index:
                -9999;

        }


        .pdf-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                22px;

            width:
                100%;

            padding-bottom:
                14px;

            border-bottom:
                3px solid
                #20a46b;

        }


        .pdf-user {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            flex:
                1;

            min-width:
                0;

        }


        .pdf-avatar {

            width:
                78px;

            height:
                78px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                3px solid
                #20a46b;

            flex-shrink:
                0;

        }


        .pdf-user-info {

            display:
                flex;

            flex-direction:
                column;

            gap:
                3px;

            font-size:
                11px;

            line-height:
                1.35;

        }


        .pdf-user-name {

            font-size:
                16px;

            font-weight:
                700;

            margin-bottom:
                2px;

        }


        .pdf-banner {

            width:
                245px;

            height:
                78px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            flex-shrink:
                0;

        }


        .pdf-banner-image {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            display:
                block;

        }


        .pdf-title {

            text-align:
                center;

            margin-top:
                25px;

            margin-bottom:
                20px;

        }


        .pdf-title h1 {

            font-size:
                25px;

            font-weight:
                700;

            margin:
                0;

            letter-spacing:
                1px;

        }


        .pdf-title p {

            margin:
                5px 0 0;

            font-size:
                11px;

            color:
                #64748b;

        }


        .pdf-table {

            width:
                100%;

            border-collapse:
                collapse;

            font-size:
                10px;

        }


        .pdf-table th {

            background:
                #f1f5f9;

            color:
                #334155;

            padding:
                9px 7px;

            border-bottom:
                1px solid
                #cbd5e1;

            text-align:
                left;

            font-weight:
                700;

        }


        .pdf-table td {

            padding:
                9px 7px;

            border-bottom:
                1px solid
                #e2e8f0;

            vertical-align:
                top;

        }


        .pdf-total {

            color:
                #16a34a;

            font-weight:
                700;

        }


        .pdf-summary {

            margin-top:
                20px;

            border-top:
                2px solid
                #20a46b;

            padding-top:
                14px;

        }


        .pdf-summary-row {

            display:
                flex;

            justify-content:
                space-between;

            width:
                300px;

            font-size:
                12px;

            margin-bottom:
                6px;

        }


        .pdf-footer {

            margin-top:
                35px;

            text-align:
                center;

            color:
                #94a3b8;

            font-size:
                9px;

        }

    </style>

</head>


<body>


    <main
        class="max-w-3xl mx-auto px-4 py-6 pb-12"
    >


        <!-- =========================
             HEADER
        ========================== -->

        <div
            class="flex items-center
                   justify-between mb-6"
        >

            <div>

                <h1
                    class="text-2xl
                           font-bold
                           text-white"
                >
                    Saving
                </h1>

                <p
                    class="text-slate-400
                           text-sm mt-1"
                >
                    Manage your saving records
                </p>

            </div>


            <a
                href="./index.html"
                class="w-11 h-11
                       rounded-xl
                       bg-slate-800
                       flex items-center
                       justify-center
                       text-slate-300"
            >

                <i
                    class="fa-solid
                           fa-xmark"
                ></i>

            </a>

        </div>


        <!-- =========================
             FORM
        ========================== -->

        <section
            class="app-card
                   rounded-2xl p-5"
        >


            <div
                class="flex items-center
                       justify-between mb-5"
            >

                <div>

                    <h2
                        id="form-title"
                        class="text-lg
                               font-semibold"
                    >
                        Add Saving
                    </h2>

                    <p
                        id="form-subtitle"
                        class="text-sm
                               text-slate-400
                               mt-1"
                    >
                        Add a new saving record
                    </p>

                </div>


                <div
                    id="edit-badge"
                    class="hidden
                           px-3 py-1
                           rounded-full
                           bg-emerald-500/10
                           text-emerald-300
                           text-xs
                           font-medium"
                >
                    Editing
                </div>

            </div>


            <!-- Amount -->

            <label
                class="block mb-2
                       font-medium
                       text-slate-300"
            >
                Amount
            </label>

            <input
                id="saving-amount"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                class="input-box mb-5"
                placeholder="0"
            >


            <!-- Category -->

            <label
                class="block mb-2
                       font-medium
                       text-slate-300"
            >
                Category
            </label>

            <input
                id="saving-category"
                type="text"
                class="input-box mb-5"
                placeholder="e.g. Emergency, Bank, Future"
                autocomplete="off"
            >


            <!-- Date -->

            <label
                class="block mb-2
                       font-medium
                       text-slate-300"
            >
                Date
            </label>

            <input
                id="saving-date"
                type="date"
                class="input-box mb-5"
            >


            <!-- Note -->

            <label
                class="block mb-2
                       font-medium
                       text-slate-300"
            >
                Note
            </label>

            <textarea
                id="saving-note"
                rows="3"
                class="input-box mb-5
                       resize-none"
                placeholder="Optional note..."
            ></textarea>


            <!-- Buttons -->

            <div
                class="grid
                       grid-cols-2
                       gap-3"
            >

                <button
                    id="cancel-edit"
                    type="button"
                    class="rounded-xl
                           bg-slate-800
                           text-slate-200
                           font-semibold
                           py-3"
                >
                    Cancel
                </button>


                <button
                    id="save-saving"
                    type="button"
                    class="rounded-xl
                           bg-emerald-600
                           hover:bg-emerald-500
                           text-white
                           font-semibold
                           py-3"
                >

                    <i
                        class="fa-solid
                               fa-check mr-2"
                    ></i>

                    <span
                        id="save-button-text"
                    >
                        Save Saving
                    </span>

                </button>

            </div>

        </section>


        <!-- =========================
             SUMMARY
        ========================== -->

        <section
            class="grid
                   grid-cols-2
                   gap-3 mt-6"
        >


            <div
                class="app-card
                       rounded-2xl p-4"
            >

                <div
                    class="text-sm
                           text-slate-400"
                >
                    Total Saving
                </div>

                <div
                    id="total-saving"
                    class="text-xl
                           font-bold
                           text-emerald-400
                           mt-2"
                >
                    NPR 0
                </div>

            </div>


            <div
                class="app-card
                       rounded-2xl p-4"
            >

                <div
                    class="text-sm
                           text-slate-400"
                >
                    Records
                </div>

                <div
                    id="saving-count"
                    class="text-xl
                           font-bold
                           text-white mt-2"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =========================
             RECORDS HEADER
        ========================== -->

        <section
            class="mt-7"
        >

            <div
                class="flex items-center
                       justify-between
                       gap-3"
            >

                <div>

                    <h2
                        class="text-xl
                               font-bold"
                    >
                        Saving Records
                    </h2>

                    <p
                        class="text-sm
                               text-slate-400
                               mt-1"
                    >
                        Your saved amounts
                    </p>

                </div>


                <!-- PDF -->

                <button
                    id="download-pdf"
                    type="button"
                    class="px-4 py-3
                           rounded-xl
                           bg-emerald-600
                           hover:bg-emerald-500
                           text-white
                           font-semibold
                           text-sm
                           whitespace-nowrap"
                >

                    <i
                        class="fa-solid
                               fa-file-pdf mr-2"
                    ></i>

                    PDF

                </button>

            </div>


            <!-- Records -->

            <div
                id="saving-list"
                class="space-y-3 mt-4"
            ></div>


            <!-- Empty -->

            <div
                id="empty-state"
                class="hidden
                       app-card
                       rounded-2xl
                       p-8
                       text-center
                       mt-4"
            >

                <div
                    class="w-16 h-16
                           mx-auto mb-4
                           rounded-2xl
                           bg-emerald-500/10
                           flex items-center
                           justify-center"
                >

                    <i
                        class="fa-solid
                               fa-piggy-bank
                               text-emerald-400
                               text-2xl"
                    ></i>

                </div>


                <h3
                    class="font-semibold
                           text-lg"
                >
                    No saving records
                </h3>


                <p
                    class="text-slate-400
                           text-sm mt-1"
                >
                    Add your first saving record above.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         PDF CONTENT
    ========================== -->

    <div
        id="pdf-content"
    ></div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast-container"
        class="fixed bottom-5
               left-4 right-4
               z-[9999]
               flex justify-center
               pointer-events-none"
    ></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script type="module">


        import {

            getSavings,

            addSaving,

            updateSaving,

            deleteSaving,

            getTotalSaving

        } from "./js/savings.js";


        import {

            getProfileValue

        } from "./js/storage.js";


        import "./js/app.js";


        /* =========================================
           ELEMENTS
        ========================================== */


        const amountInput =
            document.getElementById(
                "saving-amount"
            );


        const categoryInput =
            document.getElementById(
                "saving-category"
            );


        const dateInput =
            document.getElementById(
                "saving-date"
            );


        const noteInput =
            document.getElementById(
                "saving-note"
            );


        const saveButton =
            document.getElementById(
                "save-saving"
            );


        const saveButtonText =
            document.getElementById(
                "save-button-text"
            );


        const cancelButton =
            document.getElementById(
                "cancel-edit"
            );


        const formTitle =
            document.getElementById(
                "form-title"
            );


        const formSubtitle =
            document.getElementById(
                "form-subtitle"
            );


        const editBadge =
            document.getElementById(
                "edit-badge"
            );


        const savingList =
            document.getElementById(
                "saving-list"
            );


        const emptyState =
            document.getElementById(
                "empty-state"
            );


        const totalSavingEl =
            document.getElementById(
                "total-saving"
            );


        const savingCountEl =
            document.getElementById(
                "saving-count"
            );


        const pdfButton =
            document.getElementById(
                "download-pdf"
            );


        /* =========================================
           STATE
        ========================================== */


        let editingId =
            null;


        /* =========================================
           TODAY
        ========================================== */


        function today() {

            return new Date()
                .toISOString()
                .split("T")[0];

        }


        dateInput.value =
            today();


        /* =========================================
           MONEY
        ========================================== */


        function money(
            value
        ) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits:
                        2
                }
            );

        }


        /* =========================================
           ESCAPE HTML
        ========================================== */


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =========================================
           TOAST
        ========================================== */


        function showToast(
            message,
            type = "success"
        ) {

            const container =
                document.getElementById(
                    "toast-container"
                );


            const toast =
                document.createElement(
                    "div"
                );


            const icon =
                type === "error"
                    ? "fa-circle-exclamation"
                    : "fa-circle-check";


            const bg =
                type === "error"
                    ? "bg-red-600"
                    : "bg-emerald-600";


            toast.className =
                `
                    toast
                    ${bg}
                    text-white
                    px-5 py-3
                    rounded-xl
                    shadow-xl
                    text-sm
                    font-medium
                `;


            toast.innerHTML =
                `
                    <i
                        class="fa-solid
                               ${icon}
                               mr-2"
                    ></i>

                    ${escapeHtml(message)}
                `;


            container.appendChild(
                toast
            );


            setTimeout(
                () => {

                    toast.remove();

                },
                2500
            );

        }


        /* =========================================
           RESET
        ========================================== */


        function resetForm() {

            editingId =
                null;


            amountInput.value =
                "";


            categoryInput.value =
                "";


            dateInput.value =
                today();


            noteInput.value =
                "";


            formTitle.textContent =
                "Add Saving";


            formSubtitle.textContent =
                "Add a new saving record";


            saveButtonText.textContent =
                "Save Saving";


            editBadge.classList.add(
                "hidden"
            );

        }


        /* =========================================
           SAVE / UPDATE
        ========================================== */


        saveButton.addEventListener(
            "click",
            () => {

                const amount =
                    Number(
                        amountInput.value
                    ) || 0;


                const category =
                    categoryInput.value
                        .trim();


                const date =
                    dateInput.value
                    ||
                    today();


                const note =
                    noteInput.value
                        .trim();


                if (
                    amount <= 0
                ) {

                    showToast(
                        "Please enter saving amount.",
                        "error"
                    );

                    amountInput.focus();

                    return;

                }


                const data = {

                    amount,

                    category,

                    date,

                    note

                };


                if (
                    editingId
                ) {

                    updateSaving(
                        editingId,
                        data
                    );


                    showToast(
                        "Saving updated successfully."
                    );

                } else {

                    addSaving(
                        data
                    );


                    showToast(
                        "Saving added successfully."
                    );

                }


                resetForm();

                renderSavings();

            }
        );


        /* =========================================
           CANCEL
        ========================================== */


        cancelButton.addEventListener(
            "click",
            () => {

                resetForm();

            }
        );


        /* =========================================
           EDIT
        ========================================== */


        function startEdit(
            id
        ) {

            const savings =
                getSavings();


            const item =
                savings.find(
                    saving =>
                        saving.id === id
                );


            if (!item) {
                return;
            }


            editingId =
                id;


            amountInput.value =
                Number(
                    item.amount
                ) || 0;


            categoryInput.value =
                item.category
                ||
                "";


            dateInput.value =
                item.date
                ||
                today();


            noteInput.value =
                item.note
                ||
                "";


            formTitle.textContent =
                "Edit Saving";


            formSubtitle.textContent =
                "Correct this saving record";


            saveButtonText.textContent =
                "Update Saving";


            editBadge.classList.remove(
                "hidden"
            );


            window.scrollTo(
                {
                    top: 0,
                    behavior: "smooth"
                }
            );

        }


        /* =========================================
           DELETE
        ========================================== */


        function removeSaving(
            id
        ) {

            const savings =
                getSavings();


            const item =
                savings.find(
                    saving =>
                        saving.id === id
                );


            if (!item) {
                return;
            }


            const confirmed =
                window.confirm(
                    "Delete this saving record?"
                );


            if (!confirmed) {
                return;
            }


            deleteSaving(
                id
            );


            if (
                editingId === id
            ) {

                resetForm();

            }


            showToast(
                "Saving deleted."
            );


            renderSavings();

        }


        /* =========================================
           RENDER
        ========================================== */


        function renderSavings() {

            const savings =
                getSavings();


            savingCountEl.textContent =
                savings.length;


            totalSavingEl.textContent =
                `NPR ${money(
                    getTotalSaving()
                )}`;


            if (
                savings.length === 0
            ) {

                savingList.innerHTML =
                    "";

                emptyState.classList.remove(
                    "hidden"
                );

                return;

            }


            emptyState.classList.add(
                "hidden"
            );


            savingList.innerHTML =
                savings
                    .map(
                        item =>
                            renderSavingCard(
                                item
                            )
                    )
                    .join("");


            attachRecordEvents();

        }


        /* =========================================
           RECORD CARD
        ========================================== */


        function renderSavingCard(
            item
        ) {

            return `
                <div
                    class="saving-card p-4"
                >

                    <div
                        class="flex
                               items-start
                               justify-between
                               gap-3"
                    >

                        <div
                            class="flex
                                   items-center
                                   gap-3
                                   min-w-0"
                        >

                            <div
                                class="w-11 h-11
                                       rounded-xl
                                       bg-emerald-500/10
                                       flex items-center
                                       justify-center
                                       shrink-0"
                            >

                                <i
                                    class="fa-solid
                                           fa-piggy-bank
                                           text-emerald-400"
                                ></i>

                            </div>


                            <div
                                class="min-w-0"
                            >

                                <div
                                    class="font-semibold
                                           text-white
                                           truncate"
                                >
                                    ${
                                        escapeHtml(
                                            item.category
                                            ||
                                            "General Saving"
                                        )
                                    }
                                </div>


                                <div
                                    class="text-xs
                                           text-slate-400
                                           mt-1"
                                >
                                    ${
                                        escapeHtml(
                                            formatDate(
                                                item.date
                                            )
                                        )
                                    }
                                </div>

                            </div>

                        </div>


                        <div
                            class="text-right
                                   shrink-0"
                        >

                            <div
                                class="text-lg
                                       font-bold
                                       text-emerald-400"
                            >
                                NPR ${money(
                                    item.amount
                                )}
                            </div>

                        </div>

                    </div>


                    ${
                        item.note
                            ? `
                                <div
                                    class="mt-3
                                           pt-3
                                           border-t
                                           border-slate-800
                                           text-sm
                                           text-slate-400"
                                >
                                    ${escapeHtml(
                                        item.note
                                    )}
                                </div>
                            `
                            : ""
                    }


                    <div
                        class="flex
                               justify-end
                               gap-2
                               mt-3"
                    >

                        <button
                            type="button"
                            class="edit-record
                                   px-3 py-2
                                   rounded-lg
                                   bg-indigo-500/10
                                   text-indigo-300
                                   text-xs"
                            data-id="${escapeHtml(
                                item.id
                            )}"
                        >

                            <i
                                class="fa-solid
                                       fa-pen mr-1"
                            ></i>

                            Edit

                        </button>


                        <button
                            type="button"
                            class="delete-record
                                   px-3 py-2
                                   rounded-lg
                                   bg-red-500/10
                                   text-red-300
                                   text-xs"
                            data-id="${escapeHtml(
                                item.id
                            )}"
                        >

                            <i
                                class="fa-solid
                                       fa-trash mr-1"
                            ></i>

                            Delete

                        </button>

                    </div>

                </div>
            `;

        }


        /* =========================================
           EVENTS
        ========================================== */


        function attachRecordEvents() {

            document
                .querySelectorAll(
                    ".edit-record"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                startEdit(
                                    button.dataset.id
                                );

                            }
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".delete-record"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                removeSaving(
                                    button.dataset.id
                                );

                            }
                        );

                    }
                );

        }


        /* =========================================
           DATE
        ========================================== */


        function formatDate(
            value
        ) {

            if (!value) {
                return "-";
            }


            const parts =
                String(
                    value
                ).split("-");


            if (
                parts.length === 3
            ) {

                return `
                    ${parts[2]}
                    ${monthName(parts[1])}
                    ${parts[0]}
                `;

            }


            return value;

        }


        function monthName(
            month
        ) {

            const months = [

                "Jan",
                "Feb",
                "Mar",
                "Apr",
                "May",
                "Jun",
                "Jul",
                "Aug",
                "Sep",
                "Oct",
                "Nov",
                "Dec"

            ];


            return (
                months[
                    Number(month) - 1
                ]
                ||
                month
            );

        }


        /* =========================================
           PROFILE
        ========================================== */


        function getProfile() {

            return {

                name:
                    getProfileValue(
                        "profile_name",
                        "Digital Notebook User"
                    ),

                address:
                    getProfileValue(
                        "profile_address",
                        ""
                    ),

                mobile:
                    getProfileValue(
                        "profile_mobile",
                        ""
                    ),

                email:
                    getProfileValue(
                        "profile_email",
                        ""
                    ),

                avatar:
                    getProfileValue(
                        "profile_avatar",
                        ""
                    )

            };

        }


        /* =========================================
           WAIT FOR IMAGES
        ========================================== */


        async function waitForImages(
            container
        ) {

            const images =
                container.querySelectorAll(
                    "img"
                );


            await Promise.all(

                [
                    ...images
                ].map(
                    img => {

                        if (
                            img.complete
                            &&
                            img.naturalWidth > 0
                        ) {

                            return Promise.resolve();

                        }


                        return new Promise(
                            resolve => {

                                img.onload =
                                    resolve;

                                img.onerror =
                                    resolve;

                            }
                        );

                    }
                )

            );

        }


        /* =========================================
           PDF BUTTON
        ========================================== */


        pdfButton.addEventListener(
            "click",
            generatePDF
        );


        /* =========================================
           GENERATE PDF
        ========================================== */


        async function generatePDF() {

            const savings =
                getSavings();


            if (
                savings.length === 0
            ) {

                showToast(
                    "There are no saving records for PDF.",
                    "error"
                );

                return;

            }


            pdfButton.disabled =
                true;


            pdfButton.innerHTML =
                `
                    <i
                        class="fa-solid
                               fa-spinner
                               fa-spin mr-2"
                    ></i>

                    Preparing...
                `;


            try {

                const profile =
                    getProfile();


                const pdfContent =
                    document.getElementById(
                        "pdf-content"
                    );


                /*
                 * Permanent app banner.
                 *
                 * Put your actual banner here:
                 *
                 * assets/bannerlogo.png
                 */

                const bannerLogoUrl =
                    new URL(
                        "./assets/bannerlogo.png",
                        window.location.href
                    ).href;


                /*
                 * User avatar.
                 *
                 * If user has no avatar,
                 * use app icon.
                 */

                const avatarSrc =
                    profile.avatar
                    ||
                    new URL(
                        "./assets/N1024.png",
                        window.location.href
                    ).href;


                const totalSaving =
                    savings.reduce(
                        (
                            total,
                            item
                        ) => {

                            return (
                                total
                                +
                                (
                                    Number(
                                        item.amount
                                    )
                                    ||
                                    0
                                )
                            );

                        },
                        0
                    );


                /*
                 * Create every saving
                 * record as a PDF row.
                 */

                const rows =
                    savings
                        .map(
                            (
                                item,
                                index
                            ) => {

                                return `
                                    <tr>

                                        <td>
                                            ${index + 1}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                formatDate(
                                                    item.date
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                item.category
                                                ||
                                                "General Saving"
                                            )}
                                        </td>

                                        <td>
                                            ${
                                                escapeHtml(
                                                    item.note
                                                    ||
                                                    "-"
                                                )
                                            }
                                        </td>

                                        <td
                                            class="pdf-total"
                                        >
                                            NPR
                                            ${money(
                                                item.amount
                                            )}
                                        </td>

                                    </tr>
                                `;

                            }
                        )
                        .join("");


                /*
                 * Build complete PDF page.
                 */

                pdfContent.innerHTML =
                    `

                        <div
                            class="pdf-header"
                        >

                            <!-- USER -->

                            <div
                                class="pdf-user"
                            >

                                <img
                                    src="${escapeHtml(
                                        avatarSrc
                                    )}"
                                    class="pdf-avatar"
                                    crossorigin="anonymous"
                                    alt="User"
                                >


                                <div
                                    class="pdf-user-info"
                                >

                                    <div
                                        class="pdf-user-name"
                                    >
                                        ${escapeHtml(
                                            profile.name
                                        )}
                                    </div>


                                    ${
                                        profile.address
                                            ? `
                                                <div>
                                                    📍
                                                    ${escapeHtml(
                                                        profile.address
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }


                                    ${
                                        profile.mobile
                                            ? `
                                                <div>
                                                    📞
                                                    ${escapeHtml(
                                                        profile.mobile
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }


                                    ${
                                        profile.email
                                            ? `
                                                <div>
                                                    ✉️
                                                    ${escapeHtml(
                                                        profile.email
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }

                                </div>

                            </div>


                            <!-- APP BANNER -->

                            <div
                                class="pdf-banner"
                            >

                                <img
                                    src="${escapeHtml(
                                        bannerLogoUrl
                                    )}"
                                    class="pdf-banner-image"
                                    crossorigin="anonymous"
                                    alt="Digital Notebook"
                                >

                            </div>

                        </div>


                        <!-- TITLE -->

                        <div
                            class="pdf-title"
                        >

                            <h1>
                                SAVING REPORT
                            </h1>

                            <p>
                                Digital Notebook
                                •
                                Generated:
                                ${formatDate(
                                    today()
                                )}
                            </p>

                        </div>


                        <!-- TABLE -->

                        <table
                            class="pdf-table"
                        >

                            <thead>

                                <tr>

                                    <th>
                                        #
                                    </th>

                                    <th>
                                        Date
                                    </th>

                                    <th>
                                        Category
                                    </th>

                                    <th>
                                        Note
                                    </th>

                                    <th>
                                        Amount
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                ${rows}

                            </tbody>

                        </table>


                        <!-- SUMMARY -->

                        <div
                            class="pdf-summary"
                        >

                            <div
                                class="pdf-summary-row"
                            >

                                <span>
                                    Total Records:
                                </span>

                                <strong>
                                    ${savings.length}
                                </strong>

                            </div>


                            <div
                                class="pdf-summary-row"
                            >

                                <span>
                                    Total Saving:
                                </span>

                                <strong
                                    class="pdf-total"
                                >
                                    NPR
                                    ${money(
                                        totalSaving
                                    )}
                                </strong>

                            </div>

                        </div>


                        <!-- FOOTER -->

                        <div
                            class="pdf-footer"
                        >
                            Digital Notebook
                        </div>

                    `;


                /*
                 * Wait for avatar and banner.
                 */

                await waitForImages(
                    pdfContent
                );


                /*
                 * Small rendering delay.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            300
                        )
                );


                /*
                 * Convert HTML to image.
                 */

                const canvas =
                    await html2canvas(
                        pdfContent,
                        {
                            scale: 2,

                            useCORS:
                                true,

                            allowTaint:
                                false,

                            backgroundColor:
                                "#ffffff"
                        }
                    );


                /*
                 * jsPDF
                 */

                const {
                    jsPDF
                } =
                    window.jspdf;


                const pdf =
                    new jsPDF(
                        {
                            orientation:
                                "portrait",

                            unit:
                                "mm",

                            format:
                                "a4"
                        }
                    );


                const pageWidth =
                    pdf.internal
                        .pageSize
                        .getWidth();


                const pageHeight =
                    pdf.internal
                        .pageSize
                        .getHeight();


                const imageWidth =
                    pageWidth;


                const imageHeight =
                    (
                        canvas.height
                        *
                        imageWidth
                    )
                    /
                    canvas.width;


                let heightLeft =
                    imageHeight;


                let position =
                    0;


                const imageData =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.95
                    );


                /*
                 * First page.
                 */

                pdf.addImage(
                    imageData,
                    "JPEG",
                    0,
                    position,
                    imageWidth,
                    imageHeight
                );


                heightLeft -=
                    pageHeight;


                /*
                 * Additional pages.
                 *
                 * This means if saving records
                 * are many, everything continues
                 * into the same PDF.
                 */

                while (
                    heightLeft > 0
                ) {

                    position =
                        heightLeft
                        -
                        imageHeight;


                    pdf.addPage();


                    pdf.addImage(
                        imageData,
                        "JPEG",
                        0,
                        position,
                        imageWidth,
                        imageHeight
                    );


                    heightLeft -=
                        pageHeight;

                }


                /*
                 * Save.
                 */

                pdf.save(
                    "Digital-Notebook-Saving-Report.pdf"
                );


                showToast(
                    "Saving PDF created successfully."
                );


            } catch (
                error
            ) {

                console.error(
                    "Saving PDF error:",
                    error
                );


                showToast(
                    "PDF बनाउन समस्या भयो। फेरि प्रयास गर्नुहोस्।",
                    "error"
                );

            } finally {

                pdfButton.disabled =
                    false;


                pdfButton.innerHTML =
                    `
                        <i
                            class="fa-solid
                                   fa-file-pdf mr-2"
                        ></i>

                        PDF
                    `;

            }

        }


        /* =========================================
           SERVICE WORKER
        ========================================== */


        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./sw.js"
                        )
                        .catch(
                            error => {

                                console.warn(
                                    "Service worker error:",
                                    error
                                );

                            }
                        );

                }
            );

        }


        /* =========================================
           INITIAL
        ========================================== */


        renderSavings();

    </script>

</body>

</html>
