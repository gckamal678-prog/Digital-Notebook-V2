<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>
        Saving - Digital Notebook
    </title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>

        body {
            font-family: "Poppins", sans-serif;
            background: #f3f4f6;
        }

        html[data-theme="dark"] body {
            background: #111827;
            color: #f9fafb;
        }

        html[data-theme="dark"] .card {
            background: #1f2937;
            color: #f9fafb;
        }

        html[data-theme="dark"] input,
        html[data-theme="dark"] textarea,
        html[data-theme="dark"] select {
            background: #111827;
            color: #fff;
            border-color: #374151;
        }

        .group-records {
            display: none;
        }

        .group-records.open {
            display: block;
        }

        .rotate {
            transform: rotate(180deg);
        }

        #pdf-content {
            position: absolute;
            left: -10000px;
            top: 0;
            width: 794px;
            background: #ffffff;
            color: #111827;
            padding: 35px;
            z-index: 9999;
        }

    </style>

</head>


<body>

<div class="min-h-screen">

    <!-- HEADER -->

    <header
        class="sticky top-0 z-40 bg-gray-900 text-white shadow-lg"
    >

        <div
            class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between"
        >

            <div class="flex items-center gap-3">

                <a
                    href="./index.html"
                    class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div>

                    <h1
                        class="font-bold text-lg"
                    >
                        Saving
                    </h1>

                    <p
                        class="text-xs text-gray-300"
                    >
                        Digital Notebook
                    </p>

                </div>

            </div>


            <button
                id="pdf-btn"
                class="bg-white text-gray-900 px-3 py-2 rounded-lg text-sm font-semibold"
            >

                <i
                    class="fa-solid fa-file-pdf mr-1"
                ></i>

                PDF

            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main
        class="max-w-4xl mx-auto px-4 py-5"
    >


        <!-- SUMMARY -->

        <section
            class="grid grid-cols-2 gap-3 mb-5"
        >

            <div
                class="card bg-white rounded-2xl p-4 shadow"
            >

                <p
                    class="text-xs text-gray-500"
                >
                    Total Saving
                </p>

                <h2
                    id="total-saving"
                    class="text-xl font-bold mt-1"
                >
                    रु 0
                </h2>

            </div>


            <div
                class="card bg-white rounded-2xl p-4 shadow"
            >

                <p
                    class="text-xs text-gray-500"
                >
                    Records
                </p>

                <h2
                    id="record-count"
                    class="text-xl font-bold mt-1"
                >
                    0
                </h2>

            </div>

        </section>


        <!-- ADD FORM -->

        <section
            class="card bg-white rounded-2xl shadow p-5 mb-5"
        >

            <div
                class="flex items-center justify-between mb-4"
            >

                <h2
                    id="form-title"
                    class="font-bold text-lg"
                >
                    Add Saving
                </h2>

                <button
                    id="cancel-edit"
                    class="hidden text-sm text-red-500"
                >
                    Cancel
                </button>

            </div>


            <form
                id="saving-form"
            >


                <!-- CATEGORY -->

                <div class="mb-4">

                    <label
                        class="block text-sm font-medium mb-1"
                    >
                        Saving Name / Category
                    </label>

                    <input
                        id="category"
                        type="text"
                        placeholder="Bank Saving"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                    <p
                        class="text-xs text-gray-500 mt-1"
                    >
                        उदाहरण: Bank Saving, Fixed Deposit, Gold
                    </p>

                </div>


                <!-- NPR -->

                <div class="mb-4">

                    <label
                        class="block text-sm font-medium mb-1"
                    >
                        नेरु (NPR)
                    </label>

                    <div
                        class="relative"
                    >

                        <span
                            class="absolute left-4 top-3 text-gray-500"
                        >
                            रु
                        </span>

                        <input
                            id="npr"
                            type="number"
                            inputmode="decimal"
                            min="0"
                            step="0.01"
                            placeholder="0"
                            class="w-full border border-gray-300 rounded-xl px-10 py-3"
                        >

                    </div>

                </div>


                <!-- INR -->

                <div class="mb-4">

                    <label
                        class="block text-sm font-medium mb-1"
                    >
                        भारु (INR)
                    </label>

                    <div
                        class="relative"
                    >

                        <span
                            class="absolute left-4 top-3 text-gray-500"
                        >
                            ₹
                        </span>

                        <input
                            id="inr"
                            type="number"
                            inputmode="decimal"
                            min="0"
                            step="0.01"
                            placeholder="0"
                            class="w-full border border-gray-300 rounded-xl px-10 py-3"
                        >

                    </div>

                    <p
                        class="text-xs text-gray-500 mt-1"
                    >
                        1 भारु = रु 1.60
                    </p>

                </div>


                <!-- DATE -->

                <div class="mb-4">

                    <label
                        class="block text-sm font-medium mb-1"
                    >
                        Date
                    </label>

                    <input
                        id="date"
                        type="date"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                </div>


                <!-- NOTE -->

                <div class="mb-4">

                    <label
                        class="block text-sm font-medium mb-1"
                    >
                        Note
                    </label>

                    <textarea
                        id="note"
                        rows="3"
                        placeholder="Optional note"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    ></textarea>

                </div>


                <!-- PREVIEW -->

                <div
                    class="bg-gray-100 rounded-xl p-4 mb-4"
                >

                    <div
                        class="flex justify-between text-sm mb-2"
                    >

                        <span>
                            NPR
                        </span>

                        <strong
                            id="preview-npr"
                        >
                            रु 0
                        </strong>

                    </div>


                    <div
                        class="flex justify-between text-sm mb-2"
                    >

                        <span>
                            INR
                        </span>

                        <strong
                            id="preview-inr"
                        >
                            ₹ 0
                        </strong>

                    </div>


                    <div
                        class="border-t border-gray-300 pt-2 flex justify-between"
                    >

                        <span
                            class="font-semibold"
                        >
                            Total NPR
                        </span>

                        <strong
                            id="preview-total"
                        >
                            रु 0
                        </strong>

                    </div>

                </div>


                <button
                    type="submit"
                    class="w-full bg-gray-900 text-white rounded-xl py-3 font-semibold"
                >

                    <i
                        class="fa-solid fa-floppy-disk mr-2"
                    ></i>

                    <span id="submit-text">
                        Save Saving
                    </span>

                </button>

            </form>

        </section>


        <!-- GROUP LIST -->

        <section>

            <div
                class="flex items-center justify-between mb-3"
            >

                <h2
                    class="font-bold text-lg"
                >
                    Saving Groups
                </h2>

                <span
                    id="group-count"
                    class="text-xs text-gray-500"
                >
                    0 groups
                </span>

            </div>


            <div
                id="saving-groups"
                class="space-y-3"
            ></div>


            <div
                id="empty-state"
                class="hidden card bg-white rounded-2xl p-8 text-center"
            >

                <i
                    class="fa-solid fa-piggy-bank text-4xl text-gray-400 mb-3"
                ></i>

                <p
                    class="font-semibold"
                >
                    No saving records yet
                </p>

                <p
                    class="text-sm text-gray-500 mt-1"
                >
                    Add your first saving above.
                </p>

            </div>

        </section>

    </main>

</div>


<!-- PDF CONTENT -->

<div id="pdf-content">

    <div
        style="
            text-align:center;
            border-bottom:2px solid #111827;
            padding-bottom:15px;
            margin-bottom:20px;
        "
    >

        <img
            id="pdf-avatar"
            src="./assets/N1024.png"
            style="
                width:70px;
                height:70px;
                border-radius:50%;
                object-fit:cover;
                display:block;
                margin:0 auto 10px;
            "
        >

        <h1
            style="
                font-size:24px;
                font-weight:700;
                margin:0;
            "
        >
            Digital Notebook
        </h1>

        <p
            style="
                font-size:16px;
                margin:5px 0 0;
            "
        >
            Saving Report
        </p>

    </div>


    <div
        id="pdf-profile"
        style="
            font-size:13px;
            line-height:1.8;
            margin-bottom:20px;
        "
    ></div>


    <div
        id="pdf-summary"
        style="
            background:#f3f4f6;
            padding:15px;
            border-radius:8px;
            margin-bottom:20px;
            font-size:14px;
        "
    ></div>


    <div id="pdf-table"></div>

</div>


<!-- APP -->

<script
    type="module"
>

import "./js/app.js";

import {
    getSavings,
    addSaving,
    updateSaving,
    deleteSaving,
    getGroupedSavings,
    getTotalSavingNPR,
    getTotalSavingINR,
    getTotalSaving
} from "./js/savings.js";

import {
    getProfileValue
} from "./js/storage.js";


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "saving-form"
    );

const categoryInput =
    document.getElementById(
        "category"
    );

const nprInput =
    document.getElementById(
        "npr"
    );

const inrInput =
    document.getElementById(
        "inr"
    );

const dateInput =
    document.getElementById(
        "date"
    );

const noteInput =
    document.getElementById(
        "note"
    );

const groupsContainer =
    document.getElementById(
        "saving-groups"
    );

const emptyState =
    document.getElementById(
        "empty-state"
    );

const totalSavingEl =
    document.getElementById(
        "total-saving"
    );

const recordCountEl =
    document.getElementById(
        "record-count"
    );

const groupCountEl =
    document.getElementById(
        "group-count"
    );

const previewNpr =
    document.getElementById(
        "preview-npr"
    );

const previewInr =
    document.getElementById(
        "preview-inr"
    );

const previewTotal =
    document.getElementById(
        "preview-total"
    );

const formTitle =
    document.getElementById(
        "form-title"
    );

const submitText =
    document.getElementById(
        "submit-text"
    );

const cancelEditBtn =
    document.getElementById(
        "cancel-edit"
    );

let editingId = null;


/* =========================
   DATE
========================= */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}

dateInput.value =
    today();


/* =========================
   FORMAT MONEY
========================= */

function formatNPR(value) {

    return (
        "रु " +
        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );

}


function formatINR(value) {

    return (
        "₹ " +
        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );

}


/* =========================
   UPDATE PREVIEW
========================= */

function updatePreview() {

    const npr =
        Number(
            nprInput.value
        ) || 0;

    const inr =
        Number(
            inrInput.value
        ) || 0;

    const total =
        npr
        +
        (
            inr * 1.6
        );

    previewNpr.textContent =
        formatNPR(npr);

    previewInr.textContent =
        formatINR(inr);

    previewTotal.textContent =
        formatNPR(total);

}


nprInput.addEventListener(
    "input",
    updatePreview
);

inrInput.addEventListener(
    "input",
    updatePreview
);


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(
            value + "T00:00:00"
        );

    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================
   RENDER
========================= */

function renderSavings() {

    const savings =
        getSavings();

    const groups =
        getGroupedSavings();

    const total =
        getTotalSaving();

    const totalNPR =
        getTotalSavingNPR();

    const totalINR =
        getTotalSavingINR();


    totalSavingEl.textContent =
        formatNPR(total);

    recordCountEl.textContent =
        savings.length;

    groupCountEl.textContent =
        `${groups.length} groups`;


    if (
        savings.length === 0
    ) {

        groupsContainer.innerHTML =
            "";

        emptyState.classList.remove(
            "hidden"
        );

        return;
    }


    emptyState.classList.add(
        "hidden"
    );


    groupsContainer.innerHTML =
        groups.map(
            (
                group,
                index
            ) => {

                const groupId =
                    `group_${index}`;

                return `

                <div
                    class="card bg-white rounded-2xl shadow overflow-hidden"
                >

                    <button
                        type="button"
                        class="w-full text-left p-4"
                        data-group="${groupId}"
                    >

                        <div
                            class="flex items-center justify-between gap-3"
                        >

                            <div
                                class="flex items-center gap-3"
                            >

                                <div
                                    class="w-11 h-11 rounded-xl bg-gray-900 text-white flex items-center justify-center"
                                >
                                    <i
                                        class="fa-solid fa-piggy-bank"
                                    ></i>
                                </div>

                                <div>

                                    <h3
                                        class="font-bold"
                                    >
                                        ${escapeHTML(
                                            group.name
                                        )}
                                    </h3>

                                    <p
                                        class="text-xs text-gray-500"
                                    >
                                        ${group.records.length}
                                        record${group.records.length === 1 ? "" : "s"}
                                    </p>

                                </div>

                            </div>


                            <i
                                class="fa-solid fa-chevron-down transition-transform"
                                id="icon_${groupId}"
                            ></i>

                        </div>


                        <div
                            class="grid grid-cols-3 gap-2 mt-4 text-xs"
                        >

                            <div
                                class="bg-gray-100 rounded-lg p-2"
                            >

                                <span
                                    class="text-gray-500 block"
                                >
                                    NPR
                                </span>

                                <strong>
                                    ${formatNPR(group.npr)}
                                </strong>

                            </div>


                            <div
                                class="bg-gray-100 rounded-lg p-2"
                            >

                                <span
                                    class="text-gray-500 block"
                                >
                                    INR
                                </span>

                                <strong>
                                    ${formatINR(group.inr)}
                                </strong>

                            </div>


                            <div
                                class="bg-gray-100 rounded-lg p-2"
                            >

                                <span
                                    class="text-gray-500 block"
                                >
                                    Total
                                </span>

                                <strong>
                                    ${formatNPR(group.total)}
                                </strong>

                            </div>

                        </div>

                    </button>


                    <div
                        id="${groupId}"
                        class="group-records border-t border-gray-200"
                    >

                        ${group.records.map(
                            item => `

                            <div
                                class="p-4 border-b border-gray-200 last:border-b-0"
                            >

                                <div
                                    class="flex items-start justify-between gap-3"
                                >

                                    <div>

                                        <p
                                            class="font-semibold text-sm"
                                        >
                                            ${formatDate(
                                                item.date
                                            )}
                                        </p>

                                        <p
                                            class="text-xs text-gray-500 mt-1"
                                        >
                                            ${escapeHTML(
                                                item.note
                                                ||
                                                "No note"
                                            )}
                                        </p>

                                    </div>


                                    <div
                                        class="text-right"
                                    >

                                        <p
                                            class="font-bold"
                                        >
                                            ${formatNPR(
                                                item.total
                                            )}
                                        </p>

                                        <p
                                            class="text-xs text-gray-500"
                                        >
                                            ${formatNPR(
                                                item.npr
                                            )}
                                            +
                                            ${formatINR(
                                                item.inr
                                            )}
                                        </p>

                                    </div>

                                </div>


                                <div
                                    class="flex justify-end gap-2 mt-3"
                                >

                                    <button
                                        type="button"
                                        class="edit-btn px-3 py-2 rounded-lg bg-gray-100 text-sm"
                                        data-id="${item.id}"
                                    >
                                        <i
                                            class="fa-solid fa-pen mr-1"
                                        ></i>
                                        Edit
                                    </button>


                                    <button
                                        type="button"
                                        class="delete-btn px-3 py-2 rounded-lg bg-red-50 text-red-600 text-sm"
                                        data-id="${item.id}"
                                    >
                                        <i
                                            class="fa-solid fa-trash mr-1"
                                        ></i>
                                        Delete
                                    </button>

                                </div>

                            </div>

                            `
                        ).join("")}

                    </div>

                </div>

                `;
            }
        ).join("");


    document
        .querySelectorAll(
            "[data-group]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.group;

                        const records =
                            document.getElementById(
                                id
                            );

                        const icon =
                            document.getElementById(
                                `icon_${id}`
                            );

                        records.classList.toggle(
                            "open"
                        );

                        icon.classList.toggle(
                            "rotate"
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".edit-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        editSaving(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".delete-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeSaving(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


/* =========================
   EDIT
========================= */

function editSaving(id) {

    const savings =
        getSavings();

    const item =
        savings.find(
            saving =>
                saving.id === id
        );

    if (!item) {
        return;
    }

    editingId =
        id;

    categoryInput.value =
        item.category || "";

    nprInput.value =
        item.npr || "";

    inrInput.value =
        item.inr || "";

    dateInput.value =
        item.date || today();

    noteInput.value =
        item.note || "";


    formTitle.textContent =
        "Edit Saving";

    submitText.textContent =
        "Update Saving";

    cancelEditBtn.classList.remove(
        "hidden"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    updatePreview();

}


/* =========================
   DELETE
========================= */

function removeSaving(id) {

    const ok =
        confirm(
            "यो saving record delete गर्ने?"
        );

    if (!ok) {
        return;
    }

    deleteSaving(
        id
    );

    if (
        editingId === id
    ) {
        resetForm();
    }

    renderSavings();

}


/* =========================
   RESET FORM
========================= */

function resetForm() {

    editingId =
        null;

    form.reset();

    dateInput.value =
        today();

    formTitle.textContent =
        "Add Saving";

    submitText.textContent =
        "Save Saving";

    cancelEditBtn.classList.add(
        "hidden"
    );

    updatePreview();

}


cancelEditBtn.addEventListener(
    "click",
    resetForm
);


/* =========================
   SUBMIT
========================= */

form.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const category =
            categoryInput.value.trim();

        const npr =
            Number(
                nprInput.value
            ) || 0;

        const inr =
            Number(
                inrInput.value
            ) || 0;


        if (
            !category
        ) {

            alert(
                "Saving name/category लेख्नुहोस्।"
            );

            categoryInput.focus();

            return;
        }


        if (
            npr <= 0
            &&
            inr <= 0
        ) {

            alert(
                "NPR वा INR मध्ये कम्तीमा एउटा amount राख्नुहोस्।"
            );

            return;
        }


        const data = {

            category,

            npr,

            inr,

            date:
                dateInput.value
                ||
                today(),

            note:
                noteInput.value.trim()

        };


        if (
            editingId
        ) {

            updateSaving(
                editingId,
                data
            );

        } else {

            addSaving(
                data
            );

        }


        resetForm();

        renderSavings();

    }
);


/* =========================
   PROFILE
========================= */

function getProfile() {

    return {

        name:
            getProfileValue(
                "profile_name",
                "Digital Notebook User"
            ),

        address:
            getProfileValue(
                "profile_address",
                ""

/* =========================
   PDF
========================= */

async function generatePDF() {

    const button =
        document.getElementById(
            "pdf-btn"
        );

    const oldText =
        button.innerHTML;

    try {

        button.disabled =
            true;

        button.innerHTML =
            `
            <i class="fa-solid fa-spinner fa-spin mr-1"></i>
            Creating...
            `;


        preparePDF();


        const pdfContent =
            document.getElementById(
                "pdf-content"
            );


        const canvas =
            await html2canvas(
                pdfContent,
                {
                    scale: 2,
                    useCORS: true,
                    backgroundColor:
                        "#ffffff"
                }
            );


        const {
            jsPDF
        } =
            window.jspdf;


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            210;

        const pageHeight =
            297;

        const margin =
            10;

        const usableWidth =
            pageWidth
            -
            (
                margin * 2
            );

        const imageWidth =
            usableWidth;

        const imageHeight =
            canvas.height
            *
            imageWidth
            /
            canvas.width;


        const pageImageHeight =
            pageHeight
            -
            (
                margin * 2
            );


        let renderedHeight =
            0;

        let pageNumber =
            0;


        while (
            renderedHeight
            <
            imageHeight
        ) {

            if (
                pageNumber > 0
            ) {

                pdf.addPage();

            }


            const sourceY =
                renderedHeight
                *
                canvas.width
                /
                imageWidth;


            const sourceHeight =
                Math.min(
                    pageImageHeight
                    *
                    canvas.width
                    /
                    imageWidth,
                    canvas.height
                    -
                    sourceY
                );


            const pageCanvas =
                document.createElement(
                    "canvas"
                );


            pageCanvas.width =
                canvas.width;

            pageCanvas.height =
                Math.ceil(
                    sourceHeight
                );


            const ctx =
                pageCanvas.getContext(
                    "2d"
                );


            ctx.fillStyle =
                "#ffffff";

            ctx.fillRect(
                0,
                0,
                pageCanvas.width,
                pageCanvas.height
            );


            ctx.drawImage(
                canvas,
                0,
                sourceY,
                canvas.width,
                sourceHeight,
                0,
                0,
                canvas.width,
                sourceHeight
            );


            const pageImage =
                pageCanvas.toDataURL(
                    "image/jpeg",
                    0.92
                );


            const actualPageHeight =
                sourceHeight
                *
                imageWidth
                /
                canvas.width;


            pdf.addImage(
                pageImage,
                "JPEG",
                margin,
                margin,
                imageWidth,
                actualPageHeight
            );


            renderedHeight +=
                pageImageHeight;

            pageNumber++;

        }


        pdf.save(
            "Digital-Notebook-Saving-Report.pdf"
        );


    } catch (error) {

        console.error(
            "PDF error:",
            error
        );

        alert(
            "PDF बनाउन समस्या भयो। फेरि प्रयास गर्नुहोस्।"
        );

    } finally {

        button.disabled =
            false;

        button.innerHTML =
            oldText;

    }

}


document
    .getElementById(
        "pdf-btn"

        "click",
