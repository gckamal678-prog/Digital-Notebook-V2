<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Digital NoteBook - Notebook</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <style>

        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        html[data-theme="dark"] body {
            background: #111827;
            color: #f9fafb;
        }

        .app-panel {
            background: white;
            border: 1px solid #e5e7eb;
        }

        html[data-theme="dark"] .app-panel {
            background: #1f2937;
            border-color: #374151;
        }

        .app-input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            background: white;
            color: #111827;
        }

        html[data-theme="dark"] .app-input {
            background: #111827;
            color: #f9fafb;
            border-color: #4b5563;
        }

        .app-input:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #374151;
            transition: 0.2s;
        }

        html[data-theme="dark"] .sidebar-link {
            color: #d1d5db;
        }

        .sidebar-link:hover {
            background: #f3f4f6;
        }

        html[data-theme="dark"] .sidebar-link:hover {
            background: #374151;
        }

        .sidebar-link.active {
            background: #4f46e5;
            color: white !important;
        }

        .note-card {
            transition: 0.2s;
        }

        .note-card:hover {
            transform: translateY(-2px);
        }

        .priority-normal {
            border-left: 4px solid #6b7280;
        }

        .priority-important {
            border-left: 4px solid #f59e0b;
        }

        .priority-urgent {
            border-left: 4px solid #ef4444;
        }

        .completed-note {
            opacity: 0.65;
        }

        .completed-note .note-title {
            text-decoration: line-through;
        }

        .category-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            border-radius: 999px;
            padding: 0.25rem 0.65rem;
            font-size: 0.72rem;
            font-weight: 600;
        }

    </style>

</head>


<body>


    <!-- SIDEBAR BACKDROP -->

    <!-- SIDEBAR -->

            <div>

            <a

            <!-- ADD NOTE -->

            <section

            >

                    </h3>

                <form id="note-form">

                    <input

                    >


                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">


                        <!-- TITLE -->

                            <label
                                for="note-title"

                        <!-- CATEGORY -->

                        <div>

                            <label
                                for="note-category"

                            <select
                                id="note-category"

                            >

                                <option value="general">

                                <option value="shopping">

                                <option value="contact">

                                <option value="important">

                                </option>

                                <option value="idea">
                                    Idea
                                </option>

                                <option value="work">
                                    Work
                                </option>

                                <option value="personal">
                                    Personal
                                </option>

                                <option value="travel">
                                    Travel
                                </option>

                                <option value="study">
                                    Study
                                </option>

                                <option value="reminder">
                                    Reminder
                                </option>

                            </select>

                        </div>


                        <!-- PRIORITY -->

                        <div>

                            <label
                                for="note-priority"
                                class="mb-2 block text-sm font-medium"
                            >
                                Priority
                            </label>

                            <select
                                id="note-priority"
                                class="app-input"
                            >

                                <option value="normal">
                                    Normal
                                </option>

                                <option value="important">
                                    Important
                                </option>

                                <option value="urgent">
                                    Urgent
                                </option>

                            </select>

                        </div>


                        <!-- DATE -->

                        <div>

                            <label
                                for="note-date"

                        <!-- CONTENT -->

                            <label
                                for="note-content"

                            >

                            </label>

                            <textarea

                        </div>

                    </div>


                    <!-- ACTION -->

                    <div class="mt-5 flex flex-wrap gap-3">

            </section>


            <!-- SEARCH -->

            <section

            >

                <div

                >

                    <div class="relative flex-1">

                        <i
                            class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
                        ></i>

                        <input
                            id="search-notes"
                            type="search"
                            placeholder="Search notes..."
                            class="app-input pl-10"
                        >

                    </div>


                    <select
                        id="filter-category"
                        class="app-input md:w-52"
                    >

                        <option value="all">
                            All Categories
                        </option>

                        <option value="general">
                            General
                        </option>

                        <option value="todo">
                            To-Do
                        </option>

                        <option value="shopping">
                            Shopping
                        </option>

                        <option value="contact">
                            Contact
                        </option>

                        <option value="important">
                            Important
                        </option>

                        <option value="idea">
                            Idea
                        </option>

                        <option value="work">
                            Work
                        </option>

                        <option value="personal">
                            Personal
                        </option>

                        <option value="travel">
                            Travel
                        </option>

                        <option value="study">
                            Study
                        </option>

                        <option value="reminder">
                            Reminder
                        </option>

                    </select>


                    <select
                        id="sort-notes"
                        class="app-input md:w-52"
                    >

                        <option value="newest">
                            Newest First
                        </option>

                        <option value="oldest">
                            Oldest First
                        </option>

                        <option value="priority">
                            Priority

            <!-- NOTE COUNT -->

            <div
                class="mb-4 flex items-center justify-between"
            >

                <div>

                    <h3 class="font-bold">
                        My Notes
                    </h3>

                    <p
                        id="note-count"
                        class="text-xs text-gray-500 dark:text-gray-400"
                    >
                        0 notes
                    </p>

                </div>

                <button
                    id="clear-completed"
                    type="button"
                    class="text-sm font-medium text-indigo-600 dark:text-indigo-400"
                >
                    Clear Completed
                </button>

            </div>


            <!-- NOTES -->

            <section
                id="notes-container"
                class="grid grid-cols-1 gap-4 md:grid-cols-2"
            >
            </section>


            <!-- EMPTY -->

            <section
                id="empty-notes"
                class="app-panel hidden rounded-2xl p-10 text-center"
            >

                <div
                    class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-gray-100 text-gray-400 dark:bg-gray-800"

                    <i class="fa-solid fa-book-open text-2xl"></i>

                </div>

                <h3 class="font-semibold">

    <!-- TOAST -->

    <div

    <!-- JAVASCRIPT -->

    <script type="module">

        import {
            getNotes,
            addNote,
            updateNote,
            deleteNote
        } from "./js/notes.js";

        import {
            initTheme,
            getTheme,
            setTheme
        } from "./js/theme.js";

        import {
            getLanguage,
            setLanguage,
            applyTranslations
        } from "./js/language.js";


        /* =====================================
           ELEMENTS
           ===================================== */

        const form =
            document.getElementById(
                "note-form"
            );

        const titleInput =
            document.getElementById(
                "note-title"
            );

        const categoryInput =
            document.getElementById(
                "note-category"
            );

        const priorityInput =
            document.getElementById(
                "note-priority"
            );

        const dateInput =
            document.getElementById(
                "note-date"
            );

        const reminderInput =
            document.getElementById(
                "note-reminder"
            );

        const contentInput =
            document.getElementById(
                "note-content"
            );

        const editIdInput =
            document.getElementById(
                "edit-note-id"
            );

        const notesContainer =
            document.getElementById(
                "notes-container"
            );

        const emptyNotes =
            document.getElementById(
                "empty-notes"
            );


        /* =====================================
           INIT
           ===================================== */

        initTheme();

        setToday();

        loadProfile();

        renderNotes();

        updateThemeIcon();

        updateLanguageButton();

        updateDateTime();

        setInterval(
            updateDateTime,
            1000
        );


        /* =====================================
           DATE
           ===================================== */

        function setToday() {

            if (!dateInput.value) {

                dateInput.value =
                    new Date()
                        .toISOString()
                        .split("T")[0];

            }

        }


        function updateDateTime() {

            document.getElementById(
                "current-date-time"
            ).textContent =
                new Date().toLocaleString(
                    getLanguage() === "ne"
                        ? "ne-NP"
                        : "en-US",
                    {
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

        }


        /* =====================================
           PROFILE
           ===================================== */

        function loadProfile() {

            const name =
                localStorage.getItem(
                    "profile_name"
                ) || "";

            const address =
                localStorage.getItem(
                    "profile_address"
                ) || "";

            const mobile =
                localStorage.getItem(
                    "profile_mobile"
                ) || "";

            const email =
                localStorage.getItem(
                    "profile_email"
                ) || "";

            const avatar =
                localStorage.getItem(
                    "profile_avatar"
                ) || "";


            document.getElementById(
                "input-full-name"
            ).value = name;

            document.getElementById(
                "input-address"
            ).value = address;

            document.getElementById(
                "input-mobile"
            ).value = mobile;

            document.getElementById(
                "input-email"
            ).value = email;

            document.getElementById(
                "sidebar-profile-name"
            ).textContent =
                name || "User";


            if (avatar) {

                const image =
                    document.getElementById(
                        "sidebar-avatar-image"
                    );

                const letter =
                    document.getElementById(
                        "sidebar-avatar-letter"
                    );

                image.src = avatar;

                image.classList.remove(
                    "hidden"
                );

                letter.classList.add(
                    "hidden"
                );

            } else {

                document.getElementById(
                    "sidebar-avatar-letter"
                ).textContent =
                    (
                        name
                        ? name.charAt(0)
                        : "U"
                    ).toUpperCase();

            }

        }


        function saveProfileField(
            id,
            key
        ) {

            document.getElementById(
                id
            ).addEventListener(
                "change",
                event => {

                    localStorage.setItem(
                        key,
                        event.target.value.trim()
                    );

                    if (
                        key ===
                        "profile_name"
                    ) {

                        document.getElementById(
                            "sidebar-profile-name"
                        ).textContent =
                            event.target.value.trim()
                            || "User";

                    }

                }
            );

        }


        saveProfileField(
            "input-full-name",
            "profile_name"
        );

        saveProfileField(
            "input-address",
            "profile_address"
        );

        saveProfileField(
            "input-mobile",
            "profile_mobile"
        );

        saveProfileField(
            "input-email",
            "profile_email"
        );


        /* =====================================
           ADD / UPDATE
           ===================================== */

        form.addEventListener(
            "submit",
            event => {

                event.preventDefault();


                if (
                    !titleInput.value.trim()
                ) {

                    showToast(
                        "Please enter a title."
                    );

                    titleInput.focus();

                    return;

                }


                const data = {

                    title:
                        titleInput.value.trim(),

                    content:
                        contentInput.value.trim(),

                    category:
                        categoryInput.value,

                    priority:
                        priorityInput.value,

                    date:
                        dateInput.value,

                    reminder:
                        reminderInput.value,

                    completed: false

                };


                const editId =
                    editIdInput.value;


                if (editId) {

                    updateNote(
                        editId,
                        data
                    );

                    showToast(
                        "Note updated successfully."
                    );

                } else {

                    addNote(data);

                    showToast(
                        "Note saved successfully."
                    );

                }


                resetForm();

                renderNotes();

            }
        );


        /* =====================================
           RESET
           ===================================== */

        function resetForm() {

            form.reset();

            editIdInput.value = "";

            document.getElementById(
                "form-title"
            ).textContent =
                "Add Note";

            document.getElementById(
                "save-button-text"
            ).textContent =
                "Save Note";

            document.getElementById(
                "cancel-edit"
            ).classList.add(
                "hidden"
            );

            setToday();

        }


        document.getElementById(
            "cancel-edit"
        ).addEventListener(
            "click",
            resetForm
        );


        /* =====================================
           RENDER
           ===================================== */

        function renderNotes() {

            let notes =
                getNotes();


            const search =
                document.getElementById(
                    "search-notes"
                ).value
                    .trim()
                    .toLowerCase();


            const category =
                document.getElementById(
                    "filter-category"
                ).value;


            const sort =
                document.getElementById(
                    "sort-notes"
                ).value;


            /* SEARCH */

            if (search) {

                notes =
                    notes.filter(
                        note => {

                            const title =
                                String(
                                    note.title || ""
                                ).toLowerCase();

                            const content =
                                String(
                                    note.content || ""
                                ).toLowerCase();

                            const categoryText =
                                String(
                                    note.category || ""
                                ).toLowerCase();

                            return (
                                title.includes(search)
                                ||
                                content.includes(search)
                                ||
                                categoryText.includes(search)
                            );

                        }
                    );

            }


            /* CATEGORY */

            if (category !== "all") {

                notes =
                    notes.filter(
                        note =>
                            note.category ===
                            category
                    );

            }


            /* SORT */

            notes.sort(
                (a, b) => {

                    if (
                        sort === "oldest"
                    ) {

                        return (
                            Number(
                                a.createdAt || 0
                            )
                            -
                            Number(
                                b.createdAt || 0
                            )
                        );

                    }


                    if (
                        sort === "title"
                    ) {

                        return String(
                            a.title || ""
                        ).localeCompare(
                            String(
                                b.title || ""
                            )
                        );

                    }


                    if (
                        sort === "priority"
                    ) {

                        const priority = {
                            urgent: 1,
                            important: 2,
                            normal: 3
                        };

                        return (
                            (
                                priority[
                                    a.priority
                                ] || 3
                            )
                            -
                            (
                                priority[
                                    b.priority
                                ] || 3
                            )
                        );

                    }


                    return (
                        Number(
                            b.createdAt || 0
                        )
                        -
                        Number(
                            a.createdAt || 0
                        )
                    );

                }
            );


            notesContainer.innerHTML = "";


            document.getElementById(
                "note-count"
            ).textContent =
                `${notes.length} note${notes.length === 1 ? "" : "s"}`;


            if (!notes.length) {

                emptyNotes.classList.remove(
                    "hidden"
                );

                return;

            }


            emptyNotes.classList.add(
                "hidden"
            );


            notes.forEach(
                note => {

                    notesContainer.appendChild(
                        createNoteCard(note)
                    );

                }
            );

        }


        /* =====================================
           NOTE CARD
           ===================================== */

        function createNoteCard(note) {

            const card =
                document.createElement(
                    "article"
                );


            const priorityClass =
                note.priority === "urgent"
                    ? "priority-urgent"
                    : note.priority === "important"
                        ? "priority-important"
                        : "priority-normal";


            card.className =
                `
                note-card
                app-panel
                ${priorityClass}
                rounded-2xl
                p-5
                shadow-sm
                ${note.completed ? "completed-note" : ""}
                `;


            const categoryInfo =
                getCategoryInfo(
                    note.category
                );


            const reminderText =
                note.reminder
                    ? formatReminder(
                        note.reminder
                    )
                    : "";


            card.innerHTML = `

                <div class="flex items-start justify-between gap-3">

                    <div class="flex min-w-0 items-start gap-3">

                        <button
                            type="button"
                            data-complete-id="${escapeAttribute(note.id)}"
                            class="complete-note mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 ${
                                note.completed
                                ? "border-green-500 bg-green-500 text-white"
                                : "border-gray-400 text-transparent"
                            }"
                            title="Complete"
                        >
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>


                        <div class="min-w-0">

                            <h3
                                class="note-title break-words text-lg font-bold"
                            >
                                ${escapeHTML(note.title)}
                            </h3>

                            <div class="mt-2 flex flex-wrap gap-2">

                                <span
                                    class="category-chip"
                                    style="background:${categoryInfo.bg};color:${categoryInfo.color}"
                                >
                                    <i class="${categoryInfo.icon}"></i>
                                    ${categoryInfo.name}
                                </span>

                                ${
                                    note.priority !== "normal"
                                    ?
                                    `
                                    <span class="category-chip bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200">
                                        <i class="fa-solid fa-flag"></i>
                                        ${escapeHTML(note.priority)}
                                    </span>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        </div>

                    </div>


                    <div class="flex shrink-0 gap-1">

                        <button
                            type="button"
                            data-edit-id="${escapeAttribute(note.id)}"
                            class="edit-note flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-100 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400"
                        >
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        <button
                            type="button"
                            data-delete-id="${escapeAttribute(note.id)}"
                            class="delete-note flex h-9 w-9 items-center justify-center rounded-lg bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>

                    </div>

                </div>


                ${
                    note.content
                    ?
                    `
                    <div
                        class="mt-4 whitespace-pre-wrap break-words text-sm leading-6 text-gray-600 dark:text-gray-300"
                    >
                        ${escapeHTML(note.content)}
                    </div>
                    `
                    :
                    ""
                }


                <div
                    class="mt-5 flex flex-wrap items-center gap-x-4 gap-y-2 border-t border-gray-100 pt-3 text-xs text-gray-500 dark:border-gray-700 dark:text-gray-400"
                >

                    <span>
                        <i class="fa-regular fa-calendar mr-1"></i>
                        ${escapeHTML(note.date || "-")}
                    </span>

                    ${
                        reminderText
                        ?
                        `
                        <span>
                            <i class="fa-regular fa-bell mr-1"></i>
                            ${escapeHTML(reminderText)}
                        </span>
                        `
                        :
                        ""
                    }

                </div>

            `;


            return card;

        }


        /* =====================================
           CATEGORY INFO
           ===================================== */

        function getCategoryInfo(
            category
        ) {

            const data = {

                general: {
                    name: "General",
                    icon: "fa-solid fa-note-sticky",
                    bg: "#e5e7eb",
                    color: "#374151"
                },

                todo: {
                    name: "To-Do",
                    icon: "fa-solid fa-check",
                    bg: "#dcfce7",
                    color: "#166534"
                },

                shopping: {
                    name: "Shopping",
                    icon: "fa-solid fa-cart-shopping",
                    bg: "#ffedd5",
                    color: "#c2410c"
                },

                contact: {
                    name: "Contact",
                    icon: "fa-solid fa-address-book",
                    bg: "#dbeafe",
                    color: "#1d4ed8"
                },

                important: {
                    name: "Important",
                    icon: "fa-solid fa-star",
                    bg: "#fef3c7",
                    color: "#a16207"
                },

                idea: {
                    name: "Idea",
                    icon: "fa-solid fa-lightbulb",
                    bg: "#fef9c3",
                    color: "#854d0e"
                },

                work: {
                    name: "Work",
                    icon: "fa-solid fa-briefcase",
                    bg: "#e0e7ff",
                    color: "#3730a3"
                },

                personal: {
                    name: "Personal",
                    icon: "fa-solid fa-user",
                    bg: "#fce7f3",
                    color: "#be185d"
                },

                travel: {
                    name: "Travel",
                    icon: "fa-solid fa-plane",
                    bg: "#cffafe",
                    color: "#0e7490"
                },

                study: {
                    name: "Study",
                    icon: "fa-solid fa-graduation-cap",
                    bg: "#ede9fe",
                    color: "#6d28d9"
                },

                reminder: {
                    name: "Reminder",
                    icon: "fa-solid fa-bell",
                    bg: "#fee2e2",
                    color: "#b91c1c"
                }

            };


            return (
                data[category]
                ||
                data.general
            );

        }


        /* =====================================
           QUICK CATEGORY
           ===================================== */

        document
            .querySelectorAll(
                ".quick-category"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            categoryInput.value =
                                button.dataset.quickCategory;

                            titleInput.focus();

                            window.scrollTo({
                                top: 0,
                                behavior: "smooth"
                            });

                        }
                    );

                }
            );


        /* =====================================
           EDIT / DELETE / COMPLETE
           ===================================== */

        document.addEventListener(
            "click",
            event => {


                const completeButton =
                    event.target.closest(
                        ".complete-note"
                    );


                if (completeButton) {

                    toggleComplete(
                        completeButton.dataset.completeId
                    );

                    return;

                }


                const editButton =
                    event.target.closest(
                        ".edit-note"
                    );


                if (editButton) {

                    editNote(
                        editButton.dataset.editId
                    );

                    return;

                }


                const deleteButton =
                    event.target.closest(
                        ".delete-note"
                    );


                if (deleteButton) {

                    removeNote(
                        deleteButton.dataset.deleteId
                    );

                }

            }
        );


        /* =====================================
           COMPLETE
           ===================================== */

        function toggleComplete(id) {

            const notes =
                getNotes();

            const note =
                notes.find(
                    item => item.id === id
                );


            if (!note) {
                return;
            }


            updateNote(
                id,
                {
                    completed:
                        !note.completed
                }
            );


            renderNotes();

        }


        /* =====================================
           EDIT
           ===================================== */

        function editNote(id) {

            const note =
                getNotes().find(
                    item => item.id === id
                );


            if (!note) {
                return;
            }


            editIdInput.value =
                note.id;

            titleInput.value =
                note.title || "";

            contentInput.value =
                note.content || "";

            categoryInput.value =
                note.category || "general";

            priorityInput.value =
                note.priority || "normal";

            dateInput.value =
                note.date || "";

            reminderInput.value =
                note.reminder || "";


            document.getElementById(
                "form-title"
            ).textContent =
                "Edit Note";


            document.getElementById(
                "save-button-text"
            ).textContent =
                "Update Note";


            document.getElementById(
                "cancel-edit"
            ).classList.remove(
                "hidden"
            );


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================
           DELETE
           ===================================== */

        function removeNote(id) {

            const confirmed =
                window.confirm(
                    "Delete this note?"
                );


            if (!confirmed) {
                return;
            }


            deleteNote(id);

            showToast(
                "Note deleted successfully."
            );

            renderNotes();

        }


        /* =====================================
           CLEAR COMPLETED
           ===================================== */

        document.getElementById(
            "clear-completed"
        ).addEventListener(
            "click",
            () => {

                const notes =
                    getNotes();

                const completed =
                    notes.filter(
                        note =>
                            note.completed
                    );


                if (!completed.length) {

                    showToast(
                        "No completed notes."
                    );

                    return;

                }


                const confirmed =
                    window.confirm(
                        "Delete all completed notes?"
                    );


                if (!confirmed) {
                    return;
                }


                completed.forEach(
                    note => {
                        deleteNote(
                            note.id
                        );
                    }
                );


                showToast(
                    "Completed notes cleared."
                );


                renderNotes();

            }
        );


        /* =====================================
           SEARCH / FILTER
           ===================================== */

        document.getElementById(
            "search-notes"
        ).addEventListener(
            "input",
            renderNotes
        );


        document.getElementById(
            "filter-category"
        ).addEventListener(
            "change",
            renderNotes
        );


        document.getElementById(
            "sort-notes"
        ).addEventListener(
            "change",
            renderNotes
        );


        /* =====================================
           PRIVACY
           ===================================== */

        let privacyMode =
            localStorage.getItem(
                "privacy_mode"
            ) === "true";


        document.getElementById(
            "privacy-toggle"
        ).addEventListener(
            "click",
            () => {

                privacyMode =
                    !privacyMode;

                localStorage.setItem(
                    "privacy_mode",
                    privacyMode
                );

                updatePrivacyIcon();

                renderNotes();

            }
        );


        function updatePrivacyIcon() {

            document.getElementById(
                "privacy-icon"
            ).className =
                privacyMode
                    ? "fa-solid fa-eye-slash"
                    : "fa-solid fa-eye";

        }


        updatePrivacyIcon();


        /* =====================================
           LANGUAGE
           ===================================== */

        document.getElementById(
            "language-toggle"
        ).addEventListener(
            "click",
            () => {

                const current =
                    getLanguage();

                const next =
                    current === "en"
                        ? "ne"
                        : "en";


                setLanguage(next);

                applyTranslations(next);

                updateLanguageButton();

                updateDateTime();

            }
        );


        function updateLanguageButton() {

            document.getElementById(
                "language-toggle"
            ).textContent =
                getLanguage() === "ne"
                    ? "ने"
                    : "EN";

        }


        /* =====================================
           THEME
           ===================================== */

        document.getElementById(
            "theme-toggle"
        ).addEventListener(
            "click",
            () => {

                const current =
                    getTheme();

                const next =
                    current === "dark"
                        ? "light"
                        : "dark";


                setTheme(next);

                updateThemeIcon();

            }
        );


        function updateThemeIcon() {

            document.getElementById(
                "theme-icon"
            ).className =
                getTheme() === "dark"
                    ? "fa-solid fa-sun"
                    : "fa-solid fa-moon";

        }


        /* =====================================
           MOBILE SIDEBAR
           ===================================== */

        document.getElementById(
            "menu-button"
        ).addEventListener(
            "click",
            () => {

                document
                    .getElementById(
                        "sidebar"
                    )
                    .classList.remove(
                        "-translate-x-full"
                    );

                document
                    .getElementById(
                        "sidebar-backdrop"
                    )
                    .classList.remove(
                        "hidden"
                    );

            }
        );


        document.getElementById(
            "sidebar-backdrop"
        ).addEventListener(
            "click",
            closeSidebar
        );


        function closeSidebar() {

            document
                .getElementById(
                    "sidebar"
                )
                .classList.add(
                    "-translate-x-full"
                );

            document
                .getElementById(
                    "sidebar-backdrop"
                )
                .classList.add(
                    "hidden"
                );

        }


        /* =====================================
           TOAST
           ===================================== */

        let toastTimer;


        function showToast(message) {

            const container =
                document.getElementById(
                    "toast-container"
                );

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;

            container.classList.remove(
                "hidden"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    () => {

                        container.classList.add(
                            "hidden"
                        );

                    },
                    2200
                );

        }


        /* =====================================
           REMINDER FORMAT
           ===================================== */

        function formatReminder(value) {

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                getLanguage() === "ne"
                    ? "ne-NP"
                    : "en-US",
                {
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* =====================================
           HTML SAFETY
           ===================================== */

        function escapeHTML(value) {

            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeAttribute(value) {

            return escapeHTML(value);

        }

    </script>

</body>

</html>
