    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <!-- Tailwind -->

    <!-- Font -->
    <link
        rel="preconnect"

    >

        href="https://fonts.gstatic.com"

    <link

    <style>

        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    rgba(79,70,229,0.16),
                    transparent 35%
                ),
                #020617;
            color: #e5e7eb;
        }

        .app-card {
            background: rgba(15,23,42,0.94);
            border: 1px solid rgba(148,163,184,0.18);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .input-box {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 16px;
        }

        .input-box:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 3px rgba(99,102,241,0.15);
        }

        .group-card {
            background: rgba(15,23,42,0.9);
            border: 1px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
        }

        .group-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            text-align: left;
        }

        .record-row {
            border-top: 1px solid #1e293b;
            padding: 14px 16px;
            background: rgba(2,6,23,0.5);
        }

        .record-row:hover {
            background: rgba(30,41,59,0.65);
        }

        .modal-backdrop {
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid #334155;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.6);
        }

        .toast {
            animation: toastIn 0.25s ease-out;
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           PDF
        ========================== */

        #pdf-content {
            position: fixed;
            left: -100000px;
            top: 0;
            width: 794px;
            min-height: 1123px;
            background: #ffffff;
            color: #172033;
            padding: 40px;
            z-index: -9999;
        }

        .pdf-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            width: 100%;
            padding-bottom: 14px;
            border-bottom: 3px solid #20a46b;
        }

        .pdf-user {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .pdf-avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #20a46b;
            flex-shrink: 0;
        }

        .pdf-user-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            line-height: 1.35;
        }

        .pdf-user-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .pdf-banner {
            width: 245px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .pdf-banner-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .pdf-title {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .pdf-title h1 {
            font-size: 25px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .pdf-title p {
            margin: 5px 0 0;
            font-size: 11px;
            color: #64748b;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }

        .pdf-table th {
            background: #f1f5f9;
            color: #334155;
            padding: 9px 7px;
            border-bottom: 1px solid #cbd5e1;
            text-align: left;
            font-weight: 700;
        }

        .pdf-table td {
            padding: 9px 7px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }

        .pdf-total {
            color: #16a34a;
            font-weight: 700;
        }

        .pdf-summary {
            margin-top: 20px;
            border-top: 2px solid #20a46b;
            padding-top: 14px;
        }

        .pdf-summary-row {
            display: flex;
            justify-content: space-between;
            width: 300px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .pdf-footer {
            margin-top: 35px;
            text-align: center;
            color: #94a3b8;
            font-size: 9px;
        }

    </style>

</head>


<body>

    <!-- =========================
         PAGE
    ========================== -->

    <main class="max-w-3xl mx-auto px-4 py-6 pb-12">

        <!-- Header -->

        <div class="flex items-center justify-between mb-6">

            <div>

                <h1 class="text-2xl font-bold text-white">
                    Add Income
                </h1>

                <p class="text-slate-400 text-sm mt-1">
                    Record and manage your income
                </p>

            </div>

            <a
                href="./index.html"
                class="w-11 h-11 rounded-xl bg-slate-800
                       flex items-center justify-center
                       text-slate-300"
            >
                <i class="fa-solid fa-xmark"></i>
            </a>

        </div>


        <!-- =========================
             ADD / EDIT FORM
        ========================== -->

        <section class="app-card rounded-2xl p-5">

            <div class="flex items-center justify-between mb-5">

                <div>

                    <h2
                        id="form-title"
                        class="text-lg font-semibold"
                    >
                        Add Income
                    </h2>

                    <p
                        id="form-subtitle"
                        class="text-sm text-slate-400 mt-1"
                    >
                        Add a new income record
                    </p>

                </div>

                <div
                    id="edit-badge"
                    class="hidden px-3 py-1 rounded-full
                           bg-indigo-500/15 text-indigo-300
                           text-xs font-medium"
                >
                    Editing
                </div>

            </div>


            <!-- Source -->

            <label class="block mb-2 font-medium text-slate-300">
                Source / Name
            </label>

            <input
                id="income-name"
                type="text"
                class="input-box mb-5"
                placeholder="e.g. Salary"
                autocomplete="off"
            >


            <!-- Date -->

            <label class="block mb-2 font-medium text-slate-300">
                Date
            </label>

            <input
                id="income-date"
                type="date"
                class="input-box mb-5"
            >


            <!-- NPR -->

            <label class="block mb-2 font-medium text-slate-300">
                NPR
            </label>

            <input
                id="income-npr"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                value="0"
                class="input-box mb-5"
                placeholder="0"
            >


            <!-- INR -->

            <label class="block mb-2 font-medium text-slate-300">
                INR
            </label>

            <input
                id="income-inr"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                value="0"
                class="input-box mb-5"
                placeholder="0"
            >


            <!-- Equivalent -->

            <div
                class="rounded-2xl p-4 mb-5
                       bg-indigo-500/10
                       border border-indigo-500/20
                       flex items-center justify-between"
            >

                <span class="text-slate-400">
                    NPR Equivalent
                </span>

                <strong
                    id="npr-equivalent"
                    class="text-indigo-300 text-lg"
                >
                    NPR 0
                </strong>

            </div>


            <!-- Note -->

            <label class="block mb-2 font-medium text-slate-300">
                Note
            </label>

            <textarea
                id="income-note"
                rows="3"
                class="input-box mb-5 resize-none"
                placeholder="Optional note..."
            ></textarea>


            <!-- Buttons -->

            <div class="grid grid-cols-2 gap-3">

                <button
                    id="cancel-edit"
                    type="button"
                    class="rounded-xl bg-slate-800
                           text-slate-200 font-semibold
                           py-3"
                >
                    Cancel
                </button>

                <button
                    id="save-income"
                    type="button"
                    class="rounded-xl bg-indigo-600
                           hover:bg-indigo-500
                           text-white font-semibold
                           py-3"
                >
                    <i class="fa-solid fa-check mr-2"></i>
                    <span id="save-button-text">
                        Save Income
                    </span>
                </button>

            </div>

        </section>


        <!-- =========================
             TOOLBAR
        ========================== -->

        <section class="mt-7">

            <div class="flex items-center justify-between gap-3">

                <div>

                    <h2 class="text-xl font-bold">
                        Income Records
                    </h2>

                    <p
                        id="income-count"
                        class="text-sm text-slate-400 mt-1"
                    >
                        0 records
                    </p>

                </div>

                <button
                    id="download-pdf"
                    type="button"
                    class="px-4 py-3 rounded-xl
                           bg-emerald-600
                           text-white font-semibold
                           text-sm"
                >
                    <i class="fa-solid fa-file-pdf mr-2"></i>
                    PDF
                </button>

            </div>

        </section>


        <!-- =========================
             GROUPED LIST
        ========================== -->

        <section
            id="income-list"
            class="mt-4 space-y-3"
        ></section>


        <!-- Empty -->

        <div
            id="empty-state"
            class="hidden app-card rounded-2xl
                   p-8 text-center mt-4"
        >

            <div
                class="w-16 h-16 mx-auto mb-4
                       rounded-2xl
                       bg-emerald-500/10
                       flex items-center justify-center"
            >
                <i
                    class="fa-solid fa-money-bill-trend-up
                           text-emerald-400 text-2xl"
                ></i>
            </div>

            <h3 class="font-semibold text-lg">
                No income records
            </h3>

            <p class="text-slate-400 text-sm mt-1">
                Add your first income record above.
            </p>

        </div>

    </main>


    <!-- =========================
         PDF CONTENT
    ========================== -->

    <div id="pdf-content"></div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast-container"
        class="fixed bottom-5 left-4 right-4
               z-[9999] flex justify-center
               pointer-events-none"
    ></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script type="module">

        import {
            getIncomes,
            addIncome,
            updateIncome,
            deleteIncome
        } from "./js/incomes.js";

        import {
            getProfileValue
        } from "./js/storage.js";

        import "./js/app.js";


        /* =========================================
           CONSTANTS
        ========================================== */

        const INR_RATE = 1.6;


        /* =========================================
           ELEMENTS
        ========================================== */

        const nameInput =
            document.getElementById(
                "income-name"
            );

        const dateInput =
            document.getElementById(
                "income-date"
            );

        const nprInput =
            document.getElementById(
                "income-npr"
            );

        const inrInput =
            document.getElementById(
                "income-inr"
            );

        const noteInput =
            document.getElementById(
                "income-note"
            );

        const equivalentEl =
            document.getElementById(
                "npr-equivalent"
            );

        const saveButton =
            document.getElementById(
                "save-income"
            );

        const saveButtonText =
            document.getElementById(
                "save-button-text"
            );

        const cancelButton =
            document.getElementById(
                "cancel-edit"
            );

        const formTitle =
            document.getElementById(
                "form-title"
            );

        const formSubtitle =
            document.getElementById(
                "form-subtitle"
            );

        const editBadge =
            document.getElementById(
                "edit-badge"
            );

        const incomeList =
            document.getElementById(
                "income-list"
            );

        const emptyState =
            document.getElementById(
                "empty-state"
            );

        const incomeCount =
            document.getElementById(
                "income-count"
            );

        const pdfButton =
            document.getElementById(
                "download-pdf"
            );


        /* =========================================
           STATE
        ========================================== */

        let editingId = null;

        const openedGroups =
            new Set();


        /* =========================================
           DATE
        ========================================== */

        function today() {

            return new Date()
                .toISOString()
                .split("T")[0];

        }


        dateInput.value =
            today();


        /* =========================================
           NUMBER FORMAT
        ========================================== */

        function money(value) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

        }


        /* =========================================
           NAME CORRECTION
        ========================================== */

        function cleanIncomeName(
            value
        ) {

            let name =
                String(
                    value || ""
                )
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );

            const key =
                name
                    .toLowerCase()
                    .replace(
                        /\s+/g,
                        ""
                    );

            /*
             * Salary spelling correction.
             *
             * Salary
             * salary
             * SalaRy
             * selary
             *
             * => Salary
             */

            if (
                key === "salary"
                ||
                key === "selary"
            ) {
                return "Salary";
            }

            return name;

        }


        /* =========================================
           GROUP KEY
        ========================================== */

        function getGroupKey(
            value
        ) {

            return cleanIncomeName(
                value
            )
            .toLowerCase()
            .replace(
                /\s+/g,
                " "
            );

        }


        /* =========================================
           GROUP INCOMES
        ========================================== */

        function groupIncomes(
            incomes
        ) {

            const groups = new Map();

            for (
                const item
                of incomes
            ) {

                const displayName =
                    cleanIncomeName(
                        item.sourceName
                    );

                const key =
                    getGroupKey(
                        displayName
                    );

                if (
                    !groups.has(key)
                ) {

                    groups.set(
                        key,
                        {
                            key,
                            name:
                                displayName,
                            records: []
                        }
                    );

                }

                groups
                    .get(key)
                    .records
                    .push(item);

            }

            return [
                ...groups.values()
            ];

        }


        /* =========================================
           CALCULATE TOTAL
        ========================================== */

        function getIncomeTotal(
            item
        ) {

            const npr =
                Number(
                    item.npr
                ) || 0;

            const inr =
                Number(
                    item.inr
                ) || 0;

            return (
                npr
                +
                (
                    inr
                    *
                    INR_RATE
                )
            );

        }


        /* =========================================
           UPDATE EQUIVALENT
        ========================================== */

        function updateEquivalent() {

            const npr =
                Number(
                    nprInput.value
                ) || 0;

            const inr =
                Number(
                    inrInput.value
                ) || 0;

            const total =
                npr
                +
                (
                    inr
                    *
                    INR_RATE
                );

            equivalentEl.textContent =
                `NPR ${money(total)}`;

        }


        nprInput.addEventListener(
            "input",
            updateEquivalent
        );

        inrInput.addEventListener(
            "input",
            updateEquivalent
        );


        /* =========================================
           TOAST
        ========================================== */

        function showToast(
            message,
            type = "success"
        ) {

            const container =
                document.getElementById(
                    "toast-container"
                );

            const toast =
                document.createElement(
                    "div"
                );

            const icon =
                type === "error"
                    ? "fa-circle-exclamation"
                    : "fa-circle-check";

            const bg =
                type === "error"
                    ? "bg-red-600"
                    : "bg-emerald-600";

            toast.className =
                `toast ${bg}
                 text-white px-5 py-3
                 rounded-xl shadow-xl
                 text-sm font-medium`;

            toast.innerHTML =
                `
                    <i class="fa-solid ${icon} mr-2"></i>
                    ${escapeHtml(message)}
                `;

            container.appendChild(
                toast
            );

            setTimeout(
                () => {
                    toast.remove();
                },
                2500
            );

        }


        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =========================================
           RESET FORM
        ========================================== */

        function resetForm() {

            editingId =
                null;

            nameInput.value =
                "";

            dateInput.value =
                today();

            nprInput.value =
                "0";

            inrInput.value =
                "0";

            noteInput.value =
                "";

            equivalentEl.textContent =
                "NPR 0";

            formTitle.textContent =
                "Add Income";

            formSubtitle.textContent =
                "Add a new income record";

            saveButtonText.textContent =
                "Save Income";

            editBadge.classList.add(
                "hidden"
            );

        }


        /* =========================================
           EDIT RECORD
        ========================================== */

        function startEdit(
            id
        ) {

            const incomes =
                getIncomes();

            const item =
                incomes.find(
                    income =>
                        income.id === id
                );

            if (!item) {
                return;
            }

            editingId =
                id;

            nameInput.value =
                cleanIncomeName(
                    item.sourceName
                );

            dateInput.value =
                item.date
                ||
                today();

            nprInput.value =
                Number(
                    item.npr
                ) || 0;

            inrInput.value =
                Number(
                    item.inr
                ) || 0;

            noteInput.value =
                item.note
                ||
                "";

            formTitle.textContent =
                "Edit Income";

            formSubtitle.textContent =
                "Correct this income record";

            saveButtonText.textContent =
                "Update Income";

            editBadge.classList.remove(
                "hidden"
            );

            updateEquivalent();

            window.scrollTo(
                {
                    top: 0,
                    behavior: "smooth"
                }
            );

        }


        /* =========================================
           SAVE
        ========================================== */

        saveButton.addEventListener(
            "click",
            () => {

                const rawName =
                    nameInput.value.trim();

                if (!rawName) {

                    showToast(
                        "Please enter income name.",
                        "error"
                    );

                    nameInput.focus();

                    return;
                }


                const sourceName =
                    cleanIncomeName(
                        rawName
                    );


                const date =
                    dateInput.value
                    ||
                    today();


                const npr =
                    Number(
                        nprInput.value
                    ) || 0;


                const inr =
                    Number(
                        inrInput.value
                    ) || 0;


                if (
                    npr <= 0
                    &&
                    inr <= 0
                ) {

                    showToast(
                        "Please enter NPR or INR amount.",
                        "error"
                    );

                    return;
                }


                const total =
                    npr
                    +
                    (
                        inr
                        *
                        INR_RATE
                    );


                const data = {

                    sourceName,

                    date,

                    npr,

                    inr,

                    total,

                    amount:
                        total,

                    category:
                        sourceName,

                    note:
                        noteInput.value
                        .trim()

                };


                if (
                    editingId
                ) {

                    updateIncome(
                        editingId,
                        data
                    );

                    showToast(
                        "Income updated successfully."
                    );

                } else {

                    addIncome(
                        data
                    );

                    showToast(
                        "Income saved successfully."
                    );

                }


                resetForm();

                renderIncomeList();

            }
        );


        /* =========================================
           CANCEL EDIT
        ========================================== */

        cancelButton.addEventListener(
            "click",
            () => {

                resetForm();

            }
        );


        /* =========================================
           RENDER LIST
        ========================================== */

        function renderIncomeList() {

            const incomes =
                getIncomes();

            incomeCount.textContent =
                `${incomes.length} record${
                    incomes.length === 1
                        ? ""
                        : "s"
                }`;


            if (
                incomes.length === 0
            ) {

                incomeList.innerHTML =
                    "";

                emptyState.classList.remove(
                    "hidden"
                );

                return;
            }


            emptyState.classList.add(
                "hidden"
            );


            const groups =
                groupIncomes(
                    incomes
                );


            incomeList.innerHTML =
                groups
                    .map(
                        group =>
                            renderGroup(
                                group
                            )
                    )
                    .join("");


            attachGroupEvents();

        }


        /* =========================================
           RENDER GROUP
        ========================================== */

        function renderGroup(
            group
        ) {

            const isOpen =
                openedGroups.has(
                    group.key
                );

            const records =
                group.records;


            const groupTotal =
                records.reduce(
                    (
                        sum,
                        item
                    ) => {

                        return (
                            sum
                            +
                            getIncomeTotal(
                                item
                            )
                        );

                    },
                    0
                );


            return `
                <div
                    class="group-card"
                    data-group="${escapeHtml(group.key)}"
                >

                    <button
                        type="button"
                        class="group-header"
                        data-toggle-group="${escapeHtml(group.key)}"
                    >

                        <div class="flex items-center gap-3">

                            <div
                                class="w-11 h-11
                                       rounded-xl
                                       bg-emerald-500/10
                                       flex items-center
                                       justify-center"
                            >
                                <i
                                    class="fa-solid fa-wallet
                                           text-emerald-400"
                                ></i>
                            </div>

                            <div>

                                <div
                                    class="font-semibold
                                           text-white"
                                >
                                    ${escapeHtml(group.name)}
                                </div>

                                <div
                                    class="text-xs
                                           text-slate-400
                                           mt-1"
                                >
                                    ${records.length}
                                    record${
                                        records.length === 1
                                            ? ""
                                            : "s"
                                    }
                                </div>

                            </div>

                        </div>


                        <div class="flex items-center gap-3">

                            <div
                                class="text-right"
                            >

                                <div
                                    class="text-sm
                                           font-semibold
                                           text-emerald-400"
                                >
                                    NPR ${money(groupTotal)}
                                </div>

                                <div
                                    class="text-xs
                                           text-slate-500"
                                >
                                    Total
                                </div>

                            </div>

                            <i
                                class="fa-solid ${
                                    isOpen
                                        ? "fa-chevron-up"
                                        : "fa-chevron-down"
                                } text-slate-400"
                            ></i>

                        </div>

                    </button>


                    ${
                        isOpen
                            ? `
                                <div>
                                    ${records
                                        .map(
                                            record =>
                                                renderRecord(
                                                    record
                                                )
                                        )
                                        .join("")}
                                </div>
                            `
                            : ""
                    }

                </div>
            `;

        }


        /* =========================================
           RENDER RECORD
        ========================================== */

        function renderRecord(
            item
        ) {

            const total =
                getIncomeTotal(
                    item
                );


            return `
                <div
                    class="record-row"
                >

                    <div
                        class="flex
                               items-start
                               justify-between
                               gap-3"
                    >

                        <div class="min-w-0">

                            <div
                                class="text-sm
                                       font-medium
                                       text-slate-200"
                            >
                                ${escapeHtml(
                                    item.date || "-"
                                )}
                            </div>

                            <div
                                class="text-xs
                                       text-slate-400
                                       mt-1"
                            >
                                NPR:
                                ${money(item.npr)}
                                &nbsp; • &nbsp;
                                INR:
                                ${money(item.inr)}
                            </div>

                            ${
                                item.note
                                    ? `
                                        <div
                                            class="text-xs
                                                   text-slate-500
                                                   mt-1
                                                   break-words"
                                        >
                                            ${escapeHtml(item.note)}
                                        </div>
                                    `
                                    : ""
                            }

                        </div>


                        <div class="text-right">

                            <div
                                class="font-semibold
                                       text-emerald-400
                                       whitespace-nowrap"
                            >
                                + NPR ${money(total)}
                            </div>

                            <div
                                class="flex
                                       items-center
                                       justify-end
                                       gap-2
                                       mt-2"
                            >

                                <button
                                    type="button"
                                    class="edit-record
                                           text-xs
                                           px-3 py-2
                                           rounded-lg
                                           bg-indigo-500/10
                                           text-indigo-300"
                                    data-id="${escapeHtml(item.id)}"
                                >
                                    <i
                                        class="fa-solid
                                               fa-pen mr-1"
                                    ></i>
                                    Edit
                                </button>

                                <button
                                    type="button"
                                    class="delete-record
                                           text-xs
                                           px-3 py-2
                                           rounded-lg
                                           bg-red-500/10
                                           text-red-300"
                                    data-id="${escapeHtml(item.id)}"
                                >
                                    <i
                                        class="fa-solid
                                               fa-trash mr-1"
                                    ></i>
                                    Delete
                                </button>

                            </div>

                        </div>

                    </div>

                </div>
            `;

        }


        /* =========================================
           GROUP EVENTS
        ========================================== */

        function attachGroupEvents() {

            document
                .querySelectorAll(
                    "[data-toggle-group]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const key =
                                    button.dataset
                                        .toggleGroup;

                                if (
                                    openedGroups.has(
                                        key
                                    )
                                ) {

                                    openedGroups.delete(
                                        key
                                    );

                                } else {

                                    openedGroups.add(
                                        key
                                    );

                                }

                                renderIncomeList();

                            }
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".edit-record"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                startEdit(
                                    button.dataset.id
                                );

                            }
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".delete-record"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                deleteRecord(
                                    button.dataset.id
                                );

                            }
                        );

                    }
                );

        }


        /* =========================================
           DELETE
        ========================================== */

        function deleteRecord(
            id
        ) {

            const incomes =
                getIncomes();

            const item =
                incomes.find(
                    income =>
                        income.id === id
                );

            if (!item) {
                return;
            }


            const confirmed =
                window.confirm(
                    `Delete "${cleanIncomeName(
                        item.sourceName
                    )}" income record?`
                );


            if (!confirmed) {
                return;
            }


            deleteIncome(
                id
            );


            if (
                editingId === id
            ) {

                resetForm();

            }


            showToast(
                "Income deleted."
            );


            renderIncomeList();

        }


        /* =========================================
           WAIT FOR IMAGES
        ========================================== */

        async function waitForImages(
            container
        ) {

            const images =
                container.querySelectorAll(
                    "img"
                );


            await Promise.all(

                [
                    ...images
                ].map(
                    img => {

                        if (
                            img.complete
                            &&
                            img.naturalWidth > 0
                        ) {

                            return Promise.resolve();

                        }


                        return new Promise(
                            resolve => {

                                img.onload =
                                    resolve;

                                img.onerror =
                                    resolve;

                            }
                        );

                    }
                )

            );

        }


        /* =========================================
           PROFILE DATA
        ========================================== */

        function getProfile() {

            return {

                name:
                    getProfileValue(
                        "profile_name",
                        "Digital Notebook User"
                    ),

                address:
                    getProfileValue(
                        "profile_address",
                        ""
                    ),

                mobile:
                    getProfileValue(
                        "profile_mobile",
                        ""
                    ),

                email:
                    getProfileValue(
                        "profile_email",
                        ""
                    ),

                avatar:
                    getProfileValue(
                        "profile_avatar",
                        ""
                    )

            };

        }


        /* =========================================
           PDF
        ========================================== */

        pdfButton.addEventListener(
            "click",
            generatePDF
        );


        async function generatePDF() {

            const incomes =
                getIncomes();


            if (
                incomes.length === 0
            ) {

                showToast(
                    "There are no income records for PDF.",
                    "error"
                );

                return;
            }


            pdfButton.disabled =
                true;

            pdfButton.innerHTML =
                `
                    <i class="fa-solid
                              fa-spinner
                              fa-spin mr-2"></i>
                    Preparing...
                `;


            try {

                const profile =
                    getProfile();


                const pdfContent =
                    document.getElementById(
                        "pdf-content"
                    );


                const bannerLogoUrl =
                    new URL(
                        "./assets/bannerlogo.png",
                        window.location.href
                    ).href;


                const avatarSrc =
                    profile.avatar
                    ||
                    new URL(
                        "./assets/N1024.png",
                        window.location.href
                    ).href;


                const totalNPR =
                    incomes.reduce(
                        (
                            total,
                            item
                        ) => {

                            return (
                                total
                                +
                                (
                                    Number(
                                        item.npr
                                    )
                                    ||
                                    0
                                )
                            );

                        },
                        0
                    );


                const totalINR =
                    incomes.reduce(
                        (
                            total,
                            item
                        ) => {

                            return (
                                total
                                +
                                (
                                    Number(
                                        item.inr
                                    )
                                    ||
                                    0
                                )
                            );

                        },
                        0
                    );


                const totalEquivalent =
                    totalNPR
                    +
                    (
                        totalINR
                        *
                        INR_RATE
                    );


                const rows =
                    incomes
                        .map(
                            item => {

                                const displayName =
                                    cleanIncomeName(
                                        item.sourceName
                                    );

                                const total =
                                    getIncomeTotal(
                                        item
                                    );

                                return `
                                    <tr>

                                        <td>
                                            ${escapeHtml(
                                                formatDate(
                                                    item.date
                                                )
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                displayName
                                            )}
                                        </td>

                                        <td>
                                            Income
                                        </td>

                                        <td>
                                            ${money(item.npr)}
                                        </td>

                                        <td>
                                            ${money(item.inr)}
                                        </td>

                                        <td
                                            class="pdf-total"
                                        >
                                            Rs ${money(total)}
                                        </td>

                                    </tr>
                                `;

                            }
                        )
                        .join("");


                pdfContent.innerHTML =
                    `
                        <div class="pdf-header">

                            <div class="pdf-user">

                                <img
                                    src="${escapeHtml(avatarSrc)}"
                                    class="pdf-avatar"
                                    crossorigin="anonymous"
                                    alt="User"
                                >

                                <div
                                    class="pdf-user-info"
                                >

                                    <div
                                        class="pdf-user-name"
                                    >
                                        ${escapeHtml(
                                            profile.name
                                        )}
                                    </div>

                                    ${
                                        profile.address
                                            ? `
                                                <div>
                                                    📍
                                                    ${escapeHtml(
                                                        profile.address
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }

                                    ${
                                        profile.mobile
                                            ? `
                                                <div>
                                                    📞
                                                    ${escapeHtml(
                                                        profile.mobile
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }

                                    ${
                                        profile.email
                                            ? `
                                                <div>
                                                    ✉️
                                                    ${escapeHtml(
                                                        profile.email
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }

                                </div>

                            </div>


                            <div
                                class="pdf-banner"
                            >

                                <img
                                    src="${escapeHtml(
                                        bannerLogoUrl
                                    )}"
                                    class="pdf-banner-image"
                                    crossorigin="anonymous"
                                    alt="Digital Notebook"
                                >

                            </div>

                        </div>


                        <div
                            class="pdf-title"
                        >

                            <h1>
                                INCOME REPORT
                            </h1>

                            <p>
                                Digital Notebook
                                •
                                Generated:
                                ${formatDate(
                                    today()
                                )}
                            </p>

                        </div>


                        <table
                            class="pdf-table"
                        >

                            <thead>

                                <tr>

                                    <th>
                                        Date
                                    </th>

                                    <th>
                                        Title
                                    </th>

                                    <th>
                                        Category
                                    </th>

                                    <th>
                                        NPR
                                    </th>

                                    <th>
                                        INR
                                    </th>

                                    <th>
                                        Total (NPR)
                                    </th>

                                </tr>

                            </thead>

                            <tbody>

                                ${rows}

                            </tbody>

                        </table>


                        <div
                            class="pdf-summary"
                        >

                            <div
                                class="pdf-summary-row"
                            >

                                <span>
                                    Total NPR:
                                </span>

                                <strong>
                                    NPR ${money(totalNPR)}
                                </strong>

                            </div>


                            <div
                                class="pdf-summary-row"
                            >

                                <span>
                                    Total INR:
                                </span>

                                <strong>
                                    INR ${money(totalINR)}
                                </strong>

                            </div>


                            <div
                                class="pdf-summary-row"
                            >

                                <span>
                                    Total NPR Equivalent:
                                </span>

                                <strong
                                    class="pdf-total"
                                >
                                    NPR ${money(
                                        totalEquivalent
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div
                            class="pdf-footer"
                        >
                            Digital Notebook
                        </div>
                    `;


                /*
                 * Wait until avatar and banner
                 * are actually loaded.
                 */

                await waitForImages(
                    pdfContent
                );


                /*
                 * Give browser a small moment
                 * to render images.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            300
                        )
                );


                const canvas =
                    await html2canvas(
                        pdfContent,
                        {
                            scale: 2,
                            useCORS: true,
                            allowTaint: false,
                            backgroundColor:
                                "#ffffff"
                        }
                    );


                const {
                    jsPDF
                } =
                    window.jspdf;


                const pdf =
                    new jsPDF(
                        {
                            orientation:
                                "portrait",
                            unit:
                                "mm",
                            format:
                                "a4"
                        }
                    );


                const pageWidth =
                    pdf.internal
                        .pageSize
                        .getWidth();


                const pageHeight =
                    pdf.internal
                        .pageSize
                        .getHeight();


                const imageWidth =
                    pageWidth;


                const imageHeight =
                    (
                        canvas.height
                        *
                        imageWidth
                    )
                    /
                    canvas.width;


                let heightLeft =
                    imageHeight;


                let position = 0;


                const imageData =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.95
                    );


                pdf.addImage(
                    imageData,
                    "JPEG",
                    0,
                    position,
                    imageWidth,
                    imageHeight
                );


                heightLeft -=
                    pageHeight;


                while (
                    heightLeft > 0
                ) {

                    position =
                        heightLeft
                        -
                        imageHeight;

                    pdf.addPage();

                    pdf.addImage(
                        imageData,
                        "JPEG",
                        0,
                        position,
                        imageWidth,
                        imageHeight
                    );

                    heightLeft -=
                        pageHeight;

                }


                pdf.save(
                    "Digital-Notebook-Income-Report.pdf"
                );


                showToast(
                    "Income PDF created successfully."
                );


            } catch (
                error
            ) {

                console.error(
                    "PDF error:",
                    error
                );

                showToast(
                    "PDF बनाउन समस्या भयो। फेरि प्रयास गर्नुहोस्।",
                    "error"
                );

            } finally {

                pdfButton.disabled =
                    false;

                pdfButton.innerHTML =
                    `
                        <i class="fa-solid
                                  fa-file-pdf mr-2"></i>
                        PDF
                    `;

            }

        }


        /* =========================================
           DATE FORMAT
        ========================================== */

        function formatDate(
            value
        ) {

            if (!value) {
                return "-";
            }


            const parts =
                String(
                    value
                ).split("-");


            if (
                parts.length === 3
            ) {

                return `
                    ${parts[2]}
                    ${monthName(parts[1])}
                    ${parts[0]}
                `;

            }


            return value;

        }


        function monthName(
            month
        ) {

            const months = [

                "Jan",
                "Feb",
                "Mar",
                "Apr",
                "May",
                "Jun",
                "Jul",
                "Aug",
                "Sep",
                "Oct",
                "Nov",
                "Dec"

            ];

            return (
                months[
                    Number(month) - 1
                ]
                ||
                month
            );

        }


        /* =========================================
           SERVICE WORKER
        ========================================== */

        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./sw.js"
                        )
                        .catch(
                            error => {

                                console.warn(
                                    "Service worker error:",
                                    error
                                );

                            }
                        );

                }
            );

        }


        /* =========================================
           INITIAL LOAD
        ========================================== */

        renderIncomeList();

        updateEquivalent();

    </script>

</body>

</html>
