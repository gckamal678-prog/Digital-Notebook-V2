<script type="module">

import {
    addIncome,
    getIncomes,
    deleteIncome
} from "./js/incomes.js";

import {
    initTheme,
    toggleTheme,
    getTheme
} from "./js/theme.js";

import {
    getLanguage,
    setLanguage
} from "./js/language.js";

import {
    getProfileValue
} from "./js/storage.js";

import "./js/app.js";


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "income-form"
    );

const sourceInput =
    document.getElementById(
        "income-source"
    );

const dateInput =
    document.getElementById(
        "income-date"
    );

const nprInput =
    document.getElementById(
        "income-npr"
    );

const inrInput =
    document.getElementById(
        "income-inr"
    );

const categoryInput =
    document.getElementById(
        "income-category"
    );

const noteInput =
    document.getElementById(
        "income-note"
    );

const totalPreview =
    document.getElementById(
        "total-preview"
    );

const incomeList =
    document.getElementById(
        "income-list"
    );

const incomeCount =
    document.getElementById(
        "income-count"
    );

const emptyState =
    document.getElementById(
        "empty-state"
    );

const searchInput =
    document.getElementById(
        "income-search"
    );

const clearSearch =
    document.getElementById(
        "clear-search"
    );


/* =========================
   DEFAULT DATE
========================= */

dateInput.value =
    new Date()
        .toISOString()
        .split("T")[0];


/* =========================
   FORMAT
========================= */

function formatNPR(
    value
) {
    return (
        "NPR "
        +
        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );
}


function formatINR(
    value
) {
    return (
        "₹"
        +
        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );
}


/* =========================
   TOTAL PREVIEW
========================= */

function updatePreview() {

    const npr =
        Number(
            nprInput.value
        ) || 0;

    const inr =
        Number(
            inrInput.value
        ) || 0;

    const total =
        npr
        +
        (
            inr * 1.6
        );

    totalPreview.textContent =
        formatNPR(total);
}


nprInput.addEventListener(
    "input",
    updatePreview
);

inrInput.addEventListener(
    "input",
    updatePreview
);


/* =========================
   TOAST
========================= */

function showToast(
    message,
    type = "success"
) {

    const toast =
        document.createElement(
            "div"
        );

    toast.className =
        `
        px-4
        py-3
        rounded-xl
        shadow-xl
        border
        bg-slate-900
        text-white
        text-sm
        flex
        items-center
        gap-3
        ${type === "success"
            ? "border-green-500/30"
            : "border-red-500/30"}
        `;

    toast.innerHTML =
        `
        <i class="fa-solid ${
            type === "success"
                ? "fa-circle-check text-green-400"
                : "fa-circle-exclamation text-red-400"
        }"></i>

        <span>${escapeHtml(message)}</span>
        `;

    document
        .getElementById(
            "toast-container"
        )
        .appendChild(toast);

    setTimeout(
        () => {
            toast.remove();
        },
        2500
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   SAVE INCOME
========================= */

form.addEventListener(
    "submit",
    (event) => {

        event.preventDefault();

        const source =
            sourceInput.value.trim();

        const npr =
            Number(
                nprInput.value
            ) || 0;

        const inr =
            Number(
                inrInput.value
            ) || 0;

        if (
            !source
        ) {

            showToast(
                "Please enter income source.",
                "error"
            );

            sourceInput.focus();

            return;
        }


        if (
            npr <= 0
            &&
            inr <= 0
        ) {

            showToast(
                "Please enter NPR or INR amount.",
                "error"
            );

            nprInput.focus();

            return;
        }


        const total =
            npr
            +
            (
                inr * 1.6
            );


        addIncome({

            sourceName:
                source,

            date:
                dateInput.value
                ||
                new Date()
                    .toISOString()
                    .split("T")[0],

            npr,

            inr,

            total,

            category:
                categoryInput.value.trim(),

            note:
                noteInput.value.trim()

        });


        showToast(
            "Income saved successfully."
        );


        form.reset();

        dateInput.value =
            new Date()
                .toISOString()
                .split("T")[0];

        updatePreview();

        renderIncomeList();

    }
);


/* =========================
   DELETE
========================= */

function removeIncome(
    id
) {

    const ok =
        confirm(
            "Delete this income record?"
        );

    if (!ok) {
        return;
    }

    deleteIncome(id);

    showToast(
        "Income deleted."
    );

    renderIncomeList();
}


/* =========================
   RENDER LIST
========================= */

function renderIncomeList() {

    const all =
        getIncomes();

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        all.filter(
            item => {

                const text =
                    `
                    ${item.sourceName || ""}
                    ${item.category || ""}
                    ${item.note || ""}
                    ${item.date || ""}
                    `
                    .toLowerCase();

                return text.includes(
                    query
                );
            }
        );


    incomeCount.textContent =
        `${filtered.length} record${
            filtered.length === 1
                ? ""
                : "s"
        }`;


    clearSearch.classList.toggle(
        "hidden",
        !query
    );


    if (
        filtered.length === 0
    ) {

        incomeList.innerHTML =
            "";

        emptyState.classList.remove(
            "hidden"
        );

        return;
    }


    emptyState.classList.add(
        "hidden"
    );


    incomeList.innerHTML =
        filtered
            .map(
                item => {

                    const npr =
                        Number(
                            item.npr
                        ) || 0;

                    const inr =
                        Number(
                            item.inr
                        ) || 0;

                    const total =
                        Number(
                            item.total
                            ??
                            item.amount
                        )
                        ||
                        (
                            npr
                            +
                            inr * 1.6
                        );


                    return `
                    <div
                        class="
                            income-row
                            bg-slate-800
                            border
                            border-slate-700
                            rounded-xl
                            p-4
                        "
                    >

                        <div
                            class="
                                flex
                                items-start
                                justify-between
                                gap-3
                            "
                        >

                            <div class="min-w-0">

                                <p
                                    class="
                                        font-semibold
                                        truncate
                                    "
                                >
                                    ${escapeHtml(
                                        item.sourceName
                                        ||
                                        item.source
                                        ||
                                        "Income"
                                    )}
                                </p>

                                <p
                                    class="
                                        text-xs
                                        text-slate-400
                                        mt-1
                                    "
                                >
                                    ${escapeHtml(
                                        item.date
                                        || ""
                                    )}
                                </p>

                            </div>


                            <button
                                type="button"
                                data-delete-id="${escapeHtml(
                                    item.id
                                )}"
                                class="
                                    w-9
                                    h-9
                                    rounded-lg
                                    bg-red-500/10
                                    text-red-400
                                    hover:bg-red-500/20
                                    shrink-0
                                "
                                title="Delete"
                            >
                                <i
                                    class="
                                        fa-solid
                                        fa-trash
                                    "
                                ></i>
                            </button>

                        </div>


                        <div
                            class="
                                grid
                                grid-cols-2
                                gap-3
                                mt-4
                            "
                        >

                            <div
                                class="
                                    rounded-lg
                                    bg-slate-900
                                    p-3
                                "
                            >

                                <p
                                    class="
                                        text-[11px]
                                        text-slate-500
                                    "
                                >
                                    NPR
                                </p>

                                <p
                                    class="
                                        text-sm
                                        font-semibold
                                        text-green-400
                                    "
                                >
                                    ${formatNPR(npr)}
                                </p>

                            </div>


                            <div
                                class="
                                    rounded-lg
                                    bg-slate-900
                                    p-3
                                "
                            >

                                <p
                                    class="
                                        text-[11px]
                                        text-slate-500
                                    "
                                >
                                    INR
                                </p>

                                <p
                                    class="
                                        text-sm
                                        font-semibold
                                        text-blue-400
                                    "
                                >
                                    ${formatINR(inr)}
                                </p>

                            </div>

                        </div>


                        <div
                            class="
                                mt-3
                                pt-3
                                border-t
                                border-slate-700
                                flex
                                items-center
                                justify-between
                                gap-3
                            "
                        >

                            <span
                                class="
                                    text-xs
                                    text-slate-400
                                "
                            >
                                Total
                            </span>

                            <span
                                class="
                                    font-bold
                                    text-green-400
                                "
                            >
                                ${formatNPR(total)}
                            </span>

                        </div>


                        ${
                            item.category
                                ? `
                                <p
                                    class="
                                        text-xs
                                        text-slate-400
                                        mt-3
                                    "
                                >
                                    <i
                                        class="
                                            fa-solid
                                            fa-tag
                                            mr-1
                                        "
                                    ></i>

                                    ${escapeHtml(
                                        item.category
                                    )}
                                </p>
                                `
                                : ""
                        }


                        ${
                            item.note
                                ? `
                                <p
                                    class="
                                        text-xs
                                        text-slate-400
                                        mt-2
                                    "
                                >
                                    ${escapeHtml(
                                        item.note
                                    )}
                                </p>
                                `
                                : ""
                        }

                    </div>
                    `;
                }
            )
            .join("");


    incomeList
        .querySelectorAll(
            "[data-delete-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeIncome(
                            button.dataset.deleteId
                        );

                    }
                );

            }
        );
}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    renderIncomeList
);


clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        renderIncomeList();

    }
);


/* =========================
   PROFILE
========================= */

function loadProfile() {

    const name =
        getProfileValue(
            "profile_name",
            "Guest User"
        );

    const avatar =
        getProfileValue(
            "profile_avatar",
            ""
        );


    document.getElementById(
        "sidebar-name"
    ).textContent =
        name || "Guest User";


    if (avatar) {

        const image =
            document.getElementById(
                "sidebar-avatar"
            );

        const icon =
            document.getElementById(
                "sidebar-avatar-icon"
            );

        image.src =
            avatar;

        image.classList.remove(
            "hidden"
        );

        icon.classList.add(
            "hidden"
        );
    }
}


/* =========================
   THEME
========================= */

function updateThemeIcon() {

    const icon =
        document.getElementById(
            "theme-icon"
        );

    const dark =
        getTheme() === "dark";

    icon.className =
        dark
            ? "fa-solid fa-moon w-5"
            : "fa-solid fa-sun w-5";
}


document
    .getElementById(
        "theme-btn"
    )
    .addEventListener(
        "click",
        () => {

            toggleTheme();

            updateThemeIcon();

        }
    );


/* =========================
   LANGUAGE
========================= */

function updateLanguageText() {

    const language =
        getLanguage();

    document.getElementById(
        "language-text"
    ).textContent =
        language === "ne"
            ? "नेपाली"
            : "English";
}


document
    .getElementById(
        "language-btn"
    )
    .addEventListener(
        "click",
        () => {

            const current =
                getLanguage();

            const next =
                current === "en"
                    ? "ne"
                    : "en";

            setLanguage(next);

            updateLanguageText();

        }
    );


/* =========================
   MOBILE SIDEBAR
========================= */

const sidebar =
    document.getElementById(
        "sidebar"
    );

const overlay =
    document.getElementById(
        "sidebar-overlay"
    );

const menuBtn =
    document.getElementById(
        "menu-btn"
    );


function openSidebar() {

    sidebar.classList.remove(
        "-translate-x-full"
    );

    overlay.classList.remove(
        "hidden"
    );
}


function closeSidebar() {

    sidebar.classList.add(
        "-translate-x-full"
    );

    overlay.classList.add(
        "hidden"
    );
}


menuBtn.addEventListener(
    "click",
    openSidebar
);

overlay.addEventListener(
    "click",
    closeSidebar
);


/* =========================
   INIT
========================= */

initTheme();

loadProfile();

updateThemeIcon();

updateLanguageText();

renderIncomeList();

updatePreview();

</script>

</body>
</html>
