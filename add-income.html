<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Digital NoteBook - Income</title>

    <link rel="icon" href="assets/N1024.png">

    <link rel="stylesheet" href="css/app.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="app-header">

        <div class="header-left">

            <a
                href="index.html"
                class="back-button"
                aria-label="Back"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="header-title-wrap">

                <h1>Income</h1>

                <p>Income records</p>

            </div>

        </div>


        <button
            type="button"
            id="header-avatar-button"
            class="avatar-button"
            aria-label="Profile"
        >

            <img
                id="header-avatar"
                src="assets/N1024.png"
                alt="User avatar"
            >

        </button>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="page-container">


        <!-- =================================================
             SUMMARY
        ================================================== -->

        <section class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    Total Income
                </div>

                <div
                    id="summary-total-income"
                    class="summary-value money-positive"
                >
                    NPR 0.00
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Records
                </div>

                <div
                    id="summary-record-count"
                    class="summary-value"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =================================================
             ADD INCOME CARD
        ================================================== -->

        <section class="app-card income-form-card">

            <div class="card-heading-row">

                <div>

                    <h2>
                        <i class="fa-solid fa-plus-circle"></i>
                        Add Income
                    </h2>

                </div>

                <div class="card-icon-badge">

                    <i class="fa-solid fa-file-invoice-dollar"></i>

                </div>

            </div>


            <form
                id="income-form"
                novalidate
            >

                <input
                    type="hidden"
                    id="edit-income-index"
                    value=""
                >


                <!-- SOURCE -->

                <div class="form-group">

                    <label
                        for="income-source-name"
                    >
                        Income Source
                    </label>

                    <input
                        type="text"
                        id="income-source-name"
                        placeholder="e.g. Salary"
                        autocomplete="off"
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label
                        for="income-date"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="income-date"
                    >

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label>
                        Amount
                    </label>


                    <div class="amount-grid">

                        <div>

                            <span class="field-small-label">
                                NPR
                            </span>

                            <input
                                type="number"
                                id="income-amount-npr"
                                inputmode="decimal"
                                step="0.01"
                                min="0"
                                placeholder="NPR"
                                autocomplete="off"
                            >

                        </div>


                        <div>

                            <span class="field-small-label">
                                INR
                            </span>

                            <input
                                type="number"
                                id="income-amount-inr"
                                inputmode="decimal"
                                step="0.01"
                                min="0"
                                placeholder="INR"
                                autocomplete="off"
                            >

                        </div>

                    </div>

                </div>


                <!-- LIVE TOTAL -->

                <div class="income-total-box">

                    <div class="income-total-top">

                        <div>

                            <span class="income-total-label">
                                Total
                            </span>

                            <div
                                id="income-live-total"
                                class="income-total-value"
                            >
                                NPR 0.00
                            </div>

                        </div>


                        <div class="income-rate-box">

                            <span>
                                Rate
                            </span>

                            <strong>
                                1 INR = 1.6 NPR
                            </strong>

                        </div>

                    </div>


                    <div
                        id="income-calculation-text"
                        class="income-calculation"
                    >
                        NPR 0 + INR 0 × 1.6 = NPR 0
                    </div>

                </div>


                <!-- FORM STATUS -->

                <div
                    id="income-form-status"
                    class="form-status"
                    aria-live="polite"
                ></div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="income-cancel-btn"
                        class="btn btn-secondary hidden"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        id="income-submit-btn"
                        class="btn btn-primary"
                    >
                        Save Income
                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             RECORDS
        ================================================== -->

        <section class="app-card">

            <div class="records-heading">

                <div>

                    <h2>
                        Income Records
                    </h2>

                </div>

                <span
                    id="income-group-count"
                    class="records-count"
                >
                    0 groups
                </span>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="search-income"
                    placeholder="Search income source"
                    autocomplete="off"
                >

            </div>


            <!-- SORT -->

            <div class="sort-row">

                <select
                    id="sort-income"
                >

                    <option value="date_desc">
                        Latest first
                    </option>

                    <option value="date_asc">
                        Oldest first
                    </option>

                    <option value="name">
                        Name A-Z
                    </option>

                    <option value="total_desc">
                        Highest total
                    </option>

                    <option value="total_asc">
                        Lowest total
                    </option>

                </select>


                <button
                    type="button"
                    id="pdf-button"
                    class="btn btn-outline"
                >
                    <i class="fa-solid fa-file-pdf"></i>
                    PDF
                </button>

            </div>


            <!-- LIST -->

            <div
                id="income-list-container"
                class="income-record-list"
            ></div>


            <!-- GRAND TOTAL -->

            <div class="grand-total-row">

                <span>
                    Grand Total
                </span>

                <strong
                    id="income-table-total"
                >
                    NPR 0.00
                </strong>

            </div>

        </section>

    </main>


    <!-- =====================================================
         PDF MODAL
    ====================================================== -->

    <div
        id="pdf-modal"
        class="modal-backdrop hidden"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>

                    <h2>
                        Income Report
                    </h2>

                    <p>
                        PDF Preview
                    </p>

                </div>


                <button
                    type="button"
                    id="close-pdf-button"
                    class="modal-close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <div
                id="pdf-preview-container"
                class="pdf-preview-container"
            ></div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="print-pdf-button"
                    class="btn btn-secondary"
                >
                    <i class="fa-solid fa-print"></i>
                    Print
                </button>


                <button
                    type="button"
                    id="download-pdf-button"
                    class="btn btn-primary"
                >
                    <i class="fa-solid fa-download"></i>
                    Download PDF
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         PAGE SCRIPT
    ====================================================== -->

    <script type="module">

        import {
            initApp
        } from "./js/app.js";

        import {
            getIncomes,
            getTotalIncome,
            calculateIncomeTotal,
            saveIncome,
            resetIncomeForm,
            editIncome,
            deleteIncome
        } from "./js/incomes.js";

        import {
            getProfileValue
        } from "./js/storage.js";


        /* =================================================
           ELEMENTS
        ================================================== */

        const form =
            document.getElementById(
                "income-form"
            );

        const sourceInput =
            document.getElementById(
                "income-source-name"
            );

        const dateInput =
            document.getElementById(
                "income-date"
            );

        const nprInput =
            document.getElementById(
                "income-amount-npr"
            );

        const inrInput =
            document.getElementById(
                "income-amount-inr"
            );

        const liveTotal =
            document.getElementById(
                "income-live-total"
            );

        const calculationText =
            document.getElementById(
                "income-calculation-text"
            );

        const statusBox =
            document.getElementById(
                "income-form-status"
            );

        const cancelButton =
            document.getElementById(
                "income-cancel-btn"
            );

        const submitButton =
            document.getElementById(
                "income-submit-btn"
            );

        const searchInput =
            document.getElementById(
                "search-income"
            );

        const sortInput =
            document.getElementById(
                "sort-income"
            );

        const listContainer =
            document.getElementById(
                "income-list-container"
            );

        const totalElement =
            document.getElementById(
                "income-table-total"
            );

        const groupCount =
            document.getElementById(
                "income-group-count"
            );

        const recordCount =
            document.getElementById(
                "summary-record-count"
            );

        const summaryTotal =
            document.getElementById(
                "summary-total-income"
            );


        /* =================================================
           DATE
        ================================================== */

        function getToday() {

            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    now.getDate()
                ).padStart(2, "0");

            return (
                year +
                "-" +
                month +
                "-" +
                day
            );
        }


        function setToday() {

            if (
                !dateInput.value
            ) {
                dateInput.value =
                    getToday();
            }
        }


        /* =================================================
           MONEY
        ================================================== */

        function money(
            value
        ) {

            const amount =
                Number(value) || 0;

            return (
                "NPR " +
                amount.toLocaleString(
                    "en-IN",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )
            );
        }


        /* =================================================
           LIVE TOTAL
        ================================================== */

        function updateLiveTotal() {

            const npr =
                Number(
                    nprInput.value
                ) || 0;

            const inr =
                Number(
                    inrInput.value
                ) || 0;

            const total =
                npr +
                (
                    inr * 1.6
                );


            liveTotal.textContent =
                money(total);


            calculationText.textContent =
                "NPR " +
                npr.toLocaleString(
                    "en-IN"
                ) +
                " + INR " +
                inr.toLocaleString(
                    "en-IN"
                ) +
                " × 1.6 = NPR " +
                total.toLocaleString(
                    "en-IN",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );


            /*
               Keep V2 module calculation
               in sync too.
            */

            calculateIncomeTotal();

        }


        /* =================================================
           PROFILE AVATAR
        ================================================== */

        function loadAvatar() {

            const avatar =
                getProfileValue(
                    "avatar",
                    ""
                );

            const headerAvatar =
                document.getElementById(
                    "header-avatar"
                );

            if (
                avatar &&
                headerAvatar
            ) {

                headerAvatar.src =
                    avatar;

            } else if (
                headerAvatar
            ) {

                headerAvatar.src =
                    "assets/N1024.png";

            }

        }


        /* =================================================
           PROFILE HEADER
        ================================================== */

        function loadProfileName() {

            const name =
                getProfileValue(
                    "name",
                    ""
                );

            const button =
                document.getElementById(
                    "header-avatar-button"
                );

            if (
                button &&
                name
            ) {

                button.title =
                    name;

            }

        }


        /* =================================================
           STATUS
        ================================================== */

        function showStatus(
            message,
            type = "success"
        ) {

            statusBox.textContent =
                message;

            statusBox.dataset.type =
                type;

            statusBox.classList.add(
                "show"
            );


            window.setTimeout(
                () => {

                    statusBox.classList.remove(
                        "show"
                    );

                },
                2500
            );

        }


        /* =================================================
           RENDER
        ================================================== */

        function renderIncomes() {

            let incomes =
                getIncomes();


            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            if (query) {

                incomes =
                    incomes.filter(
                        item =>
                            item.sourceName
                                .toLowerCase()
                                .includes(
                                    query
                                )
                    );

            }


            const sort =
                sortInput.value;


            if (
                sort ===
                "name"
            ) {

                incomes.sort(
                    (a, b) =>
                        a.sourceName
                            .localeCompare(
                                b.sourceName
                            )
                );

            } else if (
                sort ===
                "date_asc"
            ) {

                incomes.sort(
                    (a, b) =>
                        new Date(a.date) -
                        new Date(b.date)
                );

            } else if (
                sort ===
                "total_desc"
            ) {

                incomes.sort(
                    (a, b) =>
                        b.total -
                        a.total
                );

            } else if (
                sort ===
                "total_asc"
            ) {

                incomes.sort(
                    (a, b) =>
                        a.total -
                        b.total
                );

            } else {

                incomes.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );

            }


            /*
               Summary uses all records,
               not only search result.
            */

            const allIncomes =
                getIncomes();


            const grandTotal =
                getTotalIncome(
                    allIncomes
                );


            summaryTotal.textContent =
                money(
                    grandTotal
                );


            recordCount.textContent =
                allIncomes.length;


            totalElement.textContent =
                money(
                    grandTotal
                );


            /*
               Group by source
            */

            const groups =
                new Map();


            incomes.forEach(
                (income) => {

                    const key =
                        income.sourceName
                            .trim()
                            .toLowerCase();


                    if (
                        !groups.has(
                            key
                        )
                    ) {

                        groups.set(
                            key,
                            {
                                name:
                                    income.sourceName,
                                items: [],
                                total: 0
                            }
                        );

                    }


                    const group =
                        groups.get(
                            key
                        );


                    group.items.push(
                        income
                    );

                    group.total +=
                        Number(
                            income.total
                        ) || 0;

                }
            );


            groupCount.textContent =
                groups.size +
                (
                    groups.size === 1
                        ? " group"
                        : " groups"
                );


            if (
                groups.size === 0
            ) {

                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fa-solid fa-wallet"></i>
                        </div>

                        <strong>
                            No income records
                        </strong>

                        <span>
                            Add your first income above.
                        </span>
                    </div>
                `;

                return;

            }


            listContainer.innerHTML =
                "";


            let groupIndex = 0;


            groups.forEach(
                (group) => {

                    const wrapper =
                        document.createElement(
                            "div"
                        );

                    wrapper.className =
                        "income-group";


                    const header =
                        document.createElement(
                            "button"
                        );

                    header.type =
                        "button";

                    header.className =
                        "income-group-header";


                    header.innerHTML = `
                        <span class="income-group-left">

                            <span class="income-group-icon">
                                <i class="fa-solid fa-chevron-right"></i>
                            </span>

                            <span>

                                <strong>
                                    ${escapeHtml(group.name)}
                                </strong>

                                <small>
                                    ${group.items.length}
                                    ${group.items.length === 1 ? "record" : "records"}
                                </small>

                            </span>

                        </span>

                        <span class="income-group-total">
                            ${money(group.total)}
                        </span>
                    `;


                    const details =
                        document.createElement(
                            "div"
                        );

                    details.className =
                        "income-group-details hidden";


                    header.addEventListener(
                        "click",
                        () => {

                            details.classList.toggle(
                                "hidden"
                            );

                            const icon =
                                header.querySelector(
                                    ".income-group-icon i"
                                );

                            icon.classList.toggle(
                                "rotate-90"
                            );

                        }
                    );


                    group.items.forEach(
                        (income) => {

                            const row =
                                document.createElement(
                                    "div"
                                );

                            row.className =
                                "income-record-row";


                            row.innerHTML = `

                                <div class="income-record-main">

                                    <strong>
                                        ${formatDate(income.date)}
                                    </strong>

                                    <span>
                                        NPR ${formatNumber(income.npr)}
                                        &nbsp; | &nbsp;
                                        INR ${formatNumber(income.inr)}
                                    </span>

                                </div>


                                <div class="income-record-right">

                                    <strong>
                                        ${money(income.total)}
                                    </strong>

                                    <div class="income-record-actions">

                                        <button
                                            type="button"
                                            class="record-action edit"
                                            data-id="${escapeAttribute(income.id)}"
                                            title="Edit"
                                        >
                                            <i class="fa-solid fa-pen"></i>
                                        </button>


                                        <button
                                            type="button"
                                            class="record-action delete"
                                            data-id="${escapeAttribute(income.id)}"
                                            title="Delete"
                                        >
                                            <i class="fa-solid fa-trash"></i>
                                        </button>

                                    </div>

                                </div>
                            `;


                            const editButton =
                                row.querySelector(
                                    ".edit"
                                );


                            const deleteButton =
                                row.querySelector(
                                    ".delete"
                                );


                            editButton.addEventListener(
                                "click",
                                () => {

                                    const all =
                                        getIncomes();

                                    const index =
                                        all.findIndex(
                                            item =>
                                                String(
                                                    item.id
                                                ) ===
                                                String(
                                                    income.id
                                                )
                                        );

                                    if (
                                        index !== -1
                                    ) {

                                        editIncome(
                                            index
                                        );

                                        window.scrollTo({
                                            top: 0,
                                            behavior: "smooth"
                                        });

                                    }

                                }
                            );


                            deleteButton.addEventListener(
                                "click",
                                async () => {

                                    await deleteIncome(
                                        getIncomes()
                                            .findIndex(
                                                item =>
                                                    String(
                                                        item.id
                                                    ) ===
                                                    String(
                                                        income.id
                                                    )
                                            )
                                    );

                                    showStatus(
                                        "Income record deleted.",
                                        "success"
                                    );

                                    renderIncomes();

                                }
                            );


                            details.appendChild(
                                row
                            );

                        }
                    );


                    wrapper.appendChild(
                        header
                    );

                    wrapper.appendChild(
                        details
                    );

                    listContainer.appendChild(
                        wrapper
                    );

                    groupIndex++;

                }
            );

        }


        /* =================================================
           FORMAT
        ================================================== */

        function formatNumber(
            value
        ) {

            return (
                Number(value) || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

        }


        function formatDate(
            value
        ) {

            if (!value) {
                return "";
            }

            const date =
                new Date(
                    value +
                    "T00:00:00"
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return value;
            }

            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        function escapeHtml(
            value
        ) {

            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeAttribute(
            value
        ) {

            return escapeHtml(
                value
            );

        }


        /* =================================================
           EDIT MODE
        ================================================== */

        document.addEventListener(
            "incomeDataChanged",
            () => {

                renderIncomes();

            }
        );


        cancelButton.addEventListener(
            "click",
            () => {

                resetIncomeForm();

                submitButton.textContent =
                    "Save Income";

            }
        );


        /* =================================================
           FORM SUBMIT
        ================================================== */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                await saveIncome(
                    event
                );


                const editIndex =
                    document.getElementById(
                        "edit-income-index"
                    );


                if (
                    editIndex.value === ""
                ) {

                    showStatus(
                        "Income record saved.",
                        "success"
                    );

                }


                submitButton.textContent =
                    "Save Income";


                cancelButton.classList.add(
                    "hidden"
                );


                renderIncomes();

            }
        );


        /* =================================================
           LIVE INPUT
        ================================================== */

        nprInput.addEventListener(
            "input",
            updateLiveTotal
        );


        inrInput.addEventListener(
            "input",
            updateLiveTotal
        );


        /* =================================================
           SEARCH / SORT
        ================================================== */

        searchInput.addEventListener(
            "input",
            renderIncomes
        );


        sortInput.addEventListener(
            "change",
            renderIncomes
        );


        /* =================================================
           PDF PROFILE
        ================================================== */

        function getPdfProfile() {

            return {

                name:
                    getProfileValue(
                        "name",
                        "Digital NoteBook"
                    ),

                mobile:
                    getProfileValue(
                        "mobile",
                        ""
                    ),

                email:
                    getProfileValue(
                        "email",
                        ""
                    ),

                address:
                    getProfileValue(
                        "address",
                        ""
                    ),

                avatar:
                    getProfileValue(
                        "avatar",
                        ""
                    )

            };

        }


        /* =================================================
           PDF HTML
        ================================================== */

        function buildPdfHtml() {

            const incomes =
                getIncomes();


            const profile =
                getPdfProfile();


            const total =
                getTotalIncome(
                    incomes
                );


            const avatar =
                profile.avatar ||
                "assets/N1024.png";


            let rows =
                "";


            incomes.forEach(
                income => {

                    rows += `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    formatDate(
                                        income.date
                                    )
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    income.sourceName
                                )}
                            </td>

                            <td class="num">
                                ${formatNumber(
                                    income.npr
                                )}
                            </td>

                            <td class="num">
                                ${formatNumber(
                                    income.inr
                                )}
                            </td>

                            <td class="total">
                                ${money(
                                    income.total
                                )}
                            </td>

                        </tr>
                    `;

                }
            );


            return `

                <div
                    id="pdf-printable-content"
                    class="pdf-document"
                >

                    <!-- PERMANENT BANNER -->

                    <div class="pdf-banner">

                        <div class="pdf-banner-brand">
                            DIGITAL NOTEBOOK
                        </div>

                        <div class="pdf-banner-subtitle">
                            PERSONAL FINANCIAL RECORD
                        </div>

                    </div>


                    <!-- USER PROFILE -->

                    <div class="pdf-profile">

                        <div class="pdf-profile-avatar">

                            <img
                                src="${escapeAttribute(avatar)}"
                                alt="User"
                            >

                        </div>


                        <div class="pdf-profile-info">

                            <h1>
                                ${escapeHtml(
                                    profile.name
                                )}
                            </h1>

                            <p>
                                <strong>Mobile:</strong>
                                ${escapeHtml(
                                    profile.mobile ||
                                    "-"
                                )}
                            </p>

                            <p>
                                <strong>Email:</strong>
                                ${escapeHtml(
                                    profile.email ||
                                    "-"
                                )}
                            </p>

                            <p>
                                <strong>Address:</strong>
                                ${escapeHtml(
                                    profile.address ||
                                    "-"
                                )}
                            </p>

                        </div>

                    </div>


                    <!-- REPORT TITLE -->

                    <div class="pdf-report-title">

                        <h2>
                            INCOME REPORT
                        </h2>

                        <span>
                            Generated:
                            ${new Date().toLocaleDateString(
                                "en-IN"
                            )}
                        </span>

                    </div>


                    <!-- TABLE -->

                    <table class="pdf-table">

                        <thead>

                            <tr>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Source
                                </th>

                                <th>
                                    NPR
                                </th>

                                <th>
                                    INR
                                </th>

                                <th>
                                    Total NPR
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${rows}

                        </tbody>

                    </table>


                    <!-- GRAND TOTAL -->

                    <div class="pdf-grand-total">

                        <span>
                            GRAND TOTAL
                        </span>

                        <strong>
                            ${money(total)}
                        </strong>

                    </div>


                    <!-- FOOTER -->

                    <div class="pdf-footer">

                        Digital NoteBook
                        &nbsp; • &nbsp;
                        Income Report

                    </div>

                </div>
            `;

        }


        /* =================================================
           PDF CSS
        ================================================== */

        function injectPdfStyles() {

            if (
                document.getElementById(
                    "income-pdf-styles"
                )
            ) {
                return;
            }


            const style =
                document.createElement(
                    "style"
                );


            style.id =
                "income-pdf-styles";


            style.textContent = `

                .pdf-document {
                    width: 794px;
                    min-height: 1123px;
                    box-sizing: border-box;
                    padding: 34px;
                    background: #ffffff;
                    color: #1f2937;
                    font-family: Arial, sans-serif;
                }


                .pdf-banner {
                    background: #0f172a;
                    color: #ffffff;
                    padding: 18px 20px;
                    border-radius: 10px;
                    text-align: center;
                    border-bottom: 5px solid #10b981;
                }


                .pdf-banner-brand {
                    font-size: 22px;
                    font-weight: 800;
                    letter-spacing: 2px;
                }


                .pdf-banner-subtitle {
                    margin-top: 5px;
                    font-size: 9px;
                    letter-spacing: 2px;
                    color: #a7f3d0;
                }


                .pdf-profile {
                    display: flex;
                    align-items: center;
                    gap: 18px;
                    margin-top: 22px;
                    padding-bottom: 18px;
                    border-bottom: 1px solid #d1d5db;
                }


                .pdf-profile-avatar {
                    width: 78px;
                    height: 78px;
                    min-width: 78px;
                    border-radius: 50%;
                    overflow: hidden;
                    border: 3px solid #10b981;
                }


                .pdf-profile-avatar img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }


                .pdf-profile-info h1 {
                    margin: 0 0 7px;
                    font-size: 18px;
                    color: #111827;
                }


                .pdf-profile-info p {
                    margin: 3px 0;
                    font-size: 10px;
                    color: #4b5563;
                }


                .pdf-report-title {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin: 22px 0 12px;
                }


                .pdf-report-title h2 {
                    margin: 0;
                    font-size: 16px;
                    letter-spacing: 1px;
                    color: #111827;
                }


                .pdf-report-title span {
                    font-size: 9px;
                    color: #6b7280;
                }


                .pdf-table {
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 9px;
                }


                .pdf-table th {
                    background: #f3f4f6;
                    color: #374151;
                    font-weight: 700;
                    padding: 9px 7px;
                    border: 1px solid #d1d5db;
                    text-align: left;
                }


                .pdf-table td {
                    padding: 8px 7px;
                    border: 1px solid #e5e7eb;
                    color: #374151;
                }


                .pdf-table .num,
                .pdf-table .total {
                    text-align: right;
                }


                .pdf-table .total {
                    font-weight: 700;
                    color: #059669;
                }


                .pdf-grand-total {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-top: 20px;
                    padding: 14px 16px;
                    background: #ecfdf5;
                    border: 1px solid #a7f3d0;
                    border-radius: 8px;
                }


                .pdf-grand-total span {
                    font-size: 11px;
                    font-weight: 800;
                    color: #374151;
                }


                .pdf-grand-total strong {
                    font-size: 16px;
                    color: #059669;
                }


                .pdf-footer {
                    margin-top: 30px;
                    padding-top: 10px;
                    border-top: 1px solid #e5e7eb;
                    text-align: center;

                }

            `;


            document.head.appendChild(

            );

        }


        /* =================================================
           OPEN PDF
        ================================================== */

        function openPdf() {

            const incomes =
                getIncomes();


            if (
                incomes.length === 0
            ) {

                showStatus(
                    "Add an income record before creating PDF.",
                    "error"
                );

                return;

            }


            injectPdfStyles();


            document.getElementById(
                "pdf-preview-container"
            ).innerHTML =
                buildPdfHtml();


            document.getElementById(
                "pdf-modal"
            ).classList.remove(
                "hidden"
            );

        }


        /* =================================================
           CLOSE PDF
        ================================================== */

        function closePdf() {

            document.getElementById(
                "pdf-modal"
            ).classList.add(
                "hidden"
            );

        }


        /* =================================================
           DOWNLOAD PDF
        ================================================== */

        async function downloadPdf() {

            const element =
                document.getElementById(
                    "pdf-printable-content"
                );


            if (
                !element
            ) {
                return;
            }


            const profile =
                getPdfProfile();


            const fileName =
                (
                    profile.name ||
                    "Digital-NoteBook"
                )
                    .trim()
                    .replace(
                        /[^a-z0-9-_]+/gi,
                        "-"
                    );


            const options = {

                margin:
                    0,

                filename:
                    `${fileName}-Income-Report.pdf`,

                image: {
                    type: "jpeg",
                    quality: 0.98
                },

                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    backgroundColor:
                        "#ffffff"
                },

                jsPDF: {
                    unit: "mm",
                    format: "a4",
                    orientation: "portrait"
                }

            };


            await html2pdf()
                .set(options)
                .from(element)
                .save();

        }


        /* =================================================
           PRINT PDF
        ================================================== */

        function printPdf() {

            const element =
                document.getElementById(
                    "pdf-printable-content"
                );


            if (
                !element
            ) {
                return;
            }


            const printWindow =
                window.open(
                    "",
                    "_blank"
                );


            if (
                !printWindow
            ) {
                return;
            }


            printWindow.document.write(`
                <!DOCTYPE html>

                <html>

                <head>

                    <title>
                        Income Report
                    </title>

                    <style>

                        body {
                            margin: 0;
                            background: #fff;
                        }

                        @page {
                            size: A4;
                            margin: 0;
                        }

                    </style>

                </head>

                <body>

                    ${element.outerHTML}

                </body>

                </html>
            `);


            printWindow.document.close();


            printWindow.onload =
                () => {

                    printWindow.focus();

                    printWindow.print();

                };

        }


        /* =================================================
           PDF EVENTS
        ================================================== */

        document.getElementById(
            "pdf-button"
        ).addEventListener(
            "click",
            openPdf
        );


        document.getElementById(
            "close-pdf-button"
        ).addEventListener(
            "click",
            closePdf
        );


        document.getElementById(
            "download-pdf-button"
        ).addEventListener(
            "click",
            downloadPdf
        );


        document.getElementById(
            "print-pdf-button"
        ).addEventListener(
            "click",
            printPdf
        );


        document.getElementById(
            "pdf-modal"
        ).addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "pdf-modal"
                ) {

                    closePdf();

                }

            }
        );


        /* =================================================
           INIT
        ================================================== */

        async function startPage() {

            try {

                await initApp();

            } catch (error) {

                console.error(
                    "App initialization:",
                    error
                );

            }


            setToday();

            loadAvatar();

            loadProfileName();

            updateLiveTotal();

            renderIncomes();

        }


        startPage();


        /* =================================================
           GLOBAL COMPATIBILITY
        ================================================= */

        window.renderIncomes =
            renderIncomes;


        window.generateAndShareIncomePDF =
            openPdf;


        window.closePdfModal =
            closePdf;


        window.printFromModal =
            printPdf;

    </script>

</body>

</html>
