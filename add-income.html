<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Income - Digital Notebook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        href="./assets/N512.png"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
    ></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            background:
                #f8fafc;
            color:
                #0f172a;
        }

        html.dark body {
            background:
                #020617;
            color:
                #f8fafc;
        }

        .glass {
            background:
                rgba(255,255,255,.92);
            border:
                1px solid #e2e8f0;
        }

        html.dark .glass {
            background:
                rgba(15,23,42,.94);
            border-color:
                #1e293b;
        }

        .modal-bg {
            background:
                rgba(2,6,23,.78);
            backdrop-filter:
                blur(6px);
        }

        .income-group {
            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .income-group:active {
            transform:
                scale(.99);
        }

        .record-row {
            border-top:
                1px solid #e2e8f0;
        }

        html.dark .record-row {
            border-color:
                #1e293b;
        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <header
        class="sticky top-0 z-40
               bg-white/95 dark:bg-slate-950/95
               backdrop-blur
               border-b border-slate-200 dark:border-slate-800"
    >

        <div
            class="max-w-3xl mx-auto
                   px-4 py-3
                   flex items-center
                   justify-between"
        >

            <div
                class="flex items-center gap-3"
            >

                <a
                    href="./index.html"
                    class="w-10 h-10
                           rounded-xl
                           bg-slate-100
                           dark:bg-slate-800
                           flex items-center
                           justify-center"
                >
                    <i
                        class="fa-solid fa-arrow-left"
                    ></i>
                </a>

                <div>

                    <h1
                        class="font-bold text-lg"
                    >
                        Income
                    </h1>

                    <p
                        class="text-xs
                               text-slate-500
                               dark:text-slate-400"
                    >
                        Manage income records
                    </p>

                </div>

            </div>


            <button
                id="pdfButton"
                type="button"
                class="w-11 h-11
                       rounded-xl
                       bg-emerald-600
                       text-white
                       flex items-center
                       justify-center"
                title="Download PDF"
            >

                <i
                    class="fa-solid fa-file-pdf"
                ></i>

            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main
        class="max-w-3xl mx-auto
               px-4 py-5 pb-28"
    >


        <!-- SUMMARY -->

        <section
            class="grid grid-cols-2 gap-3 mb-5"
        >

            <div
                class="glass
                       rounded-2xl
                       p-4"
            >

                <p
                    class="text-sm
                           text-slate-500
                           dark:text-slate-400"
                >
                    Total NPR
                </p>

                <p
                    id="totalNpr"
                    class="text-xl
                           font-bold
                           text-emerald-600
                           mt-1"
                >
                    NPR 0
                </p>

            </div>


            <div
                class="glass
                       rounded-2xl
                       p-4"
            >

                <p
                    class="text-sm
                           text-slate-500
                           dark:text-slate-400"
                >
                    Total INR
                </p>

                <p
                    id="totalInr"
                    class="text-xl
                           font-bold
                           text-orange-500
                           mt-1"
                >
                    INR 0
                </p>

            </div>

        </section>


        <!-- TITLE -->

        <div
            class="flex items-center
                   justify-between mb-3"
        >

            <div>

                <h2
                    class="text-xl
                           font-bold"
                >
                    Income Records
                </h2>

                <p
                    id="recordCount"
                    class="text-sm
                           text-slate-500
                           dark:text-slate-400"
                >
                    0 records
                </p>

            </div>


            <button
                id="addButton"
                type="button"
                class="px-4 py-3
                       rounded-xl
                       bg-indigo-600
                       text-white
                       font-semibold
                       flex items-center
                       gap-2"
            >

                <i
                    class="fa-solid fa-plus"
                ></i>

                Add Income

            </button>

        </div>


        <!-- SEARCH -->

        <div
            class="glass
                   rounded-2xl
                   p-3 mb-4"
        >

            <div
                class="relative"
            >

                <i
                    class="fa-solid fa-magnifying-glass
                           absolute left-4 top-1/2
                           -translate-y-1/2
                           text-slate-400"
                ></i>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search income..."
                    class="w-full
                           rounded-xl
                           bg-slate-100
                           dark:bg-slate-800
                           px-11 py-3
                           outline-none"
                >

            </div>

        </div>


        <!-- GROUP LIST -->

        <section
            id="incomeGroups"
            class="space-y-3"
        ></section>


        <!-- EMPTY -->

        <div
            id="emptyState"
            class="hidden
                   text-center
                   py-16"
        >

            <div
                class="w-16 h-16
                       mx-auto mb-4
                       rounded-2xl
                       bg-emerald-100
                       dark:bg-emerald-950
                       text-emerald-600
                       flex items-center
                       justify-center
                       text-2xl"
            >

                <i
                    class="fa-solid fa-wallet"
                ></i>

            </div>

            <h3
                class="font-bold text-lg"
            >
                No income records
            </h3>

            <p
                class="text-sm
                       text-slate-500
                       mt-1"
            >
                Add your first income record.
            </p>

        </div>

    </main>


    <!-- ADD / EDIT MODAL -->

    <div
        id="incomeModal"
        class="hidden fixed inset-0 z-50
               modal-bg
               items-center justify-center
               p-4"
    >

        <div
            class="w-full max-w-lg
                   max-h-[92vh]
                   overflow-y-auto
                   rounded-3xl
                   bg-white
                   dark:bg-slate-900
                   border
                   border-slate-200
                   dark:border-slate-800
                   shadow-2xl"
        >


            <!-- MODAL HEADER -->

            <div
                class="sticky top-0 z-10
                       bg-white
                       dark:bg-slate-900
                       border-b
                       border-slate-200
                       dark:border-slate-800
                       px-5 py-4
                       flex items-center
                       justify-between"
            >

                <div>

                    <h2
                        id="modalTitle"
                        class="text-xl
                               font-bold"
                    >
                        Add Income
                    </h2>

                    <p
                        class="text-sm
                               text-slate-500"
                    >
                        Add a new income record
                    </p>

                </div>


                <button
                    id="closeModal"
                    type="button"
                    class="w-10 h-10
                           rounded-xl
                           bg-slate-100
                           dark:bg-slate-800
                           flex items-center
                           justify-center"
                >

                    <i
                        class="fa-solid fa-xmark"
                    ></i>

                </button>

            </div>


            <!-- FORM -->

            <form
                id="incomeForm"
                class="p-5 space-y-4"
            >

                <input
                    type="hidden"
                    id="editId"
                >


                <!-- NAME -->

                <div>

                    <label
                        class="block mb-2
                               font-medium"
                    >
                        Source / Name
                    </label>

                    <input
                        id="sourceName"
                        type="text"
                        required
                        autocomplete="off"
                        placeholder="e.g. Salary"
                        class="w-full
                               rounded-xl
                               border
                               border-slate-300
                               dark:border-slate-700
                               bg-white
                               dark:bg-slate-950
                               px-4 py-3
                               outline-none
                               focus:ring-2
                               focus:ring-indigo-500"
                    >

                </div>


                <!-- DATE -->

                <div>

                    <label
                        class="block mb-2
                               font-medium"
                    >
                        Date
                    </label>

                    <input
                        id="incomeDate"
                        type="date"
                        required
                        class="w-full
                               rounded-xl
                               border
                               border-slate-300
                               dark:border-slate-700
                               bg-white
                               dark:bg-slate-950
                               px-4 py-3
                               outline-none"
                    >

                </div>


                <!-- NPR -->

                <div>

                    <label
                        class="block mb-2
                               font-medium"
                    >
                        NPR
                    </label>

                    <input
                        id="nprAmount"
                        type="number"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0"
                        class="w-full
                               rounded-xl
                               border
                               border-slate-300
                               dark:border-slate-700
                               bg-white
                               dark:bg-slate-950
                               px-4 py-3
                               outline-none"
                    >

                </div>


                <!-- INR -->

                <div>

                    <label
                        class="block mb-2
                               font-medium"
                    >
                        INR
                    </label>

                    <input
                        id="inrAmount"
                        type="number"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0"
                        class="w-full
                               rounded-xl
                               border
                               border-slate-300
                               dark:border-slate-700
                               bg-white
                               dark:bg-slate-950
                               px-4 py-3
                               outline-none"
                    >

                </div>


                <!-- EQUIVALENT -->

                <div
                    class="rounded-2xl
                           bg-indigo-50
                           dark:bg-indigo-950/40
                           border
                           border-indigo-100
                           dark:border-indigo-900
                           p-4
                           flex items-center
                           justify-between"
                >

                    <span
                        class="text-slate-500
                               dark:text-slate-400"
                    >
                        NPR Equivalent
                    </span>

                    <strong
                        id="nprEquivalent"
                        class="text-xl
                               text-indigo-600
                               dark:text-indigo-300"
                    >
                        NPR 0
                    </strong>

                </div>


                <!-- NOTE -->

                <div>

                    <label
                        class="block mb-2
                               font-medium"
                    >
                        Note
                    </label>

                    <textarea
                        id="incomeNote"
                        rows="3"
                        placeholder="Optional note..."
                        class="w-full
                               rounded-xl
                               border
                               border-slate-300
                               dark:border-slate-700
                               bg-white
                               dark:bg-slate-950
                               px-4 py-3
                               outline-none
                               resize-none"
                    ></textarea>

                </div>


                <!-- BUTTONS -->

                <div
                    class="grid grid-cols-2
                           gap-3 pt-2"
                >

                    <button
                        id="cancelButton"
                        type="button"
                        class="rounded-xl
                               bg-slate-200
                               dark:bg-slate-800
                               py-3
                               font-semibold"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="rounded-xl
                               bg-indigo-600
                               text-white
                               py-3
                               font-semibold
                               flex items-center
                               justify-center
                               gap-2"
                    >

                        <i
                            class="fa-solid fa-check"
                        ></i>

                        <span
                            id="saveButtonText"
                        >
                            Save Income
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="hidden fixed
               left-1/2
               bottom-6
               -translate-x-1/2
               z-[70]
               px-5 py-3
               rounded-xl
               bg-slate-900
               text-white
               shadow-xl
               text-sm"
    ></div>


    <!-- FONT AWESOME -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"
    ></script>


    <!-- APP -->

    <script type="module">

        import {
            getIncomes,
            addIncome,
            updateIncome,
            deleteIncome
        } from "./js/incomes.js";

        import {
            getProfileValue
        } from "./js/storage.js";

        import {
            initTheme
        } from "./js/theme.js";


        /* =========================
           BASIC SETUP
        ========================= */

        initTheme();


        const INR_RATE = 1.6;


        let editingId = null;


        /* =========================
           ELEMENTS
        ========================= */

        const modal =
            document.getElementById(
                "incomeModal"
            );

        const form =
            document.getElementById(
                "incomeForm"
            );

        const sourceName =
            document.getElementById(
                "sourceName"
            );

        const incomeDate =
            document.getElementById(
                "incomeDate"
            );

        const nprAmount =
            document.getElementById(
                "nprAmount"
            );

        const inrAmount =
            document.getElementById(
                "inrAmount"
            );

        const incomeNote =
            document.getElementById(
                "incomeNote"
            );

        const editId =
            document.getElementById(
                "editId"
            );

        const groupsBox =
            document.getElementById(
                "incomeGroups"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        /* =========================
           FORMAT
        ========================= */

        function money(value) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

        }


        function today() {

            return new Date()
                .toISOString()
                .split("T")[0];

        }


        function escapeHTML(value) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =========================
           GROUP KEY
           
           Salary
           salary
           SALARY

           → same group

           selary
           → separate
        ========================= */

        function getGroupKey(name) {

            return String(
                name || ""
            )
                .trim()
                .toLocaleLowerCase();

        }


        function getDisplayName(
            records
        ) {

            const first =
                records[0];

            return (
                first?.sourceName
                ||
                first?.source
                ||
                "Unnamed"
            );

        }


        /* =========================
           OPEN MODAL
        ========================= */

        function openAddModal() {

            editingId = null;

            document.getElementById(
                "modalTitle"
            ).textContent =
                "Add Income";

            document.getElementById(
                "saveButtonText"
            ).textContent =
                "Save Income";

            form.reset();

            editId.value = "";

            incomeDate.value =
                today();

            document.getElementById(
                "nprEquivalent"
            ).textContent =
                "NPR 0";

            modal.classList.remove(
                "hidden"
            );

            modal.classList.add(
                "flex"
            );

            setTimeout(
                () => sourceName.focus(),
                100
            );

        }


        /* =========================
           EDIT MODAL
        ========================= */

        function openEditModal(
            id
        ) {

            const incomes =
                getIncomes();

            const record =
                incomes.find(
                    item =>
                        item.id === id
                );

            if (!record) {
                return;
            }

            editingId = id;

            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Income";

            document.getElementById(
                "saveButtonText"
            ).textContent =
                "Update Income";

            editId.value =
                record.id;

            sourceName.value =
                record.sourceName
                ||
                record.source
                ||
                "";

            incomeDate.value =
                record.date
                ||
                today();

            nprAmount.value =
                Number(
                    record.npr
                ) || 0;

            inrAmount.value =
                Number(
                    record.inr
                ) || 0;

            incomeNote.value =
                record.note
                ||
                "";

            updateEquivalent();

            modal.classList.remove(
                "hidden"
            );

            modal.classList.add(
                "flex"
            );

        }


        /* =========================
           CLOSE MODAL
        ========================= */

        function closeModal() {

            modal.classList.add(
                "hidden"
            );

            modal.classList.remove(
                "flex"
            );

            editingId = null;

        }


        /* =========================
           EQUIVALENT
        ========================= */

        function updateEquivalent() {

            const npr =
                Number(
                    nprAmount.value
                ) || 0;

            const inr =
                Number(
                    inrAmount.value
                ) || 0;

            const total =
                npr
                +
                (
                    inr
                    *
                    INR_RATE
                );

            document.getElementById(
                "nprEquivalent"
            ).textContent =
                `NPR ${money(total)}`;

        }


        nprAmount.addEventListener(
            "input",
            updateEquivalent
        );

        inrAmount.addEventListener(
            "input",
            updateEquivalent
        );


        /* =========================
           SAVE
        ========================= */

        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();

                const name =
                    sourceName.value.trim();

                if (!name) {

                    showToast(
                        "Source / Name राख्नुहोस्।"
                    );

                    sourceName.focus();

                    return;
                }


                const data = {

                    sourceName:
                        name,

                    date:
                        incomeDate.value
                        ||
                        today(),

                    npr:
                        Number(
                            nprAmount.value
                        ) || 0,

                    inr:
                        Number(
                            inrAmount.value
                        ) || 0,

                    note:
                        incomeNote.value
                        .trim()

                };


                if (editingId) {

                    updateIncome(
                        editingId,
                        data
                    );

                    showToast(
                        "Income updated."
                    );

                } else {

                    addIncome(
                        data
                    );

                    showToast(
                        "Income saved."
                    );

                }


                closeModal();

                render();

            }
        );


        /* =========================
           DELETE
        ========================= */

        window.deleteIncomeRecord =
            function(id) {

                const ok =
                    confirm(
                        "यो income record delete गर्ने?"
                    );

                if (!ok) {
                    return;
                }

                deleteIncome(id);

                showToast(
                    "Income deleted."
                );

                render();

            };


        /* =========================
           EDIT
        ========================= */

        window.editIncomeRecord =
            function(id) {

                openEditModal(id);

            };


        /* =========================
           TOGGLE GROUP
        ========================= */

        window.toggleIncomeGroup =
            function(key) {

                const box =
                    document.querySelector(
                        `[data-group="${CSS.escape(key)}"]`
                    );

                if (!box) {
                    return;
                }

                box.classList.toggle(
                    "hidden"
                );

                const icon =
                    document.querySelector(
                        `[data-arrow="${CSS.escape(key)}"]`
                    );

                if (icon) {

                    icon.classList.toggle(
                        "rotate-180"
                    );

                }

            };


        /* =========================
           RENDER
        ========================= */

        function render() {

            const all =
                getIncomes();

            const search =
                searchInput.value
                    .trim()
                    .toLocaleLowerCase();


            const filtered =
                search
                    ? all.filter(
                        item =>
                            String(
                                item.sourceName
                                ||
                                item.source
                                ||
                                ""
                            )
                            .toLocaleLowerCase()
                            .includes(
                                search
                            )
                    )
                    : all;


            updateSummary(all);


            document.getElementById(
                "recordCount"
            ).textContent =
                `${all.length} ${
                    all.length === 1
                        ? "record"
                        : "records"
                }`;


            if (!filtered.length) {

                groupsBox.innerHTML =
                    "";

                emptyState.classList.remove(
                    "hidden"
                );

                return;

            }


            emptyState.classList.add(
                "hidden"
            );


            const grouped =
                new Map();


            for (
                const item
                of filtered
            ) {

                const name =
                    item.sourceName
                    ||
                    item.source
                    ||
                    "Unnamed";

                const key =
                    getGroupKey(name);


                if (!grouped.has(key)) {

                    grouped.set(
                        key,
                        []
                    );

                }


                grouped
                    .get(key)
                    .push(item);

            }


            let html = "";


            for (
                const [
                    key,
                    records
                ]
                of grouped
            ) {

                const displayName =
                    getDisplayName(
                        records
                    );


                const groupTotal =
                    records.reduce(
                        (
                            sum,
                            item
                        ) =>
                            sum
                            +
                            (
                                Number(
                                    item.total
                                    ??
                                    item.amount
                                )
                                ||
                                0
                            ),
                        0
                    );


                const safeKey =
                    encodeURIComponent(
                        key
                    );


                html += `

                    <div
                        class="
                            income-group
                            glass
                            rounded-2xl
                            overflow-hidden
                        "
                    >

                        <button
                            type="button"
                            onclick="
                                toggleIncomeGroup(
                                    '${escapeHTML(key)}'
                                )
                            "
                            class="
                                w-full
                                px-4 py-4
                                flex items-center
                                justify-between
                                text-left
                            "
                        >

                            <div
                                class="
                                    flex items-center
                                    gap-3
                                    min-w-0
                                "
                            >

                                <div
                                    class="
                                        w-11 h-11
                                        rounded-xl
                                        bg-emerald-100
                                        dark:bg-emerald-950
                                        text-emerald-600
                                        flex items-center
                                        justify-center
                                        flex-shrink-0
                                    "
                                >

                                    <i
                                        class="
                                            fa-solid
                                            fa-money-bill-wave
                                        "
                                    ></i>

                                </div>


                                <div
                                    class="min-w-0"
                                >

                                    <h3
                                        class="
                                            font-bold
                                            truncate
                                        "
                                    >
                                        ${escapeHTML(
                                            displayName
                                        )}
                                    </h3>

                                    <p
                                        class="
                                            text-xs
                                            text-slate-500
                                            dark:text-slate-400
                                        "
                                    >
                                        ${
                                            records.length
                                        }
                                        ${
                                            records.length === 1
                                                ? "record"
                                                : "records"
                                        }
                                        · NPR
                                        ${money(
                                            groupTotal
                                        )}
                                    </p>

                                </div>

                            </div>


                            <i
                                data-arrow="${escapeHTML(key)}"
                                class="
                                    fa-solid

                                    transition-transform
                                "
                            ></i>

                        </button>


                        <div

                for (

                                "

                                >

                                            dark:text-slate-400

                                            || ""
                                        )}
                                    </p>


                                    ${
                                        record.note
                                            ? `
                                                <p
                                                    class="

                                                        text-slate-500
                                                        dark:text-slate-400

                                                    "

                                              `

                                </div>


                                <div
                                    class="

                                        flex-shrink-0

                                    <p

                                        "

                                        NPR
                                        ${money(
                                            total
                                        )}
                                    </p>

                                    ${
                                        Number(

                                        ) > 0
                                            ? `
                                                <p
                                                    class="
                                                        text-xs
                                                        text-orange-500
                                                        mt-1

                                                    INR
                                                    ${money(

                                                    )}

                            <div

                                        editIncomeRecord(

                                                record.id
                                            )}'

                                    "

                                        px-3 py-2
                                        rounded-lg
                                        bg-indigo-50
                                        dark:bg-indigo-950
                                        text-indigo-600
                                        dark:text-indigo-300
                                        text-sm
                                        font-medium

                                    onclick="
                                        deleteIncomeRecord(

                                                record.id
                                            )}'
                                        )
                                    "
                                    class="
                                        px-3 py-2
                                        rounded-lg
                                        bg-red-50
                                        dark:bg-red-950
                                        text-red-600

        /* =========================
           SUMMARY
        ========================= */

        function updateSummary(
            incomes
        ) {

            let totalNpr = 0;

            let totalInr = 0;


            for (
                const item
                of incomes
            ) {

                totalNpr +=
                    Number(
                        item.npr
                    ) || 0;

                totalInr +=
                    Number(
                        item.inr
                    ) || 0;

            }


            document.getElementById(
                "totalNpr"
            ).textContent =
                `NPR ${money(totalNpr)}`;


            document.getElementById(
                "totalInr"
            ).textContent =
                `INR ${money(totalInr)}`;

        }


        /* =========================
           PDF
        ========================= */

        async function downloadPDF() {

            const incomes =
                getIncomes();


            if (!incomes.length) {

                showToast(
                    "PDF बनाउन income record छैन।"
                );

                return;

            }


            const {
                jsPDF
            } = window.jspdf;


            const doc =
                new jsPDF({
                    orientation:
                        "portrait",
                    unit:
                        "mm",
                    format:
                        "a4"
                });


            const pageWidth =
                doc.internal.pageSize
                    .getWidth();


            const pageHeight =
                doc.internal.pageSize
                    .getHeight();


            /*
             * HEADER
             */

            const avatar =
                getProfileValue(
                    "profile_avatar",
                    ""
                );


            const name =
                getProfileValue(
                    "profile_name",
                    "Digital Notebook User"
                );


            const address =
                getProfileValue(
                    "profile_address",
                    ""
                );


            const mobile =
                getProfileValue(
                    "profile_mobile",
                    ""
                );


            const email =
                getProfileValue(
                    "profile_email",
                    ""
                );


            /*
             * TOP GREEN LINE
             */

            doc.setDrawColor(
                22,
                163,
                74
            );

            doc.setLineWidth(
                0.8
            );

            doc.line(
                14,
                46,
                pageWidth - 14,
                46
            );


            /*
             * AVATAR
             */

            if (avatar) {

                try {

                    doc.addImage(
                        avatar,
                        "JPEG",
                        14,
                        10,
                        28,
                        28
                    );

                } catch {

                    try {

                        doc.addImage(
                            avatar,
                            "PNG",
                            14,
                            10,
                            28,
                            28
                        );

                    } catch {

                        // Ignore avatar error

                    }

                }

            }


            /*
             * USER NAME
             */

            doc.setTextColor(
                15,
                23,
                42
            );

            doc.setFontSize(
                11
            );

            doc.setFont(
                "helvetica",
                "bold"
            );

            doc.text(
                String(name || ""),
                14,
                43
            );


            /*
             * BANNER
             */

            const bannerUrl =
                "./assets/bannerlogo.png";


            try {

                const banner =
                    await loadImage(
                        bannerUrl
                    );


                const bannerWidth =
                    76;

                const bannerHeight =
                    banner.height
                    ?
                    bannerWidth
                    *
                    (
                        banner.height
                        /
                        banner.width
                    )
                    :
                    25;


                doc.addImage(
                    banner,
                    "PNG",
                    48,
                    13,
                    bannerWidth,
                    Math.min(
                        bannerHeight,
                        28
                    )
                );

            } catch {

                // Banner unavailable

            }


            /*
             * USER DETAILS
             */

            let infoY = 17;


            doc.setFont(
                "helvetica",
                "normal"
            );

            doc.setFontSize(
                9
            );

            doc.setTextColor(
                75,
                85,
                99
            );


            if (address) {

                doc.text(
                    `Address: ${address}`,
                    132,
                    infoY
                );

                infoY += 6;

            }


            if (mobile) {

                doc.text(
                    `Contact: ${mobile}`,
                    132,
                    infoY
                );

                infoY += 6;

            }


            if (email) {

                doc.text(
                    `Email: ${email}`,
                    132,
                    infoY
                );

            }


            /*
             * TITLE
             */

            doc.setTextColor(
                15,
                23,
                42
            );

            doc.setFont(
                "helvetica",
                "bold"
            );

            doc.setFontSize(
                18
            );

            doc.text(
                "INCOME REPORT",
                pageWidth / 2,
                58,
                {
                    align:
                        "center"
                }
            );


            /*
             * DATE
             */

            doc.setFont(
                "helvetica",
                "normal"
            );

            doc.setFontSize(
                8
            );

            doc.setTextColor(
                100,
                116,
                139
            );

            doc.text(
                `Generated: ${new Date().toLocaleDateString(
                    "en-GB"
                )}`,
                pageWidth / 2,
                64,
                {
                    align:
                        "center"
                }
            );


            /*
             * TABLE DATA
             */

            const rows =
                incomes.map(
                    item => {

                        const npr =
                            Number(
                                item.npr
                            ) || 0;

                        const inr =
                            Number(
                                item.inr
                            ) || 0;

                        const total =
                            Number(
                                item.total
                                ??
                                item.amount
                            )
                            ||
                            (
                                npr
                                +
                                (
                                    inr
                                    *
                                    INR_RATE
                                )
                            );


                        return [

                            formatPDFDate(
                                item.date
                            ),

                            String(
                                item.sourceName
                                ||
                                item.source
                                ||
                                ""
                            ),

                            String(
                                item.category
                                ||
                                "Income"
                            ),

                            money(
                                npr
                            ),

                            money(
                                inr
                            ),

                            `Rs ${money(
                                total
                            )}`

                        ];

                    }
                );


            /*
             * TABLE
             */

            doc.autoTable({

                startY:
                    70,

                head: [[

                    "Date",
                    "Title",
                    "Category",
                    "NPR",
                    "INR",
                    "Total (NPR)"

                ]],

                body:
                    rows,

                theme:
                    "grid",

                styles: {

                    font:
                        "helvetica",

                    fontSize:
                        8,

                    cellPadding:
                        3,

                    textColor:
                        [30, 41, 59],

                    lineColor:
                        [210, 214, 220],

                    lineWidth:
                        0.2

                },

                headStyles: {

                    fillColor:
                        [20, 184, 166],

                    textColor:
                        [255, 255, 255],

                    fontStyle:
                        "bold"

                },

                columnStyles: {

                    0: {
                        cellWidth:
                            26
                    },

                    1: {
                        cellWidth:
                            40
                    },

                    2: {
                        cellWidth:
                            30
                    },

                    3: {
                        cellWidth:
                            25,
                        halign:
                            "right"
                    },

                    4: {
                        cellWidth:
                            25,
                        halign:
                            "right"
                    },

                    5: {
                        cellWidth:
                            32,
                        halign:
                            "right"
                    }

                },

                margin: {

                    left:
                        14,

                    right:
                        14

                }

            });


            /*
             * TOTALS
             */

            let totalNpr = 0;

            let totalInr = 0;

            let totalEquivalent = 0;


            for (
                const item
                of incomes
            ) {

                const npr =
                    Number(
                        item.npr
                    ) || 0;

                const inr =
                    Number(
                        item.inr
                    ) || 0;

                const total =
                    Number(
                        item.total
                        ??
                        item.amount
                    )
                    ||
                    (
                        npr
                        +
                        (
                            inr
                            *
                            INR_RATE
                        )
                    );


                totalNpr +=
                    npr;

                totalInr +=
                    inr;

                totalEquivalent +=
                    total;

            }


            let y =
                doc.lastAutoTable.finalY
                +
                10;


            if (
                y >
                pageHeight - 45
            ) {

                doc.addPage();

                y = 20;

            }


            doc.setFont(
                "helvetica",
                "bold"
            );

            doc.setFontSize(
                10
            );

            doc.setTextColor(
                15,
                23,
                42
            );


            doc.text(
                `Total NPR: ${money(
                    totalNpr
                )}`,
                18,
                y
            );


            y += 7;


            doc.text(
                `Total INR: ${money(
                    totalInr
                )}`,
                18,
                y
            );


            y += 7;


            doc.text(
                `Total NPR Equivalent: ${money(
                    totalEquivalent
                )}`,
                18,
                y
            );


            /*
             * FOOTER
             */

            addPDFFooter(
                doc
            );


            /*
             * SAVE
             */

            const filename =
                `Digital-Notebook-Income-${today()}.pdf`;


            doc.save(
                filename
            );


            showToast(
                "Income PDF तयार भयो।"
            );

        }


        /* =========================
           PDF IMAGE LOADER
        ========================= */

        function loadImage(
            src
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const img =
                        new Image();

                    img.onload =
                        () =>
                            resolve(
                                img
                            );

                    img.onerror =
                        reject;

                    img.src =
                        src;

                }
            );

        }


        /* =========================
           PDF FOOTER
        ========================= */

        function addPDFFooter(
            doc
        ) {

            const pageCount =
                doc.internal
                    .getNumberOfPages();


            const width =
                doc.internal
                    .pageSize
                    .getWidth();


            const height =
                doc.internal
                    .pageSize
                    .getHeight();


            for (
                let page = 1;
                page <= pageCount;
                page++
            ) {

                doc.setPage(
                    page
                );


                doc.setDrawColor(
                    22,
                    163,
                    74
                );

                doc.setLineWidth(
                    0.5
                );

                doc.line(
                    14,
                    height - 14,
                    width - 14,
                    height - 14
                );


                doc.setFont(
                    "helvetica",
                    "normal"
                );

                doc.setFontSize(
                    7
                );

                doc.setTextColor(
                    100,
                    116,
                    139
                );


                doc.text(
                    "Digital Notebook",
                    14,
                    height - 8
                );


                doc.text(
                    `Page ${page} of ${pageCount}`,
                    width - 14,
                    height - 8,
                    {
                        align:
                            "right"
                    }
                );

            }

        }


        /* =========================
           PDF DATE
        ========================= */

        function formatPDFDate(
            value
        ) {

            if (!value) {
                return "";
            }

            const parts =
                String(value)
                    .split("-");


            if (
                parts.length === 3
            ) {

                return `${parts[2]}-${parts[1]}-${parts[0]}`;

            }


            return String(
                value
            );

        }


        /* =========================
           TOAST
        ========================= */

        let toastTimer = null;


        function showToast(
            message
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.remove(
                "hidden"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.add(
                            "hidden"
                        );

                    },
                    2200
                );

        }


        /* =========================
           EVENTS
        ========================= */

        document
            .getElementById(
                "addButton"
            )
            .addEventListener(
                "click",
                openAddModal
            );


        document
            .getElementById(
                "closeModal"
            )
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById(
                "cancelButton"
            )
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById(
                "pdfButton"
            )
            .addEventListener(
                "click",
                downloadPDF
            );


        searchInput.addEventListener(
            "input",
            render
        );


        modal.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    modal
                ) {

                    closeModal();

                }

            }
        );


        /* =========================
           ESC CLOSE
        ========================= */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /* =========================
           START
        ========================= */

        render();


        /* =========================
           SERVICE WORKER
        ========================= */

        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator
                        .serviceWorker
                        .register(
                            "./sw.js"
                        )
                        .catch(
                            error =>
                                console.warn(
                                    "SW:",
                                    error
                                )
                        );

                }
            );

        }

    </script>
