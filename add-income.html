        /*
        ========================================
        NORMALIZE NAME
        ========================================
        */

        function normalizeName(
            value
        ) {

            return String(
                value || ""
            )
                .trim()
                .replace(
                    /\s+/g,
                    " "
                )
                .toLowerCase();

        }


        /*
        ========================================
        DISPLAY NAME
        ========================================
        */

        function displayGroupName(
            items
        ) {

            if (
                !items ||
                !items.length
            ) {
                return "";
            }

            /*
             * पहिलो राम्रो spelling
             * लाई display name बनाउँछ।
             *
             * उदाहरण:
             * SalaRy
             * salary
             * SALARY
             *
             * यदि पहिलेको record मा
             * "Salary" छ भने त्यही देखिन्छ।
             */

            const sorted =
                [...items].sort(
                    (a, b) => {

                        const aName =
                            String(
                                a.sourceName
                                || ""
                            );

                        const bName =
                            String(
                                b.sourceName
                                || ""
                            );

                        /*
                         * Proper capitalization
                         * भएको नामलाई priority
                         */

                        const aScore =
                            getNameScore(
                                aName
                            );

                        const bScore =
                            getNameScore(
                                bName
                            );

                        if (
                            aScore !==
                            bScore
                        ) {
                            return (
                                bScore
                                -
                                aScore
                            );
                        }

                        return (
                            Number(
                                b.createdAt
                            )
                            -
                            Number(
                                a.createdAt
                            )
                        );
                    }
                );

            return (
                sorted[0]
                    ?.sourceName
                ||
                "Unnamed"
            ).trim();

        }


        function getNameScore(
            name
        ) {

            if (!name) {
                return 0;
            }

            /*
             * "Salary" जस्तो
             * normal title case लाई
             * राम्रो score
             */

            const titleCase =
                name
                    .split(" ")
                    .every(
                        word =>
                            word.length === 0
                            ||
                            (
                                word[0] ===
                                word[0].toUpperCase()
                                &&
                                word.slice(1) ===
                                word.slice(1).toLowerCase()
                            )
                    );

            if (
                titleCase
            ) {
                return 3;
            }

            if (
                name ===
                name.toLowerCase()
            ) {
                return 2;
            }

            if (
                name ===
                name.toUpperCase()
            ) {
                return 1;
            }

            return 2;

        }


        /*
        ========================================
        GROUP DATA
        ========================================
        */

        function getGroups() {

            const map =
                new Map();

            for (
                const income
                of incomes
            ) {

                const key =
                    normalizeName(
                        income.sourceName
                        ||
                        income.source
                        ||
                        "Unnamed"
                    );

                if (
                    !map.has(key)
                ) {
                    map.set(
                        key,
                        []
                    );
                }

                map.get(key).push(
                    income
                );

            }

            let groups =
                Array.from(
                    map.entries()
                )
                .map(
                    (
                        [key, items]
                    ) => {

                        const npr =
                            items.reduce(
                                (
                                    total,
                                    item
                                ) =>
                                    total
                                    +
                                    (
                                        Number(
                                            item.npr
                                        )
                                        ||
                                        0
                                    ),
                                0
                            );

                        const inr =
                            items.reduce(
                                (
                                    total,
                                    item
                                ) =>
                                    total
                                    +
                                    (
                                        Number(
                                            item.inr
                                        )
                                        ||
                                        0
                                    ),
                                0
                            );

                        const total =
                            items.reduce(
                                (
                                    sum,
                                    item
                                ) =>
                                    sum
                                    +
                                    (
                                        Number(
                                            item.total
                                            ??
                                            item.amount
                                        )
                                        ||
                                        0
                                    ),
                                0
                            );

                        return {
                            key,
                            name:
                                displayGroupName(
                                    items
                                ),
                            items,
                            npr,
                            inr,
                            total
                        };

                    }
                );


            /*
             * Search
             */

            if (
                searchText
            ) {

                const search =
                    normalizeName(
                        searchText
                    );

                groups =
                    groups.filter(
                        group =>
                            normalizeName(
                                group.name
                            ).includes(
                                search
                            )
                    );

            }


            /*
             * Newest group first
             */

            groups.sort(
                (a, b) => {

                    const aDate =
                        Math.max(
                            ...a.items.map(
                                item =>
                                    Number(
                                        item.createdAt
                                    )
                                    ||
                                    0
                            )
                        );

                    const bDate =
                        Math.max(
                            ...b.items.map(
                                item =>
                                    Number(
                                        item.createdAt
                                    )
                                    ||
                                    0
                            )
                        );

                    return (
                        bDate
                        -
                        aDate
                    );

                }
            );

            return groups;

        }


        /*
        ========================================
        LOAD DATA
        ========================================
        */

        function loadData() {

            incomes =
                getIncomes();

            renderSummary();

            renderGroups();

        }


        /*
        ========================================
        SUMMARY
        ========================================
        */

        function renderSummary() {

            const npr =
                incomes.reduce(
                    (
                        total,
                        item
                    ) =>
                        total
                        +
                        (
                            Number(
                                item.npr
                            )
                            ||
                            0
                        ),
                    0
                );

            const inr =
                incomes.reduce(
                    (
                        total,
                        item
                    ) =>
                        total
                        +
                        (
                            Number(
                                item.inr
                            )
                            ||
                            0
                        ),
                    0
                );

            const total =
                incomes.reduce(
                    (
                        sum,
                        item
                    ) =>
                        sum
                        +
                        (
                            Number(
                                item.total
                                ??
                                item.amount
                            )
                            ||
                            0
                        ),
                    0
                );

            totalIncome.textContent =
                formatMoney(

        /*
        ========================================
        NAME FORMAT
        ========================================
        */

        function formatName(
            value
        ) {

            const clean =
                String(
                    value || ""
                )
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );

            if (!clean) {
                return "";
            }


            /*
             * Existing group खोज्ने।
             *
             * Salary
             * salary
             * SALARY
             * SalaRy
             *
             * सबैलाई पहिलेबाट भएको
             * राम्रो नाममा राख्ने।
             */

            const normalized =
                normalizeName(
                    clean
                );

            const existing =
                incomes.find(
                    item =>
                        normalizeName(
                            item.sourceName
                            ||
                            ""
                        ) === normalized
                );


            if (
                existing
                &&
                existing.sourceName
            ) {

                const existingName =
                    existing.sourceName.trim();

                if (
                    getNameScore(
                        existingName
                    ) >=
                    getNameScore(
                        clean
                    )
                ) {
                    return existingName;
                }

            }


            /*
             * सामान्य Title Case
             */

            return clean
                .toLowerCase()
                .split(" ")
                .map(
                    word =>
                        word
                            ? word
                                .charAt(0)
                                .toUpperCase()
                                +
                                word
                                    .slice(1)
                            : ""
                )
                .join(" ");

        }


        /*
        ========================================
        TOTAL
        ========================================
        */

        function calculateTotal(
            npr,
            inr
        ) {

            return (
                Number(npr)
                +
                (
                    Number(inr)
                    *
                    INR_RATE
                )
            );

        }

            const npr =

            const inr =
                Number(
                    incomeInr.value

                ||
                0;

            const total =
                calculateTotal(
                    npr,
                    inr
                );

            incomeTotalPreview.textContent =
                formatMoney(
                    total
                );

        }

                }

            }
        );


        /*
        ========================================
        ESC KEY
        ========================================
        */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    if (
                        !modal.classList.contains(
                            "hidden"
                        )
                    ) {
                        closeModal();
                    }

                }

            }
        );


        /*
        ========================================
        HELPERS
        ========================================
        */

        function formatNumber(
            value
        ) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits:
                        2
                }
            );

        }


        function formatMoney(
            value
        ) {

            return `NPR ${formatNumber(
                value
            )}`;

        }


        function formatDate(
            value
        ) {

            if (!value) {
                return "-";
            }

            const date =
                new Date(
                    value
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return value;
            }

            return date.toLocaleDateString(
                "en-IN",
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                }
            );

        }


        function getToday() {

            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );

            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );

            return `${year}-${month}-${day}`;

        }


        function safeFileName(
            name
        ) {

            return String(
                name || "income"
            )
            .replace(
                /[^a-z0-9\u00C0-\uFFFF]+/gi,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                ""
            )
            .toLowerCase()
            ||
            "income";

        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        function showToast(
            message,
            type = "success"
        ) {

            const container =
                document.getElementById(
                    "toast-container"
                );


            const toast =
                document.createElement(
                    "div"
                );


            const icon =
                type === "error"
                    ? "fa-circle-exclamation"
                    : "fa-circle-check";


            toast.className = `
                mx-auto
                max-w-md
                rounded-xl
                px-4
                py-3
                mb-2
                shadow-xl
                border
                ${
                    type === "error"
                        ? `
                            bg-red-950
                            border-red-800
                            text-red-200
                        `
                        : `
                            bg-emerald-950
                            border-emerald-800
                            text-emerald-200
                        `
                }
            `;


            toast.innerHTML = `
                <i
                    class="
                        fa-solid
                        ${icon}
                        mr-2
                    "
                ></i>
                ${escapeHtml(
                    message
                )}
            `;


            container.appendChild(
                toast
            );


            setTimeout(
                () => {

                    toast.remove();

                },
                2800
            );

        }


        /*
        ========================================
        START
        ========================================
        */

        loadData();

    </script>

</body>
</html>
