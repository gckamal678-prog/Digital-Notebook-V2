<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Saving - Digital NoteBook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: Poppins, sans-serif;
        }

        .saving-group {
            transition:
                border-color .15s ease,
                background .15s ease;
        }

        .saving-group:hover {
            border-color: #334155;
        }

        .group-details {
            display: none;
        }

        .group-details.open {
            display: block;
        }

        .total-box {
            transition: .2s ease;
        }

        .pdf-page {
            width: 794px;
            min-height: 1123px;
            background: #ffffff;
            color: #111827;
            padding: 35px;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 640px) {

            input,
            select {
                font-size: 16px;
            }

            .pdf-page {
                width: 794px;
            }

        }

    </style>
</head>


<body class="min-h-screen bg-slate-950 text-white">


<!-- ================= HEADER ================= -->

<header
    class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/95 backdrop-blur"
>

    <div
        class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3"
    >

        <a
            href="./index.html"
            class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-lg shrink-0"
            aria-label="Back"
        >
            ←
        </a>


        <div class="flex-1 min-w-0">

            <h1 class="font-bold text-base truncate">
                Saving
            </h1>

            <p class="text-[11px] text-slate-400">
                Saving records
            </p>

        </div>


        <div
            id="profile-avatar"
            class="w-9 h-9 rounded-full bg-emerald-600 overflow-hidden shrink-0 flex items-center justify-center"
        >
            <span class="text-sm font-bold">
                D
            </span>
        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main
    class="max-w-4xl mx-auto px-4 py-5 pb-24"
>


    <!-- SUMMARY -->

    <section
        class="grid grid-cols-2 gap-3 mb-5"
    >

        <div
            class="rounded-2xl border border-slate-800 bg-slate-900 p-4"
        >

            <p class="text-[11px] text-slate-400">
                Total Saving
            </p>

            <p
                id="grandTotal"
                class="text-xl font-bold mt-1 text-emerald-400"
            >
                NPR 0.00
            </p>

        </div>


        <div
            class="rounded-2xl border border-slate-800 bg-slate-900 p-4"
        >

            <p class="text-[11px] text-slate-400">
                Records
            </p>

            <p
                id="recordCount"
                class="text-xl font-bold mt-1"
            >
                0
            </p>

        </div>

    </section>



    <!-- ================= TARGET ================= -->

    <section
        class="rounded-2xl border border-slate-800 bg-slate-900 p-4 mb-5"
    >

        <div
            class="flex items-center justify-between gap-3 mb-3"
        >

            <div>

                <p class="text-xs font-semibold">
                    Saving Target
                </p>

                <p
                    id="targetText"
                    class="text-[10px] text-slate-500 mt-1"
                >
                    Goal not set
                </p>

            </div>


            <button
                id="targetButton"
                type="button"
                class="rounded-xl bg-slate-800 px-3 py-2 text-[10px] font-semibold text-emerald-400"
            >
                Set Target
            </button>

        </div>


        <div
            class="flex items-center justify-between text-[10px] mb-1"
        >

            <span
                id="targetCurrent"
                class="text-slate-400"
            >
                NPR 0.00
            </span>

            <span
                id="targetPercent"
                class="text-emerald-400 font-semibold"
            >
                0%
            </span>

        </div>


        <div
            class="w-full h-2 rounded-full bg-slate-800 overflow-hidden"
        >

            <div
                id="targetBar"
                class="h-full rounded-full bg-emerald-500 transition-all duration-300"
                style="width:0%"
            ></div>

        </div>

    </section>



    <!-- ================= FORM ================= -->

    <section
        class="rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden"
    >

        <div
            class="px-4 py-4 border-b border-slate-800"
        >

            <h2
                id="formTitle"
                class="font-bold text-sm"
            >
                Add Saving
            </h2>

        </div>


        <form
            id="savingForm"
            class="p-4 space-y-4"
        >

            <input
                type="hidden"
                id="editId"
            >


            <!-- TITLE -->

            <div>

                <label
                    for="savingTitle"
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Saving Title
                </label>

                <input
                    id="savingTitle"
                    type="text"
                    required
                    autocomplete="off"
                    placeholder="e.g. Bank Saving"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500"
                >

            </div>


            <!-- CATEGORY -->

            <div>

                <label
                    for="savingCategory"
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Category
                </label>

                <select
                    id="savingCategory"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white outline-none focus:border-emerald-500"
                >

                    <option value="Bank">
                        Bank
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Investment">
                        Investment
                    </option>

                </select>

            </div>


            <!-- AMOUNT -->

            <div>

                <label
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Amount
                </label>


                <div
                    class="grid grid-cols-2 gap-2"
                >

                    <div>

                        <label
                            class="block text-[10px] text-slate-500 mb-1"
                        >
                            NPR
                        </label>

                        <input
                            id="amountNpr"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="NPR"
                            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-3 text-sm text-white outline-none focus:border-emerald-500"
                        >

                    </div>


                    <div>

                        <label
                            class="block text-[10px] text-slate-500 mb-1"
                        >
                            INR
                        </label>

                        <input
                            id="amountInr"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="INR"
                            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-3 text-sm text-white outline-none focus:border-emerald-500"
                        >

                    </div>

                </div>


                <!-- LIVE TOTAL -->

                <div
                    class="total-box mt-3 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4"
                >

                    <div
                        class="flex items-center justify-between gap-3"
                    >

                        <div>

                            <p
                                class="text-[10px] text-slate-400"
                            >
                                Total
                            </p>

                            <p
                                id="liveTotal"
                                class="text-2xl font-bold text-emerald-400 mt-1"
                            >
                                NPR 0.00
                            </p>

                        </div>


                        <div class="text-right">

                            <p
                                class="text-[10px] text-slate-500"
                            >
                                Rate
                            </p>

                            <p
                                class="text-xs font-semibold"
                            >
                                1 INR = 1.6 NPR
                            </p>

                        </div>

                    </div>


                    <p
                        id="conversionText"
                        class="text-[10px] text-slate-400 mt-2"
                    >
                        NPR 0 + INR 0 × 1.6 = NPR 0
                    </p>

                </div>

            </div>


            <!-- DATE -->

            <div>

                <label
                    for="savingDate"
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Date
                </label>

                <input
                    id="savingDate"
                    type="date"
                    required
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white outline-none focus:border-emerald-500"
                >

            </div>


            <!-- BUTTONS -->

            <button
                id="saveButton"
                type="submit"
                class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 py-3.5 font-bold text-sm transition"
            >
                Save Saving
            </button>


            <button
                id="cancelButton"
                type="button"
                class="hidden w-full rounded-xl bg-slate-700 hover:bg-slate-600 py-3 font-semibold text-sm"
            >
                Cancel Edit
            </button>


            <p
                id="formStatus"
                class="hidden text-center text-xs py-2 rounded-xl"
            ></p>

        </form>

    </section>



    <!-- ================= SEARCH ================= -->

    <section class="mt-6">

        <div
            class="flex items-center justify-between mb-3"
        >

            <h2 class="font-bold text-sm">
                Saving Records
            </h2>

            <span
                id="resultCount"
                class="text-[10px] text-slate-500"
            >
                0 groups
            </span>

        </div>


        <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search saving"
            class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500"
        >

    </section>



    <!-- ================= LIST ================= -->

    <section
        id="savingList"
        class="mt-4 space-y-3"
    ></section>


    <div
        id="emptyState"
        class="hidden text-center py-12 text-slate-500"
    >

        <p class="text-sm">
            No saving records found.
        </p>

    </div>


    <!-- ================= PDF ================= -->

    <div
        id="pdfArea"
        class="hidden"
    ></div>


</main>



<!-- ================= TARGET MODAL ================= -->

<div
    id="targetModal"
    class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm p-4 flex items-center justify-center"
>

    <div
        class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900 p-5"
    >

        <div
            class="flex items-center justify-between mb-4"
        >

            <h3 class="font-bold">
                Saving Target
            </h3>

            <button
                id="closeTarget"
                type="button"
                class="text-slate-400 text-lg"
            >
                ×
            </button>

        </div>


        <label
            class="block text-xs text-slate-400 mb-2"
        >
            Target Amount (NPR)
        </label>


        <input
            id="targetInput"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="e.g. 100000"
            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white outline-none focus:border-emerald-500"
        >


        <button
            id="saveTarget"
            type="button"
            class="w-full mt-4 rounded-xl bg-emerald-600 py-3 font-bold text-sm"
        >
            Save Target
        </button>

    </div>

</div>



<!-- ================= SCRIPT ================= -->

<script type="module">

import {
    getSavings,
    saveSavings
} from "./js/savings.js";

import {
    getProfileValue
} from "./js/storage.js";


const INR_RATE = 1.6;

let editingId = "";



/* ================= ELEMENTS ================= */

const form =
    document.getElementById(
        "savingForm"
    );

const savingTitle =
    document.getElementById(
        "savingTitle"
    );

const savingCategory =
    document.getElementById(
        "savingCategory"
    );

const amountNpr =
    document.getElementById(
        "amountNpr"
    );

const amountInr =
    document.getElementById(
        "amountInr"
    );

const savingDate =
    document.getElementById(
        "savingDate"
    );

const liveTotal =
    document.getElementById(
        "liveTotal"
    );

const conversionText =
    document.getElementById(
        "conversionText"
    );

const savingList =
    document.getElementById(
        "savingList"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const formTitle =
    document.getElementById(
        "formTitle"
    );

const formStatus =
    document.getElementById(
        "formStatus"
    );



/* ================= HELPERS ================= */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


function number(value) {

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function money(value) {

    return number(value)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


function cleanText(value) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        );

}


function createId() {

    return (
        "saving_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}



/* ================= PROFILE ================= */

function loadProfile() {

    const name =
        getProfileValue(
            "profile_name",
            ""
        );

    const avatar =
        getProfileValue(
            "profile_avatar",
            ""
        );

    const box =
        document.getElementById(
            "profile-avatar"
        );


    if (
        avatar &&
        box
    ) {

        box.innerHTML =
            `<img
                src="${escapeAttribute(avatar)}"
                alt="Profile"
                class="w-full h-full object-cover"
            >`;

    } else if (
        name &&
        box
    ) {

        box.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}



/* ================= LIVE TOTAL ================= */

function calculateTotal() {

    const npr =
        number(
            amountNpr.value
        );

    const inr =
        number(
            amountInr.value
        );

    const total =
        npr +
        (
            inr *
            INR_RATE
        );


    liveTotal.textContent =
        "NPR " +
        money(total);


    conversionText.textContent =
        "NPR " +
        money(npr) +
        " + INR " +
        money(inr) +
        " × 1.6 = NPR " +
        money(total);


    return total;

}


amountNpr.addEventListener(
    "input",
    calculateTotal
);

amountInr.addEventListener(
    "input",
    calculateTotal
);



/* ================= STATUS ================= */

function showStatus(
    message,
    success = true
) {

    formStatus.textContent =
        message;

    formStatus.className =
        success
            ? "text-center text-xs py-2 rounded-xl bg-emerald-500/10 text-emerald-400"
            : "text-center text-xs py-2 rounded-xl bg-rose-500/10 text-rose-400";

}


function clearStatus() {

    formStatus.textContent = "";

    formStatus.className =
        "hidden text-center text-xs py-2 rounded-xl";

}



/* ================= SAVE ================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        clearStatus();


        const title =
            cleanText(
                savingTitle.value
            );

        const category =
            savingCategory.value ||
            "Bank";

        const npr =
            number(
                amountNpr.value
            );

        const inr =
            number(
                amountInr.value
            );

        const total =
            npr +
            (
                inr *
                INR_RATE
            );

        const date =
            savingDate.value ||
            today();


        if (!title) {

            showStatus(
                "Enter saving title.",
                false
            );

            savingTitle.focus();

            return;

        }


        if (total <= 0) {

            showStatus(
                "Enter NPR or INR amount.",
                false
            );

            amountNpr.focus();

            return;

        }


        let savings =
            getSavings();


        const item = {

            id:
                editingId ||
                createId(),

            title,

            category,

            amount:
                total,

            npr,

            inr,

            total,

            date,

            createdAt:
                editingId
                    ? getCreatedAt(
                        editingId
                    )
                    : Date.now(),

            updatedAt:
                Date.now()

        };


        if (editingId) {

            const index =
                savings.findIndex(
                    item =>
                        item.id ===
                        editingId
                );


            if (index === -1) {

                showStatus(
                    "Record not found.",
                    false
                );

                return;

            }


            savings[index] =
                item;

        } else {

            savings.unshift(
                item
            );

        }


        saveSavings(
            savings
        );


        const wasEditing =
            !!editingId;


        resetForm();

        renderSavings();

        updateTargetUI();


        showStatus(
            wasEditing
                ? "Saving updated."
                : "Saving saved.",
            true
        );

    }
);



/* ================= CREATED ================= */

function getCreatedAt(id) {

    const item =
        getSavings()
            .find(
                saving =>
                    saving.id === id
            );


    return (
        item?.createdAt ||
        Date.now()
    );

}



/* ================= RESET ================= */

function resetForm() {

    editingId = "";

    document.getElementById(
        "editId"
    ).value = "";


    form.reset();


    savingDate.value =
        today();


    calculateTotal();


    formTitle.textContent =
        "Add Saving";


    saveButton.textContent =
        "Save Saving";


    cancelButton.classList.add(
        "hidden"
    );

}



/* ================= CANCEL ================= */

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

        clearStatus();

    }
);



/* ================= EDIT ================= */

window.editSaving =
    function(id) {

        const savings =
            getSavings();


        const item =
            savings.find(
                saving =>
                    saving.id === id
            );


        if (!item) {

            return;

        }


        editingId =
            item.id;


        document.getElementById(
            "editId"
        ).value =
            item.id;


        savingTitle.value =
            item.title ||
            "";


        savingCategory.value =
            item.category ||
            "Bank";


        amountNpr.value =
            item.npr ||
            0;


        amountInr.value =
            item.inr ||
            0;


        savingDate.value =
            item.date ||
            today();


        calculateTotal();


        formTitle.textContent =
            "Edit Saving";


        saveButton.textContent =
            "Update Saving";


        cancelButton.classList.remove(
            "hidden"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };



/* ================= DELETE ================= */

window.deleteSaving =
    function(id) {

        const savings =
            getSavings();


        const updated =
            savings.filter(
                item =>
                    item.id !== id
            );


        if (
            updated.length ===
            savings.length
        ) {

            return;

        }


        saveSavings(
            updated
        );


        renderSavings();

        updateTargetUI();

    };



/* ================= GROUP ================= */

function groupSavings(
    savings
) {

    const groups = {};


    savings.forEach(
        item => {

            const name =
                cleanText(
                    item.title ||
                    item.category
                );


            if (!name) {

                return;

            }


            const key =
                name.toLocaleLowerCase();


            if (!groups[key]) {

                groups[key] = {

                    name,

                    items: []

                };

            }


            groups[key]
                .items
                .push(item);

        }
    );


    return Object.values(
        groups
    );

}



/* ================= RENDER ================= */

function renderSavings() {

    const savings =
        getSavings();


    document.getElementById(
        "recordCount"
    ).textContent =
        savings.length;


    const grandTotal =
        savings.reduce(
            (
                sum,
                item
            ) =>
                sum +
                number(
                    item.total ??
                    item.amount
                ),
            0
        );


    document.getElementById(
        "grandTotal"
    ).textContent =
        "NPR " +
        money(grandTotal);


    const query =
        cleanText(
            searchInput.value
        )
        .toLocaleLowerCase();


    let groups =
        groupSavings(
            savings
        );


    groups =
        groups.filter(
            group =>
                group.name
                    .toLocaleLowerCase()
                    .includes(query)
        );


    groups.sort(
        (
            a,
            b
        ) =>
            a.name.localeCompare(
                b.name
            )
    );


    document.getElementById(
        "resultCount"
    ).textContent =
        groups.length +
        (
            groups.length === 1
                ? " group"
                : " groups"
        );


    savingList.innerHTML =
        "";


    if (
        groups.length === 0
    ) {

        emptyState.classList.remove(
            "hidden"
        );

        return;

    }


    emptyState.classList.add(
        "hidden"
    );


    groups.forEach(
        (
            group,
            index
        ) => {

            savingList.appendChild(
                createGroupCard(
                    group,
                    index
                )
            );

        }
    );

}



/* ================= GROUP CARD ================= */

function createGroupCard(
    group,
    index
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "saving-group rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden";


    const total =
        group.items.reduce(
            (
                sum,
                item
            ) =>
                sum +
                number(
                    item.total ??
                    item.amount
                ),
            0
        );


    const groupId =
        "saving_group_" +
        index +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 6);


    const header =
        document.createElement(
            "button"
        );


    header.type =
        "button";


    header.className =
        "w-full text-left p-4";


    header.innerHTML = `

        <div class="flex items-center justify-between gap-3">

            <div class="min-w-0">

                <h3 class="font-bold text-sm truncate">
                    ${escapeHtml(group.name)}
                </h3>

                <p class="text-[10px] text-slate-500 mt-1">
                    ${group.items.length}
                    ${
                        group.items.length === 1
                            ? "record"
                            : "records"
                    }
                </p>

            </div>


            <div class="text-right shrink-0">

                <p class="text-[10px] text-slate-500">
                    Total
                </p>

                <p class="font-bold text-sm text-emerald-400">
                    NPR ${money(total)}
                </p>

            </div>

        </div>


        <div
            class="flex items-center justify-between mt-3"
        >

            <span class="text-[10px] text-slate-500">
                Tap to view records
            </span>

            <span
                id="arrow_${groupId}"
                class="text-slate-500"
            >
                ▾
            </span>

        </div>
    `;


    const details =
        document.createElement(
            "div"
        );


    details.id =
        groupId;


    details.className =
        "group-details border-t border-slate-800";


    group.items
        .slice()
        .sort(
            (
                a,
                b
            ) =>
                new Date(b.date) -
                new Date(a.date)
        )
        .forEach(
            item => {

                details.appendChild(
                    createRecordRow(
                        item
                    )
                );

            }
        );


    header.addEventListener(
        "click",
        function() {

            details.classList.toggle(
                "open"
            );


            const arrow =
                document.getElementById(
                    "arrow_" +
                    groupId
                );


            arrow.textContent =
                details.classList.contains(
                    "open"
                )
                    ? "▴"
                    : "▾";

        }
    );


    wrapper.appendChild(
        header
    );

    wrapper.appendChild(
        details
    );


    return wrapper;

}

function createRecordRow(
    item
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "p-4 border-b border-slate-800 last:border-b-0";


    const total =
        number(

        );


    row.innerHTML = `

        <div class="flex items-start justify-between gap-3">

            <div>

                <p class="font-semibold text-xs">
                    ${escapeHtml(
                        item.date || ""
                    )}
                </p>

                <p class="text-[10px] text-slate-500 mt-1">
                    ${escapeHtml(
                        item.category || ""
                    )}
                </p>

                <p class="text-[10px] text-slate-500 mt-1">
                    NPR ${money(item.npr)}
                    +
                    INR ${money(item.inr)}
                </p>

            </div>


            <div class="text-right shrink-0">

                <p class="font-bold text-sm text-emerald-400">
                    NPR ${money(total)}
                </p>


                <div
                    class="flex justify-end gap-3 mt-2"
                >

                    <button
                        type="button"
                        data-edit
                        class="text-[10px] text-blue-400"
                    >
                        Edit
                    </button>

                    <button
                        type="button"
                        data-delete
                        class="text-[10px] text-rose-400"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>
    `;


    row.querySelector(
        "[data-edit]"
    ).addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            window.editSaving(
                item.id
            );

        }
    );


    row.querySelector(
        "[data-delete]"
    ).addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            window.deleteSaving(
                item.id
            );

        }
    );


    return row;

}

function updateTargetUI() {

    const savings =
        getSavings();


    const total =
        savings.reduce(
            (
                sum,
                item
            ) =>
                sum +
                number(
                    item.total ??
                    item.amount
                ),
            0
        );


    const target =
        number(
            localStorage.getItem(
                "savings_target_amount"
            )
        );


    const targetText =
        document.getElementById(
            "targetText"
        );

    const targetCurrent =
        document.getElementById(
            "targetCurrent"
        );

    const targetPercent =
        document.getElementById(
            "targetPercent"
        );

    const targetBar =
        document.getElementById(
            "targetBar"
        );


    targetCurrent.textContent =
        "NPR " +
        money(total);


    if (
        target <= 0
    ) {

        targetText.textContent =
            "Goal not set";

        targetPercent.textContent =
            "0%";

        targetBar.style.width =
            "0%";

        return;

    }


    const percentage =
        Math.min(
            100,
            Math.round(
                (
                    total /
                    target
                ) *
                100
            )
        );


    targetText.textContent =
        "Goal NPR " +
        money(target);


    targetPercent.textContent =
        percentage +
        "%";


    targetBar.style.width =
        percentage +
        "%";

}

/* ================= ESCAPE ================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}
