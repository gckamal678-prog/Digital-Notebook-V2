<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Income - Digital NoteBook</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: Poppins, sans-serif;
        }

        .income-group {
            transition:
                border-color .15s ease,
                background .15s ease;
        }

        .income-group:hover {
            border-color: #334155;
        }

        .group-details {
            display: none;
        }

        .group-details.open {
            display: block;
        }

        .type-button {
            transition:
                border-color .15s ease,
                background .15s ease,
                transform .1s ease;
        }

        .type-button:active {
            transform: scale(.98);
        }

        .total-box {
            transition: .2s ease;
        }

        .pdf-page {
            width: 794px;
            min-height: 1123px;
            background: #ffffff;
            color: #111827;
            padding: 35px;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 640px) {
            .pdf-page {
                width: 794px;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 text-white">

<!-- ================= HEADER ================= -->

<header
    class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/95 backdrop-blur"
>
    <div
        class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3"
    >

        <a
            href="./index.html"
            class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-lg shrink-0"
            aria-label="Back"
        >
            ←
        </a>

        <div class="flex-1 min-w-0">
            <h1 class="font-bold text-base truncate">
                Income
            </h1>

            <p class="text-[11px] text-slate-400">
                Income records
            </p>
        </div>

        <div
            id="profile-avatar"
            class="w-9 h-9 rounded-full bg-emerald-600 overflow-hidden shrink-0 flex items-center justify-center"
        >
            <span class="text-sm font-bold">
                D
            </span>
        </div>

    </div>
</header>


<!-- ================= MAIN ================= -->

<main
    class="max-w-4xl mx-auto px-4 py-5 pb-20"
>

    <!-- SUMMARY -->

    <section
        class="grid grid-cols-2 gap-3 mb-5"
    >

        <div
            class="rounded-2xl border border-slate-800 bg-slate-900 p-4"
        >
            <p class="text-[11px] text-slate-400">
                Total Income
            </p>

            <p
                id="grandTotal"
                class="text-xl font-bold mt-1 text-emerald-400"
            >
                NPR 0.00
            </p>
        </div>

        <div
            class="rounded-2xl border border-slate-800 bg-slate-900 p-4"
        >
            <p class="text-[11px] text-slate-400">
                Records
            </p>

            <p
                id="recordCount"
                class="text-xl font-bold mt-1"
            >
                0
            </p>
        </div>

    </section>


    <!-- ================= FORM ================= -->

    <section
        class="rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden"
    >

        <div
            class="px-4 py-4 border-b border-slate-800"
        >
            <h2
                id="formTitle"
                class="font-bold text-sm"
            >
                Add Income
            </h2>
        </div>

        <form
            id="incomeForm"
            class="p-4 space-y-4"
        >

            <input
                type="hidden"
                id="editId"
            >


            <!-- SOURCE -->

            <div>

                <label
                    for="sourceName"
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Income Source
                </label>

                <input
                    id="sourceName"
                    type="text"
                    required
                    autocomplete="off"
                    placeholder="e.g. Salary"
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500"
                >

            </div>


            <!-- DATE -->

            <div>

                <label
                    for="incomeDate"
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Date
                </label>

                <input
                    id="incomeDate"
                    type="date"
                    required
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-sm text-white outline-none focus:border-emerald-500"
                >

            </div>


            <!-- AMOUNT -->

            <div>

                <label
                    class="block text-xs font-semibold text-slate-300 mb-2"
                >
                    Amount
                </label>

                <div
                    class="grid grid-cols-2 gap-2"
                >

                    <div>

                        <label
                            class="block text-[10px] text-slate-500 mb-1"
                        >
                            NPR
                        </label>

                        <input
                            id="amountNpr"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="NPR"
                            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-3 text-sm text-white outline-none focus:border-emerald-500"
                        >

                    </div>


                    <div>

                        <label
                            class="block text-[10px] text-slate-500 mb-1"
                        >
                            INR
                        </label>

                        <input
                            id="amountInr"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="INR"
                            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-3 text-sm text-white outline-none focus:border-emerald-500"
                        >

                    </div>

                </div>


                <!-- LIVE TOTAL -->

                <div
                    class="total-box mt-3 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4"
                >

                    <div
                        class="flex items-center justify-between gap-3"
                    >

                        <div>

                            <p
                                class="text-[10px] text-slate-400"
                            >
                                Total
                            </p>

                            <p
                                id="liveTotal"
                                class="text-2xl font-bold text-emerald-400 mt-1"
                            >
                                NPR 0.00
                            </p>

                        </div>

                        <div class="text-right">

                            <p
                                class="text-[10px] text-slate-500"
                            >
                                Rate
                            </p>

                            <p
                                class="text-xs font-semibold"
                            >
                                1 INR = 1.6 NPR
                            </p>

                        </div>

                    </div>


                    <p
                        id="conversionText"
                        class="text-[10px] text-slate-400 mt-2"
                    >
                        NPR 0 + INR 0 × 1.6 = NPR 0
                    </p>

                </div>

            </div>


            <!-- ACTIONS -->

            <button
                id="saveButton"
                type="submit"
                class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 py-3.5 font-bold text-sm transition"
            >
                Save Income
            </button>

            <button
                id="cancelButton"
                type="button"
                class="hidden w-full rounded-xl bg-slate-700 hover:bg-slate-600 py-3 font-semibold text-sm"
            >
                Cancel Edit
            </button>

            <p
                id="formStatus"
                class="hidden text-center text-xs py-2 rounded-xl"
            ></p>

        </form>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="mt-6">

        <div
            class="flex items-center justify-between mb-3"
        >

            <h2 class="font-bold text-sm">
                Income Records
            </h2>

            <span
                id="resultCount"
                class="text-[10px] text-slate-500"
            >
                0 groups
            </span>

        </div>


        <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search income source"
            class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-emerald-500"
        >

    </section>


    <!-- ================= GROUP LIST ================= -->

    <section
        id="incomeList"
        class="mt-4 space-y-3"
    ></section>


    <div
        id="emptyState"
        class="hidden text-center py-12 text-slate-500"
    >
        <p class="text-sm">
            No income records found.
        </p>
    </div>


    <!-- ================= PDF AREA ================= -->

    <div
        id="pdfArea"
        class="hidden"
    ></div>

</main>


<!-- ================= SCRIPT ================= -->

<script type="module">

import {
    getIncomes,
    saveIncomes
} from "./js/incomes.js";

import {
    getProfileValue
} from "./js/storage.js";


const INR_RATE = 1.6;


let editingId = "";


const form =
    document.getElementById(
        "incomeForm"
    );

const sourceName =
    document.getElementById(
        "sourceName"
    );

const incomeDate =
    document.getElementById(
        "incomeDate"
    );

const amountNpr =
    document.getElementById(
        "amountNpr"
    );

const amountInr =
    document.getElementById(
        "amountInr"
    );

const liveTotal =
    document.getElementById(
        "liveTotal"
    );

const conversionText =
    document.getElementById(
        "conversionText"
    );

const incomeList =
    document.getElementById(
        "incomeList"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const editId =
    document.getElementById(
        "editId"
    );

const formTitle =
    document.getElementById(
        "formTitle"
    );

const formStatus =
    document.getElementById(
        "formStatus"
    );


/* ================= COMMON ================= */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


function number(value) {

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function money(value) {

    return number(value)
        .toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


function cleanName(value) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        );

}


function createId() {

    return (
        "income_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}


/* ================= PROFILE ================= */

function loadProfile() {

    const name =
        getProfileValue(
            "profile_name",
            ""
        );

    const avatar =
        getProfileValue(
            "profile_avatar",
            ""
        );

    const avatarBox =
        document.getElementById(
            "profile-avatar"
        );

    if (
        avatar &&
        avatarBox
    ) {

        avatarBox.innerHTML =
            `<img
                src="${escapeAttribute(avatar)}"
                class="w-full h-full object-cover"
                alt="Profile"
            >`;

    } else if (
        name &&
        avatarBox
    ) {

        avatarBox.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}


/* ================= LIVE TOTAL ================= */

function calculateTotal() {

    const npr =
        number(
            amountNpr.value
        );

    const inr =
        number(
            amountInr.value
        );

    const converted =
        inr * INR_RATE;

    const total =
        npr + converted;


    liveTotal.textContent =
        "NPR " +
        money(total);


    conversionText.textContent =
        "NPR " +
        money(npr) +
        " + INR " +
        money(inr) +
        " × 1.6 = NPR " +
        money(total);


    return total;

}


amountNpr.addEventListener(
    "input",
    calculateTotal
);

amountInr.addEventListener(
    "input",
    calculateTotal
);


/* ================= STATUS ================= */

function showStatus(
    message,
    success = true
) {

    formStatus.textContent =
        message;

    formStatus.className =
        success
            ? "text-center text-xs py-2 rounded-xl bg-emerald-500/10 text-emerald-400"
            : "text-center text-xs py-2 rounded-xl bg-rose-500/10 text-rose-400";

}


function clearStatus() {

    formStatus.textContent = "";

    formStatus.className =
        "hidden text-center text-xs py-2 rounded-xl";

}


/* ================= SAVE ================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        clearStatus();


        const name =
            cleanName(
                sourceName.value
            );

        const date =
            incomeDate.value ||
            today();

        const npr =
            number(
                amountNpr.value
            );

        const inr =
            number(
                amountInr.value
            );

        const total =
            npr +
            (
                inr *
                INR_RATE
            );


        if (!name) {

            showStatus(
                "Enter income source.",
                false
            );

            sourceName.focus();

            return;

        }


        if (total <= 0) {

            showStatus(
                "Enter NPR or INR amount.",
                false
            );

            amountNpr.focus();

            return;

        }


        let incomes =
            getIncomes();


        const item = {

            id:
                editingId ||
                createId(),

            sourceName:
                name,

            date,

            npr,

            inr,

            total,

            amount:
                total,

            category:
                name,

            createdAt:
                editingId
                    ? getCreatedAt(editingId)
                    : Date.now(),

            updatedAt:
                Date.now()

        };


        if (editingId) {

            const index =
                incomes.findIndex(
                    item =>
                        item.id ===
                        editingId
                );


            if (index === -1) {

                showStatus(
                    "Record not found.",
                    false
                );

                return;

            }


            incomes[index] =
                item;

        } else {

            incomes.unshift(
                item
            );

        }


        saveIncomes(
            incomes
        );


        const wasEditing =
            !!editingId;


        resetForm();


        renderIncomes();


        showStatus(
            wasEditing
                ? "Income updated."
                : "Income saved.",
            true
        );

    }
);


/* ================= CREATED DATE ================= */

function getCreatedAt(id) {

    const item =
        getIncomes()
            .find(
                income =>
                    income.id === id
            );

    return (
        item?.createdAt ||
        Date.now()
    );

}


/* ================= RESET ================= */

function resetForm() {

    editingId = "";

    editId.value = "";

    form.reset();

    incomeDate.value =
        today();

    calculateTotal();

    saveButton.textContent =
        "Save Income";

    cancelButton.classList.add(
        "hidden"
    );

    formTitle.textContent =
        "Add Income";

}


/* ================= CANCEL ================= */

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

        clearStatus();

    }
);


/* ================= EDIT ================= */

window.editIncome =
    function(id) {

        const incomes =
            getIncomes();

        const item =
            incomes.find(
                income =>
                    income.id === id
            );


        if (!item) {

            return;

        }


        editingId =
            item.id;

        editId.value =
            item.id;

        sourceName.value =
            item.sourceName ||
            item.source ||
            "";

        incomeDate.value =
            item.date ||
            today();

        amountNpr.value =
            item.npr ||
            0;

        amountInr.value =
            item.inr ||
            0;


        calculateTotal();


        saveButton.textContent =
            "Update Income";

        cancelButton.classList.remove(
            "hidden"
        );

        formTitle.textContent =
            "Edit Income";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };


/* ================= DELETE ================= */

window.deleteIncome =
    function(id) {

        const incomes =
            getIncomes();

        const updated =
            incomes.filter(
                item =>
                    item.id !== id
            );


        if (
            updated.length ===
            incomes.length
        ) {

            return;

        }


        saveIncomes(
            updated
        );

        renderIncomes();

    };


/* ================= GROUP ================= */

function groupIncomes(
    incomes
) {

    const groups = {};


    incomes.forEach(
        item => {

            const name =
                cleanName(
                    item.sourceName ||
                    item.source ||
                    item.category
                );


            if (!name) {

                return;

            }


            const key =
                name.toLocaleLowerCase();


            if (!groups[key]) {

                groups[key] = {

                    name,

                    items: []

                };

            }


            groups[key]
                .items
                .push(item);

        }
    );


    return Object.values(
        groups
    );

}


/* ================= RENDER ================= */

function renderIncomes() {

    const incomes =
        getIncomes();


    document.getElementById(
        "recordCount"
    ).textContent =
        incomes.length;


    const grandTotal =
        incomes.reduce(
            (
                sum,
                item
            ) =>
                sum +
                number(
                    item.total ??
                    item.amount
                ),
            0
        );


    document.getElementById(
        "grandTotal"
    ).textContent =
        "NPR " +
        money(grandTotal);


    const query =
        cleanName(
            searchInput.value
        )
        .toLocaleLowerCase();


    let groups =
        groupIncomes(
            incomes
        );


    groups =
        groups.filter(
            group =>
                group.name
                    .toLocaleLowerCase()
                    .includes(query)
        );


    groups.sort(
        (a, b) =>
            a.name.localeCompare(
                b.name
            )
    );


    document.getElementById(
        "resultCount"
    ).textContent =
        groups.length +
        (
            groups.length === 1
                ? " group"
                : " groups"
        );


    incomeList.innerHTML =
        "";


    if (
        groups.length === 0
    ) {

        emptyState.classList.remove(
            "hidden"
        );

        return;

    }


    emptyState.classList.add(
        "hidden"
    );


    groups.forEach(
        (
            group,
            index
        ) => {

            incomeList.appendChild(
                createGroupCard(
                    group,
                    index
                )
            );

        }
    );

}


/* ================= GROUP CARD ================= */

function createGroupCard(
    group,
    index
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "income-group rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden";


    const total =
        group.items.reduce(
            (
                sum,
                item
            ) =>
                sum +
                number(
                    item.total ??
                    item.amount
                ),
            0
        );


    const groupId =
        "income_group_" +
        index +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 6);


    const header =
        document.createElement(
            "button"
        );


    header.type =
        "button";


    header.className =
        "w-full text-left p-4";


    header.innerHTML = `

        <div class="flex items-center justify-between gap-3">

            <div class="min-w-0">

                <h3 class="font-bold text-sm truncate">
                    ${escapeHtml(group.name)}
                </h3>

                <p class="text-[10px] text-slate-500 mt-1">
                    ${group.items.length}
                    ${
                        group.items.length === 1
                            ? "record"
                            : "records"
                    }
                </p>

            </div>

            <div class="text-right shrink-0">

                <p class="text-[10px] text-slate-500">
                    Total
                </p>

                <p class="font-bold text-sm text-emerald-400">
                    NPR ${money(total)}
                </p>

            </div>

        </div>

        <div class="flex items-center justify-between mt-3">

            <span class="text-[10px] text-slate-500">
                Tap to view records
            </span>

            <span
                id="arrow_${groupId}"
                class="text-slate-500"
            >
                ▾
            </span>

        </div>
    `;


    const details =
        document.createElement(
            "div"
        );


    details.id =
        groupId;

    details.className =
        "group-details border-t border-slate-800";


    group.items
        .slice()
        .sort(
            (
                a,
                b
            ) =>
                new Date(b.date) -
                new Date(a.date)
        )
        .forEach(
            item => {

                details.appendChild(
                    createRecordRow(
                        item
                    )
                );

            }
        );


    header.addEventListener(
        "click",
        function() {

            details.classList.toggle(
                "open"
            );


            const arrow =
                document.getElementById(
                    "arrow_" +
                    groupId
                );


            if (
                details.classList.contains(
                    "open"
                )
            ) {

                arrow.textContent =
                    "▴";

            } else {

                arrow.textContent =
                    "▾";

            }

        }
    );


    wrapper.appendChild(
        header
    );

    wrapper.appendChild(
        details
    );


    return wrapper;

}


/* ================= RECORD ROW ================= */

function createRecordRow(
    item
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "p-4 border-b border-slate-800 last:border-b-0";


    const total =
        number(
            item.total ??
            item.amount
        );


    row.innerHTML = `

        <div class="flex items-start justify-between gap-3">

            <div class="min-w-0">

                <p class="font-semibold text-xs">
                    ${escapeHtml(item.date || "")}
                </p>

                <p class="text-[10px] text-slate-500 mt-1">
                    NPR ${money(item.npr)}
                    +
                    INR ${money(item.inr)}
                </p>

            </div>


            <div class="text-right shrink-0">

                <p class="font-bold text-sm text-emerald-400">
                    NPR ${money(total)}
                </p>

                <div class="flex justify-end gap-3 mt-2">

                    <button
                        type="button"
                        class="text-[10px] text-blue-400"
                        data-edit
                    >
                        Edit
                    </button>

                    <button
                        type="button"
                        class="text-[10px] text-rose-400"
                        data-delete
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>
    `;


    row.querySelector(
        "[data-edit]"
    ).addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            window.editIncome(
                item.id
            );

        }
    );


    row.querySelector(
        "[data-delete]"
    ).addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            window.deleteIncome(
                item.id
            );

        }
    );


    return row;

}

            getProfileValue(
                "profile_name",
                ""
            );

            getProfileValue(
                "profile_address",
                ""
            );

            getProfileValue(
                "profile_mobile",
                ""
            );

            getProfileValue(
                "profile_email",
                ""

                                item.sourceName ||

                        </td>

                        <td>
                            ${money(item.inr)}

                        border-bottom:2px solid #16a34a;

                        margin-bottom:20px;

                >

                    <div>

                            style="
                                font-size:24px;

                            "

                        </div>

                        <div
                            style="
                                font-size:11px;
                                color:#6b7280;
                                margin-top:4px;
                            "
                        >
                            Income Report
                        </div>

                    </div>

                    ${avatar}

                </div>


                <div
                    style="
                        background:#f8fafc;
                        border:1px solid #e5e7eb;
                        padding:15px;

                        margin-bottom:20px;
                        font-size:11px;

                    "
                >

                    ${

                            ? `<div><b>Name:</b> ${escapeHtml(profileName)}</div>`
                            : ""
                    }

                    ${
                        profileAddress
                            ? `<div><b>Address:</b> ${escapeHtml(profileAddress)}</div>`
                            : ""
                    }

                    ${
                        profileMobile
                            ? `<div><b>Mobile:</b> ${escapeHtml(profileMobile)}</div>`
                            : ""
                    }

                    ${
                        profileEmail
                            ? `<div><b>Email:</b> ${escapeHtml(profileEmail)}</div>`
                            : ""
                    }

                </div>


                <table
                    style="
                        width:100%;
                        border-collapse:collapse;
                        font-size:10px;
                    "
                >

                    <thead>

                        <tr
                            style="
                                background:#f1f5f9;
                            "
                        >

                            <th
                                style="padding:8px;text-align:left;"
                            >
                                Date
                            </th>

                            <th
                                style="padding:8px;text-align:left;"

/* ================= ESCAPE ================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}
