<script type="module">

import {
    initApp
} from "./js/app.js";

import {
    getIncomes,
    getTotalIncome,
    calculateIncomeTotal as moduleCalculateIncomeTotal,
    saveIncome as moduleSaveIncome,
    resetIncomeForm as moduleResetIncomeForm,
    editIncome as moduleEditIncome,
    deleteIncome as moduleDeleteIncome
} from "./js/incomes.js";

import {
    getProfileValue
} from "./js/storage.js";



/* =========================================================
   TODAY
========================================================= */

function today() {

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            d.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}



/* =========================================================
   MONEY
========================================================= */

function money(value) {

    return (
        "NPR " +
        (
            Number(value) || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );

}



/* =========================================================
   LIVE CALCULATION
========================================================= */

function calculateIncomeTotal() {

    const npr =
        Number(
            document.getElementById(
                "income-amount-npr"
            ).value
        ) || 0;


    const inr =
        Number(
            document.getElementById(
                "income-amount-inr"
            ).value
        ) || 0;


    const total =
        npr +
        (
            inr * 1.6
        );


    document.getElementById(
        "income-total-display"
    ).textContent =
        money(total);


    document.getElementById(
        "income-calculation-text"
    ).textContent =
        `NPR ${npr} + INR ${inr} × 1.6 = NPR ${total.toFixed(2)}`;


    const hidden =
        document.getElementById(
            "income-total-calc"
        );

    hidden.value =
        total.toFixed(2);


    /*
       Keep V2 module calculation alive.
    */

    try {

        moduleCalculateIncomeTotal();

    } catch (error) {

        console.warn(
            "Income calculation bridge:",
            error
        );

    }

}


/*
   IMPORTANT:
   Inline HTML handlers use window function.
*/

window.calculateIncomeTotal =
    calculateIncomeTotal;



/* =========================================================
   SAVE
========================================================= */

window.saveIncome =
async function(event) {

    event.preventDefault();

    const result =
        await moduleSaveIncome(
            event
        );


    /*
       Module already saves the data.
       We refresh the visible page here.
    */

    renderIncomes();

    showInlineStatus(
        "Income saved successfully."
    );


    return false;

};



/* =========================================================
   RESET
========================================================= */

window.resetIncomeForm =
function() {

    moduleResetIncomeForm();

    document.getElementById(
        "income-total-display"
    ).textContent =
        "NPR 0.00";


    document.getElementById(
        "income-calculation-text"
    ).textContent =
        "NPR 0 + INR 0 × 1.6 = NPR 0";


    document.getElementById(
        "income-total-calc"
    ).value =
        "0";


    document.getElementById(
        "income-submit-btn"
    ).textContent =
        "Save Income";


    document.getElementById(
        "income-cancel-btn"
    ).classList.add(
        "hidden"
    );

};



/* =========================================================
   STATUS
========================================================= */

function showInlineStatus(
    message
) {

    const box =
        document.getElementById(
            "income-form-status"
        );

    box.textContent =
        message;

    box.classList.remove(
        "hidden"
    );

    setTimeout(
        () => {
            box.classList.add(
                "hidden"
            );
        },
        2200
    );

}



/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const d =
        new Date(
            value +
            "T00:00:00"
        );

    if (
        Number.isNaN(
            d.getTime()
        )
    ) {
        return value;
    }

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}



/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



/* =========================================================
   RENDER
========================================================= */

function renderIncomes() {

    const container =
        document.getElementById(
            "income-list-container"
        );


    const incomes =
        getIncomes();


    const query =
        document.getElementById(
            "search-income"
        ).value
        .trim()
        .toLowerCase();


    const sort =
        document.getElementById(
            "sort-income"
        ).value;


    let records =
        incomes.filter(
            item => {

                if (!query) {
                    return true;
                }

                return item.sourceName
                    .toLowerCase()
                    .includes(query);

            }
        );


    if (
        sort === "name"
    ) {

        records.sort(
            (a, b) =>
                a.sourceName
                    .localeCompare(
                        b.sourceName
                    )
        );

    } else if (
        sort === "date_asc"
    ) {

        records.sort(
            (a, b) =>
                new Date(a.date) -
                new Date(b.date)
        );

    } else if (
        sort === "total_desc"
    ) {

        records.sort(
            (a, b) =>
                b.total -
                a.total
        );

    } else if (
        sort === "total_asc"
    ) {

        records.sort(
            (a, b) =>
                a.total -
                b.total
        );

    } else {

        records.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    }


    /*
       Summary always uses all records.
    */

    const grandTotal =
        getTotalIncome(
            incomes
        );


    document.getElementById(
        "summary-total-income"
    ).textContent =
        money(
            grandTotal
        );


    document.getElementById(
        "summary-record-count"
    ).textContent =
        incomes.length;


    document.getElementById(
        "income-table-total"
    ).textContent =
        money(
            grandTotal
        );


    /*
       Group records.
    */

    const groups =
        {};


    records.forEach(
        item => {

            const key =
                item.sourceName
                    .trim()
                    .toLowerCase();


            if (
                !groups[key]
            ) {

                groups[key] = {
                    name:
                        item.sourceName,

                    items: [],

                    total: 0
                };

            }


            groups[key]
                .items
                .push(item);


            groups[key]
                .total +=
                Number(
                    item.total
                ) || 0;

        }
    );


    const groupList =
        Object.values(
            groups
        );


    document.getElementById(
        "income-group-count"
    ).textContent =
        `${groupList.length} ${
            groupList.length === 1
                ? "group"
                : "groups"
        }`;


    container.innerHTML =
        "";


    if (
        groupList.length === 0
    ) {

        container.innerHTML = `

            <div
                class="py-10 text-center text-slate-500"
            >

                <i
                    class="fa-solid fa-wallet text-3xl mb-3"
                ></i>

                <div class="font-semibold">
                    No income records
                </div>

                <div class="text-xs mt-1">
                    Add your first income above.
                </div>

            </div>

        `;

        return;

    }


    groupList.forEach(
        (group, groupIndex) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "border border-slate-800 rounded-2xl overflow-hidden";


            const header =
                document.createElement(
                    "button"
                );


            header.type =
                "button";


            header.className =
                "w-full flex items-center justify-between p-4 bg-slate-800/40";


            header.innerHTML = `

                <div class="flex items-center gap-3">

                    <div
                        class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center"
                    >
                        <i class="fa-solid fa-wallet"></i>
                    </div>


                    <div class="text-left">

                        <div class="font-bold">
                            ${escapeHtml(
                                group.name
                            )}
                        </div>

                        <div class="text-[10px] text-slate-500">
                            ${group.items.length}
                            ${
                                group.items.length === 1
                                    ? "record"
                                    : "records"
                            }
                        </div>

                    </div>

                </div>


                <div class="flex items-center gap-3">

                    <strong class="text-emerald-400">
                        ${money(
                            group.total
                        )}
                    </strong>

                    <i
                        id="group-icon-${groupIndex}"
                        class="fa-solid fa-chevron-right text-slate-500 transition"
                    ></i>

                </div>

            `;


            const details =
                document.createElement(
                    "div"
                );


            details.className =
                "hidden border-t border-slate-800";


            group.items.forEach(
                item => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "flex items-center justify-between gap-3 px-4 py-3";


                    row.innerHTML = `

                        <div>

                            <div class="font-semibold">
                                ${formatDate(
                                    item.date
                                )}
                            </div>

                            <div class="text-[10px] text-slate-500 mt-1">
                                NPR ${Number(item.npr || 0).toLocaleString("en-IN")}
                                &nbsp; | &nbsp;
                                INR ${Number(item.inr || 0).toLocaleString("en-IN")}
                            </div>

                        </div>


                        <div class="flex items-center gap-3">

                            <strong class="text-emerald-400">
                                ${money(
                                    item.total
                                )}
                            </strong>


                            <button
                                type="button"
                                class="edit-income text-blue-400"
                                data-id="${escapeHtml(item.id)}"
                            >
                                <i class="fa-solid fa-pen"></i>
                            </button>


                            <button
                                type="button"
                                class="delete-income text-rose-400"
                                data-id="${escapeHtml(item.id)}"
                            >
                                <i class="fa-solid fa-trash"></i>
                            </button>

                        </div>

                    `;


                    details.appendChild(
                        row
                    );

                }
            );


            header.addEventListener(
                "click",
                () => {

                    details.classList.toggle(
                        "hidden"
                    );


                    document.getElementById(
                        `group-icon-${groupIndex}`
                    ).classList.toggle(
                        "rotate-90"
                    );

                }
            );


            card.appendChild(
                header
            );


            card.appendChild(
                details
            );


            container.appendChild(
                card
            );

        }
    );


    /*
       EDIT
    */

    container
        .querySelectorAll(
            ".edit-income"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.id;


                        const all =
                            getIncomes();


                        const index =
                            all.findIndex(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (
                            index !== -1
                        ) {

                            moduleEditIncome(
                                index
                            );

                        }

                    }
                );

            }
        );


    /*
       DELETE
    */

    container
        .querySelectorAll(
            ".delete-income"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.id;


                        const all =
                            getIncomes();


                        const index =
                            all.findIndex(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (
                            index !== -1
                        ) {

                            /*
                               No browser alert.
                               Direct delete.
                            */

                            await moduleDeleteIncome(
                                index
                            );


                            renderIncomes();

                        }

                    }
                );

            }
        );

}

window.printFromModal =
function() {

    const content =
        document.getElementById(
            "pdf-printable-content"
        );


    if (!content) {
        return;
    }


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if (!printWindow) {
        return;
    }


    printWindow.document.write(`

        <html>

        <head>

            <title>
                Income Report
            </title>

            <style>

                body {
                    margin:0;
                    background:#fff;
                }

                @page {
                    size:A4;
                    margin:10mm;
                }

            </style>

        </head>

        <body>

            ${content.outerHTML}

        </body>

        </html>

    `);


    printWindow.document.close();


    printWindow.onload =
        function() {

            printWindow.focus();

            printWindow.print();

        };

};



/* =========================================================
   DOWNLOAD
========================================================= */

window.downloadIncomePDF =
async function() {

    const element =
        document.getElementById(
            "pdf-printable-content"
        );


    if (!element) {
        return;
    }


    const name =
        getProfileValue(
            "name",
            "Digital-NoteBook"
        );


    const safeName =
        String(name)
            .replace(
                /[^a-z0-9-_]+/gi,
                "-"
            );


    await html2pdf()
        .set({

            margin: 0,

            filename:
                `${safeName}-Income-Report.pdf`,

            image: {
                type: "jpeg",
                quality: 0.98
            },

            html2canvas: {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff"
            },

            jsPDF: {
                unit: "mm",
                format: "a4",
                orientation: "portrait"
            }

        })
        .from(element)
        .save();

};
